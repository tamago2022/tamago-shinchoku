*{box-sizing:border-box;margin:0;padding:0}html,body{background:#10182a;color:#ece2cc;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100svh;background:#10182a url(img/yoru.jpg) center top/cover fixed}
.mn{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:300}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit;text-decoration:none}
.wrap{max-width:430px;margin:0 auto;padding:22px 22px 120px;position:relative}
.logo{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:12px;letter-spacing:7px;opacity:.85}
.logo small{display:block;font-size:8.5px;letter-spacing:4px;color:#d6aa5c;margin-top:3px}
.thumb{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:16/9;background:#0b1120}
.thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.8) brightness(.85)}
.thumb .pl{position:absolute;inset:0;display:grid;place-items:center;width:100%}
.pl i{width:64px;height:64px;border-radius:50%;background:rgba(16,24,42,.55);border:1px solid rgba(214,170,92,.7);display:grid;place-items:center}
.pl i:after{content:"";border-left:18px solid #ece2cc;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(236,226,204,.28)}
.ic svg{width:20px;height:20px;stroke:#ece2cc;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style><style>
.stage{height:76svh;display:grid;place-items:center;position:relative;transition:height .8s .8s}
.from{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:15px;letter-spacing:.22em;transition:opacity .4s}
.glow{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px;border-radius:50%;background:radial-gradient(circle,rgba(230,190,110,.6),rgba(230,190,110,0) 70%);transition:transform 1.2s ease-out,opacity 1.5s;pointer-events:none}
.candy{position:relative;width:86%;max-width:340px;aspect-ratio:900/440;animation:bob 2.2s ease-in-out infinite}
.candy img{position:absolute;inset:0;width:100%;height:100%}
.candy .l{clip-path:inset(0 50% 0 0)}.candy .r{clip-path:inset(0 0 0 50%)}
.hint{position:absolute;bottom:22%;left:0;right:0;text-align:center;opacity:.6;font-size:22px;animation:hint 1.4s ease-in-out infinite;transition:opacity .3s}
@keyframes bob{50%{transform:translateY(-7px) rotate(-2deg)}}
@keyframes hint{50%{transform:translateY(-7px);opacity:.2}}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(4deg)}}
.opening .candy{animation:wig .5s ease-in-out}
.opened .candy{animation:none}
.opened .candy .l{transform:translate(-70%,-18%) rotate(-40deg);opacity:0;transition:transform 1s cubic-bezier(.3,.7,.3,1),opacity .9s .3s}
.opened .candy .r{transform:translate(70%,14%) rotate(36deg);opacity:0;transition:transform 1s cubic-bezier(.3,.7,.3,1),opacity .9s .3s}
.opened .glow{transform:scale(6);opacity:0}.opened .from{opacity:0}.opened .hint{display:none}
.opened .stage{height:18svh}
.inside{opacity:0;transform:translateY(18px);transition:opacity .9s .7s,transform .9s .7s;pointer-events:none}
.opened .inside{opacity:1;transform:none;pointer-events:auto}
.who{font-size:12px;letter-spacing:.25em;opacity:.7}
.msg{font-size:23px;line-height:1.75;margin:10px 0 28px;letter-spacing:.04em;white-space:pre-wrap}
.st{font-size:18px;margin-top:14px}.sa{font-size:11px;letter-spacing:3px;opacity:.65;margin-top:4px}
.tp{display:flex;gap:10px;margin-top:22px}.tp button{flex:0 0 30%;text-align:left;opacity:.7}.tp button.cur{opacity:1}
.tp img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px}.tp span{display:block;font-size:10px;margin-top:5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp button.cur img{outline:1.5px solid #d6aa5c;outline-offset:2px}
.art{display:flex;gap:12px;align-items:center;margin-top:34px;padding:16px 0;border-top:1px solid rgba(236,226,204,.15);border-bottom:1px solid rgba(236,226,204,.15);font-size:13.5px}
.art img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:3px}
.page{display:block;font-size:11px;letter-spacing:2px;opacity:.6;margin-top:10px;text-align:right}
.back{display:flex;align-items:center;justify-content:center;gap:8px;margin:40px auto 0;height:56px;border-radius:28px;border:1px solid rgba(214,170,92,.7);width:100%;font-size:15px;letter-spacing:.14em}
.back img{width:58px}
</style></head><body><div class="wrap">
<div class="logo">ごきげん補給所<small>JOY RELIEF STATION</small></div>
<div class="stage" id="stage"><div class="from mn" id="from"></div><div class="glow"></div>
<button class="candy" id="candy" aria-label="ひらく"><img class="l" src="img/ame-koke.png" alt=""><img class="r" src="img/ame-koke.png" alt=""></button>
<div class="hint">☝︎</div></div>
<div class="inside" id="inside">
<div class="who" id="who"></div><p class="msg mn" id="msg"></p>
<div class="thumb" id="th"><div id="yt"></div><img id="poster" alt="" style="position:absolute;inset:0"><button class="pl" id="play" aria-label="再生"><i></i></button></div>
<div class="st mn" id="st"></div><div class="sa" id="sa"></div>
<div class="tp" id="tp"></div>
<a class="art" id="art"></a><a class="page" id="page">♪ →</a>
<a class="back mn" id="back"><img src="img/ame-koke.png" alt="">↩ お返し</a>
</div></div>
<script>const SONGS={"kaze": {"t": "風をあつめて", "a": "はっぴいえんど", "y": "kTPw8tJLdtw", "p": "https://joy-relief-station.lovable.app/cover-guide?artist=%E3%81%AF%E3%81%A3%E3%81%B2-%E3%81%84%E3%81%88%E3%82%93%E3%81%A8&song=%E9%A2%A8%E3%82%92%E3%81%82%E3%81%A4%E3%82%81%E3%81%A6", "who": "70年代に青春を過ごした人へ", "msg": "お父さん、これ聴いたことあるはず ♪", "art": "josh", "top": ["josh", "pris", "tahiti"]}, "lovely": {"t": "Lovely Day", "a": "Bill Withers", "y": "bEeaS6fuUoA", "p": "https://joy-relief-station.lovable.app/cover-guide?artist=bill-withers&song=lovely-day", "who": "朝がちょっと重たい人へ", "msg": "朝いちばんに、どうぞ ♪", "art": "takou", "top": ["sirduke", "happy", "k24"]}, "sirduke": {"t": "Sir Duke", "a": "Stevie Wonder", "y": "ETFvmkIA6S4", "p": "https://joy-relief-station.lovable.app/cover-guide?artist=stevie-wonder&song=sir-duke", "who": "昔レコードを集めていた人へ", "msg": "これ、家で鳴ってなかった？ ♪", "art": "takou", "top": ["lovely", "k24", "sugar"]}, "owari": {"t": "owari no kisetsu", "a": "rei harakami", "y": "wC1z9sNSaXo", "p": "https://joy-relief-station.lovable.app/cover-guide?artist=rei-harakami&song=owari-no-kisetsu", "who": "静かな夜が好きな人へ", "msg": "夜に、ひとりで聴いてみて ♪", "art": "harakami", "top": ["senko", "bara", "kaze"]}, "senko": {"t": "閃光", "a": "UA", "y": "eMRTkimQJWM", "p": "https://joy-relief-station.lovable.app/cover-guide?artist=u-a&song=senko", "who": "2000年代に20代だった人へ", "msg": "あの頃の音、覚えてる？ ♪", "art": "harakami", "top": ["bara", "owari"]}, "happy": {"t": "Happy", "a": "Pharrell Williams", "y": "ZbZSe6N_BXs", "p": "https://joy-relief-station.lovable.app/cover-guide?artist=pharrell-williams&song=happy", "who": "孫の動画で踊っちゃう人へ", "msg": "これで一緒に踊ろう ♪", "art": "takou", "top": ["lovely", "k24", "sirduke"]}, "josh": {"t": "風をあつめて", "a": "Josh Turner", "y": "QeWtMZYjnCE", "p": "https://joy-relief-station.lovable.app/cover-guide?artist=josh-turner-guitar&song=%E9%A2%A8%E3%82%92%E3%81%82%E3%81%A4%E3%82%81%E3%81%A6"}, "pris": {"t": "風をあつめて", "a": "Priscilla Ahn", "y": "SWBVVgLBWvA", "p": "https://joy-relief-station.lovable.app/cover-guide?artist=priscilla-ahn&song=kaze-wo-atsumete"}, "tahiti": {"t": "Kaze Wo Atsumete", "a": "Tahiti 80", "y": "lp6rkCyAaFc", "p": "https://joy-relief-station.lovable.app/cover-guide?artist=tahiti-80&song=%E9%A2%A8%E3%82%92%E3%81%82%E3%81%A4%E3%82%81%E3%81%A6"}, "k24": {"t": "24K Magic", "a": "Bruno Mars", "y": "UqyT8IEBkvY", "p": "https://joy-relief-station.lovable.app/cover-guide?artist=bruno-mars&song=24k-magic"}, "sugar": {"t": "Sugar", "a": "Maroon 5", "y": "09R8_2nJtjg", "p": "https://joy-relief-station.lovable.app/cover-guide?artist=maroon-5&song=sugar"}, "bara": {"t": "ばらの花", "a": "くるり", "y": "baNgL0jFkAs", "p": "https://joy-relief-station.lovable.app/cover-guide?artist=quruli&song=%E3%81%AF-%E3%82%89%E3%81%AE%E8%8A%B1"}},ARTS={"josh": {"t": "弾き語り・ジョシュ・ターナー編", "u": "https://joy-relief-station.lovable.app/magazine/hikigatari-josh-turner.html", "y": "kTPw8tJLdtw"}, "takou": {"t": "楽しくなりたいから ― 多幸感ポップス", "u": "https://joy-relief-station.lovable.app/magazine/naze-ongaku-01-takoukan.html", "y": "bEeaS6fuUoA"}, "harakami": {"t": "君はレイ・ハラカミを知っているか", "u": "https://joy-relief-station.lovable.app/magazine/rei-harakami.html", "y": "wC1z9sNSaXo"}},COLORS=[["ai", "#3a5684"], ["shu", "#c1442e"], ["kin", "#c4983e"], ["koke", "#688260"], ["sakura", "#c48c8c"], ["kinari", "#e2d4b6"]],MAINS=["kaze", "lovely", "sirduke", "owari", "senko", "happy"],BASE="https://tamago2022.github.io/tamago-shinchoku/lab/ame-k7q3x9/";
const Q=new URLSearchParams(location.search),$=id=>document.getElementById(id),yt=(y,q)=>`https://i.ytimg.com/vi/${y}/${q||'hqdefault'}.jpg`;
function dec(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');const b=atob(s);return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))));}catch(e){return null}}
const g=dec(Q.get('g')||'')||{f:'',m:'',s:'kaze',t:[],v:'A'};
const main=SONGS[g.s]&&SONGS[g.s].who?g.s:'kaze',s=SONGS[main];
$('from').textContent=g.f?g.f+'さんから':'';$('who').textContent=g.f?'from '+g.f:'';
$('msg').textContent=g.m||'';
const list=[main,...(g.t||[]).filter(k=>SONGS[k]).slice(0,3)];
let player=null,ready=false,curK=main;
function show(k){curK=k;$('st').textContent=SONGS[k].t;$('sa').textContent=SONGS[k].a;$('page').href=SONGS[k].p;}
show(main);$('poster').src=yt(s.y);
if(list.length>1)$('tp').innerHTML=list.map((k,i)=>`<button data-k="${k}" class="${i?'':'cur'}"><img src="${yt(SONGS[k].y,'mqdefault')}" alt=""><span>${i?'＋ ':''}${SONGS[k].a}</span></button>`).join('');
const a=ARTS[s.art];$('art').href=a.u;$('art').innerHTML=`<img src="${yt(a.y,'mqdefault')}" alt=""><span class="mn">${a.t} →</span>`;
$('back').href='okuru.html?v='+encodeURIComponent(g.v||'A')+'&to='+encodeURIComponent(g.f||'♪');
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{width:'100%',height:'100%',videoId:s.y,playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true}}});};
function loadAPI(){if(document.getElementById('ytapi'))return;const t=document.createElement('script');t.id='ytapi';t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t);}
function uncover(){const p=$('poster'),b=$('play');p&&p.remove();b&&b.remove();}
function play(k){if(ready&&player){k===main&&!player._used?player.playVideo():player.loadVideoById(SONGS[k].y);player._used=1;uncover();}
 else{$('th').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${SONGS[k].y}?autoplay=1&playsinline=1&rel=0" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;}}
$('play').onclick=()=>play(curK);
$('tp').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('tp').children].forEach(x=>x.classList.toggle('cur',x===b));show(b.dataset.k);play(b.dataset.k);};
let done=false;
function unwrap(){if(done)return;done=true;loadAPI();document.body.classList.add('opening');setTimeout(()=>document.body.classList.add('opened'),480);}
$('candy').onclick=unwrap;
if(Q.get('demo')==='open'){done=true;loadAPI();document.body.classList.add('opened');}
</script></body></html>
