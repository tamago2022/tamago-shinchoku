<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><!--tamago-dark 2：この試作は独自の配色。1168番で暗くしない--><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow"><meta name="theme-color" content="#10182a"><title>試作｜曲ページ</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#10182a;color:#ece2cc;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100svh;background:#10182a url(img/yoru.jpg) center top/cover fixed}
.mn{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:300}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit;text-decoration:none}
.wrap{max-width:430px;margin:0 auto;padding:22px 22px 120px;position:relative}
.logo{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:12px;letter-spacing:7px;opacity:.85}
.logo small{display:block;font-size:8.5px;letter-spacing:4px;color:#d6aa5c;margin-top:3px}
.thumb{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:16/9;background:#0b1120}
.thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) brightness(.85)}
.thumb .pl{position:absolute;inset:0;display:grid;place-items:center;width:100%}
.pl i{width:60px;height:60px;border-radius:50%;background:rgba(16,24,42,.55);border:1px solid rgba(214,170,92,.7);display:grid;place-items:center}
.pl i:after{content:"";border-left:17px solid #ece2cc;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:5px}
.thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yr{font-size:11px;letter-spacing:3px;color:#d6aa5c}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(236,226,204,.28)}
.ic svg{width:20px;height:20px;stroke:#ece2cc;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.line{height:52px;border-radius:26px;background:#06c755;color:#fff;font-size:16px;font-weight:600;letter-spacing:.06em;width:100%}
.vtag{position:fixed;top:12px;right:14px;font-size:10px;letter-spacing:2px;opacity:.4}
</style><style>
.song{margin-top:34px}.ttl{font-size:30px;margin-top:18px;letter-spacing:.04em}.by{font-size:12px;letter-spacing:3px;opacity:.7;margin-top:6px}
.acts{display:flex;gap:12px;margin-top:22px;align-items:center}
.veil{position:fixed;inset:0;background:rgba(5,9,18,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:#f3ecdc;color:#1b2440;border-radius:20px 20px 0 0;padding:12px 20px 26px;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:9;max-height:92svh;overflow:auto}
.open .veil{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.grip{width:38px;height:4px;border-radius:2px;background:#1b244033;margin:0 auto 14px}
.chip{font-size:12px;letter-spacing:.06em;border:1px solid #b98a3c;color:#7d5a1e;border-radius:999px;padding:5px 12px;width:max-content;margin:0 auto 14px}
.pa{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.pa button{padding:7px 16px;border-radius:999px;border:1px solid #1b244033;font-size:14px}.pa button.sel{background:#1b2440;color:#f3ecdc;border-color:#1b2440}
.byr{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;font-size:13px;opacity:.85}
.byr select{font-size:22px;border-bottom:1px solid #1b244055;padding:2px 6px;color:#1b2440;-webkit-appearance:none;appearance:none;text-align:center}
.say{font-size:21px;line-height:1.7;text-align:center;margin:4px 0 18px;letter-spacing:.03em}
.say b{font-weight:400;color:#a8432c}
textarea{width:100%;border:1px solid #1b244026;background:#fffaf0;border-radius:10px;padding:11px 12px;font-size:16px;color:#1b2440;font-family:inherit;resize:none;margin-bottom:12px}
.pair{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.pair>div{flex:1}.pair img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px}
.pair .yr{color:#9a6b22;display:block;margin-top:5px}.pair span{font-size:11px;display:block;opacity:.8;margin-top:1px}
.pair .x{flex:0 0 auto;align-self:center;font-size:14px;opacity:.5}
.sub{font-size:10.5px;opacity:.55;text-align:center;margin:-4px 0 12px}
</style></head><body><div class="wrap">
<div class="logo">ごきげん補給所<small>JOY RELIEF STATION</small></div>
<div class="song"><div class="thumb" id="th"></div><h1 class="ttl mn" id="ttl"></h1><div class="by" id="by"></div>
<div class="acts"><button class="ic" id="bShare" aria-label="共有"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"/></svg></button></div></div>
</div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="body"></div>
<button class="line" id="bLine">LINEで送る</button></div>
<div class="vtag" id="vtag"></div>
<script>const SONGS={"kaze": {"t": "風をあつめて", "a": "はっぴいえんど", "y": "FQKUP4uT0pU", "yr": 1971, "p": "https://joy-relief-station.lovable.app/cover-guide?artist=%E3%81%AF%E3%81%A3%E3%81%B2-%E3%81%84%E3%81%88%E3%82%93%E3%81%A8&song=%E9%A2%A8%E3%82%92%E3%81%82%E3%81%A4%E3%82%81%E3%81%A6", "age": 20, "by": 1951, "pa": "f", "pair": {"o": "kaze", "c": "josh"}}, "second": {"t": "セカンド・ラブ", "a": "中森明菜", "y": "i5U93W19Ays", "yr": 1982, "p": "https://joy-relief-station.lovable.app/cover-guide?artist=akina&song=second-love", "age": 10, "by": 1966, "pa": "m", "pair": {"o": "kazari", "c": "kinggnu", "sub": true}}, "josh": {"t": "風をあつめて", "a": "Josh Turner", "y": "QeWtMZYjnCE", "yr": 2020, "p": "https://joy-relief-station.lovable.app/cover-guide?artist=josh-turner-guitar&song=%E9%A2%A8%E3%82%92%E3%81%82%E3%81%A4%E3%82%81%E3%81%A6"}, "kazari": {"t": "飾りじゃないのよ涙は", "a": "中森明菜", "y": "YQ2KBG8DeMA", "yr": 1984, "p": "https://joy-relief-station.lovable.app/cover-guide?artist=akina&song=kazari-jya-naino-yo-namida-wa"}, "kinggnu": {"t": "飾りじゃないのよ涙は", "a": "King Gnu", "y": "cAVnxFszvKo", "yr": 2019, "p": "https://joy-relief-station.lovable.app/cover-guide?artist=king-gnu&song=kazari-janai"}},BASE="https://tamago2022.github.io/tamago-shinchoku/lab/oyako-k7q3x9/";
const $=id=>document.getElementById(id),Q=new URLSearchParams(location.search),yt=(y,q)=>`https://i.ytimg.com/vi/${y}/${q||'hqdefault'}.jpg`;
function thumb(el,k){const s=SONGS[k];el.innerHTML=`<img src="${yt(s.y)}" alt=""><button class="pl" aria-label="再生"><i></i></button>`;
 el.querySelector('.pl').onclick=()=>{el.insertAdjacentHTML('beforeend',`<iframe src="https://www.youtube-nocookie.com/embed/${s.y}?autoplay=1&playsinline=1&rel=0" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`)};}
const PA={f:'お父さん',m:'お母さん'};
function toLine(text){location.href='https://line.me/R/share?text='+encodeURIComponent(text);}

const V=(Q.get('v')||'A').toUpperCase(),K=SONGS[Q.get('s')]&&SONGS[Q.get('s')].pair?Q.get('s'):'kaze',s=SONGS[K];
let pa=Q.get('p')||s.pa,by=+(Q.get('by')||s.by);
$('vtag').textContent=V;thumb($('th'),K);$('ttl').textContent=s.t;$('by').textContent=s.a+'　'+s.yr;
const paBtns=()=>`<div class="pa">${['f','m'].map(k=>`<button data-p="${k}" class="${k===pa?'sel':''}">${PA[k]}</button>`).join('')}</div>`;
function url(m){return BASE+'r.html?s='+K+'&m='+m+'&p='+pa;}
function sayA(){const d=s.yr-by;return d>=0?`この曲が出た${s.yr}年、${PA[pa]}は<b>${d}歳</b>のころ。`:`この曲が出た${s.yr}年、${PA[pa]}は<b>生まれる${-d}年前</b>。`;}
const who=()=>`♪ ${Math.floor(s.yr/10)*10}年代に${s.age}代だった人に`;
function draw(){let h='';
 if(V==='A'){h=paBtns()+`<div class="byr"><select id="sel">${Array.from({length:46},(_,i)=>1935+i).map(y=>`<option${y===by?' selected':''}>${y}</option>`).join('')}</select>年生まれ</div><p class="say mn" id="say">${sayA()}</p>`;}
 if(V==='B'){h=paBtns()+`<textarea id="msg" rows="2">${PA[pa]}、この曲知ってる？</textarea>`;}
 if(V==='C'){const P=s.pair,o=SONGS[P.o],c=SONGS[P.c];h=paBtns()+`<div class="pair"><div><img src="${yt(o.y,'mqdefault')}" alt=""><span class="yr">${o.yr}</span><span>${o.a}</span></div><div class="x">×</div><div><img src="${yt(c.y,'mqdefault')}" alt=""><span class="yr">${c.yr}</span><span>${c.a}</span></div></div>`+(P.sub?`<p class="sub">この曲の今の世代のカバーは棚にまだ無いので、同じ明菜の「${o.t}」で</p>`:'')+`<textarea id="msg" rows="2">${PA[pa]}の曲を、今の人がこう歌ってる ♪</textarea>`;}
 if(V==='D'){h=`<div class="chip">${who()}</div><textarea id="msg" rows="2" placeholder="ひとこと"></textarea>`;}
 $('body').innerHTML=h;
 $('body').querySelectorAll('.pa button').forEach(b=>b.onclick=()=>{pa=b.dataset.p;draw();});
 const sel=$('sel');if(sel)sel.onchange=()=>{by=+sel.value;$('say').innerHTML=sayA();};
}
$('bLine').onclick=()=>{let t;
 if(V==='A')t=$('say').textContent+'\n'+s.t+'／'+s.a+'\n'+url('A');
 else t=($('msg').value.trim()?$('msg').value.trim()+'\n':'')+url(V);
 toLine(t);};
const openS=()=>{draw();document.body.classList.add('open');};
$('bShare').onclick=openS;$('veil').onclick=()=>document.body.classList.remove('open');
if(Q.get('demo')==='sheet')openS();
</script></body></html>
