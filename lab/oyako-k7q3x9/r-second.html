*{box-sizing:border-box;margin:0;padding:0}html,body{background:#10182a;color:#ece2cc;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100svh;background:#10182a url(img/yoru.jpg) center top/cover fixed}
.mn{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:300}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit;text-decoration:none}
.wrap{max-width:430px;margin:0 auto;padding:22px 22px 120px;position:relative}
.logo{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:12px;letter-spacing:7px;opacity:.85}
.logo small{display:block;font-size:8.5px;letter-spacing:4px;color:#d6aa5c;margin-top:3px}
.thumb{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:16/9;background:#0b1120}
.thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) brightness(.85)}
.thumb .pl{position:absolute;inset:0;display:grid;place-items:center;width:100%}
.pl i{width:60px;height:60px;border-radius:50%;background:rgba(16,24,42,.55);border:1px solid rgba(214,170,92,.7);display:grid;place-items:center}
.pl i:after{content:"";border-left:17px solid #ece2cc;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:5px}
.thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yr{font-size:11px;letter-spacing:3px;color:#d6aa5c}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(236,226,204,.28)}
.ic svg{width:20px;height:20px;stroke:#ece2cc;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.line{height:52px;border-radius:26px;background:#06c755;color:#fff;font-size:16px;font-weight:600;letter-spacing:.06em;width:100%}
.vtag{position:fixed;top:12px;right:14px;font-size:10px;letter-spacing:2px;opacity:.4}
</style><style>
.q{font-size:24px;margin:40px 0 22px;letter-spacing:.05em;line-height:1.6}
.ttl{font-size:19px;margin-top:14px}.by{font-size:11px;letter-spacing:3px;opacity:.7;margin-top:5px}
.ans{display:flex;flex-direction:column;gap:10px;margin-top:30px}
.ans button{height:52px;border-radius:26px;border:1px solid rgba(214,170,92,.7);font-size:16px;letter-spacing:.1em}
.ans button:active{background:rgba(214,170,92,.15)}
.memo{display:none;margin-top:12px}.memo.on{display:block}
.memo textarea{width:100%;border:0;background:#f3ecdc;border-radius:10px;padding:11px 12px;font-size:16px;color:#1b2440;font-family:inherit;resize:none;margin-bottom:10px}
.pairbox{margin-top:30px;display:flex;flex-direction:column;gap:18px}
.gap{text-align:center;font-size:11px;letter-spacing:4px;color:#d6aa5c;opacity:.85}
.page{display:block;font-size:11px;letter-spacing:2px;opacity:.6;margin-top:28px;text-align:right}
</style></head><body><div class="wrap">
<div class="logo">ごきげん補給所<small>JOY RELIEF STATION</small></div>
<div id="main"></div>
<a class="page" id="page">曲のページ →</a>
</div>
<script>const SONGS={"kaze": {"t": "風をあつめて", "a": "はっぴいえんど", "y": "FQKUP4uT0pU", "yr": 1971, "p": "https://joy-relief-station.lovable.app/cover-guide?artist=%E3%81%AF%E3%81%A3%E3%81%B2-%E3%81%84%E3%81%88%E3%82%93%E3%81%A8&song=%E9%A2%A8%E3%82%92%E3%81%82%E3%81%A4%E3%82%81%E3%81%A6", "age": 20, "by": 1951, "pa": "f", "pair": {"o": "kaze", "c": "josh"}}, "second": {"t": "セカンド・ラブ", "a": "中森明菜", "y": "i5U93W19Ays", "yr": 1982, "p": "https://joy-relief-station.lovable.app/cover-guide?artist=akina&song=second-love", "age": 10, "by": 1966, "pa": "m", "pair": {"o": "kazari", "c": "kinggnu", "sub": true}}, "josh": {"t": "風をあつめて", "a": "Josh Turner", "y": "QeWtMZYjnCE", "yr": 2020, "p": "https://joy-relief-station.lovable.app/cover-guide?artist=josh-turner-guitar&song=%E9%A2%A8%E3%82%92%E3%81%82%E3%81%A4%E3%82%81%E3%81%A6"}, "kazari": {"t": "飾りじゃないのよ涙は", "a": "中森明菜", "y": "YQ2KBG8DeMA", "yr": 1984, "p": "https://joy-relief-station.lovable.app/cover-guide?artist=akina&song=kazari-jya-naino-yo-namida-wa"}, "kinggnu": {"t": "飾りじゃないのよ涙は", "a": "King Gnu", "y": "cAVnxFszvKo", "yr": 2019, "p": "https://joy-relief-station.lovable.app/cover-guide?artist=king-gnu&song=kazari-janai"}},BASE="https://tamago2022.github.io/tamago-shinchoku/lab/oyako-k7q3x9/";
const $=id=>document.getElementById(id),Q=new URLSearchParams(location.search),yt=(y,q)=>`https://i.ytimg.com/vi/${y}/${q||'hqdefault'}.jpg`;
function thumb(el,k){const s=SONGS[k];el.innerHTML=`<img src="${yt(s.y)}" alt=""><button class="pl" aria-label="再生"><i></i></button>`;
 el.querySelector('.pl').onclick=()=>{el.insertAdjacentHTML('beforeend',`<iframe src="https://www.youtube-nocookie.com/embed/${s.y}?autoplay=1&playsinline=1&rel=0" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`)};}
const PA={f:'お父さん',m:'お母さん'};
function toLine(text){location.href='https://line.me/R/share?text='+encodeURIComponent(text);}

const K='second',s=SONGS[K],M=(Q.get('m')||'A').toUpperCase(),pa=Q.get('p')||s.pa;
function block(k){const x=SONGS[k];return `<div><div class="thumb" data-k="${k}"></div><div class="ttl mn">${x.t}</div><div class="by">${x.a}　<span class="yr">${x.yr}</span></div></div>`;}
let h='';
if(M==='B')h=`<p class="q mn">この曲、知ってる？</p>`+block(K)+`<div class="ans"><button data-a="知ってる！">知ってる！</button><button data-a="初めて聴いた">初めて聴いた</button><button data-a="思い出がある" id="mem">思い出がある</button></div><div class="memo" id="memo"><textarea id="mt" rows="3" placeholder="どんな？"></textarea><button class="line" id="mSend">LINEで返す</button></div>`;
else if(M==='C'){const P=s.pair,o=SONGS[P.o],c=SONGS[P.c];h=`<div class="pairbox" style="margin-top:34px">${block(P.o)}<div class="gap">↓　${c.yr-o.yr}年後　↓</div>${block(P.c)}</div>`;}
else h=`<div style="margin-top:34px">${block(K)}</div>`;
$('main').innerHTML=h;document.querySelectorAll('.thumb[data-k]').forEach(el=>thumb(el,el.dataset.k));
$('page').href=s.p;
const tag='「'+s.t+'」'+s.a;
document.querySelectorAll('.ans button').forEach(b=>b.onclick=()=>{if(b.id==='mem'){$('memo').classList.add('on');$('mt').focus();return;}toLine(b.dataset.a+'\n'+tag);});
if($('mSend'))$('mSend').onclick=()=>toLine('思い出がある\n'+tag+($('mt').value.trim()?'\n'+$('mt').value.trim():''));
if(Q.get('demo')==='memo'&&$('memo'))$('memo').classList.add('on');
</script></body></html>
