<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>進捗表</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
/* 余白・寸法に % を使わない（横長のとき上が詰まる事故の原因）。すべて px / rem。 */
:root{
  --ink:#1c1a17; --sub:#6d675f; --line:#ddd7cd; --paper:#f7f4ee; --card:#fffdf9;
  --green:#2f7a48; --amber:#9a6a12; --grey:#8a847c; --red:#a33b2a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; padding:16px 14px 48px;
  background:var(--paper); color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
}
.wrap{max-width:680px; margin-left:auto; margin-right:auto}
header{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px}
h1{font-size:19px; margin:0; letter-spacing:.02em}
.stamp{font-size:12px; color:var(--sub)}
button{
  font:inherit; font-size:14px; padding:9px 14px; min-height:44px;
  border:1px solid var(--line); border-radius:10px; background:var(--card);
  color:var(--ink); cursor:pointer;
}
button:active{background:#efe9df}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px 14px 12px; margin-bottom:12px;
}
.card h2{font-size:13px; margin:0 0 10px; color:var(--sub); font-weight:600; letter-spacing:.06em}
ul{list-style:none; margin:0; padding:0}
li{padding:7px 0; border-top:1px solid #eee7dc}
li:first-child{border-top:0}
.n{font-variant-numeric:tabular-nums; color:var(--sub); margin-right:6px}
.meta{font-size:12px; color:var(--sub)}
a{color:#2a5b8f}
.empty{color:var(--grey); font-size:14px}
/* 週の目盛り：pace.json 一本だけを見る */
.big{font-size:30px; font-variant-numeric:tabular-nums; line-height:1.2}
.gauge{height:10px; border:1px solid var(--line); border-radius:6px; background:#efe9df; overflow:hidden; margin:8px 0 6px}
.gauge i{display:block; height:10px; background:var(--green); transform:scaleX(0); transform-origin:left center}
.gauge.over i{background:var(--red)}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:baseline}
.d-green{background:var(--green)} .d-amber{background:var(--amber)} .d-grey{background:var(--grey)}
.tally{display:flex; gap:16px; flex-wrap:wrap; margin-top:4px; font-size:14px}
details{margin-top:6px; border-top:1px solid #eee7dc; padding-top:8px}
summary{cursor:pointer; font-size:13px; color:var(--sub); min-height:32px; padding:4px 0}
details .body{font-size:13px; color:var(--sub); padding-top:6px}
footer{margin-top:18px; font-size:12px; color:var(--sub)}
footer a{margin-right:14px; display:inline-block; padding:4px 0}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>進捗表</h1>
  <span class="stamp" id="stamp">読み込み中…</span>
  <button id="reload" type="button">押して読み直す</button>
</header>

<!-- ① いま走っているもの -->
<section class="card">
  <h2>いま走っているもの</h2>
  <ul id="running"><li class="empty">…</li></ul>
</section>

<!-- ② 次に発車 -->
<section class="card">
  <h2>次に発車</h2>
  <ul id="next"><li class="empty">…</li></ul>
</section>

<!-- ③ できたもの -->
<section class="card">
  <h2>できたもの</h2>
  <ul id="done"><li class="empty">…</li></ul>
  <div class="tally" id="verify"></div>
  <!-- 画面の中の唯一のトグル。既定は畳んだ状態（open を付けない）。 -->
  <details id="rule">
    <summary>緑の付け方</summary>
    <div class="body">
      記録されたURLの実物がこのリポジトリにあり、ファイル名の先頭番号がその項目の番号と
      一致したときだけ緑。URLが無いものは「完了」と呼ばず未検証に置く。
      置き場は <code>status/verify_log.jsonl</code>。
    </div>
  </details>
</section>

<!-- ④ 週の残り -->
<section class="card">
  <h2>週の残り</h2>
  <div class="big" id="remain">…</div>
  <div class="gauge" id="gauge"><i style="width:0"></i></div>
  <div class="meta" id="paceMeta"></div>
</section>

<footer>
  <a href="index_full.html">前の進捗表（全部入り）</a>
  <a href="share/done/">できたもの一覧</a>
  <a href="money.html">お金</a>
</footer>

</div>
<script>
var SRC = "status/public/top_status.json";
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function put(el, rows){
  el.innerHTML = rows.length ? rows.join("") : '<li class="empty">ありません</li>';
}

function render(d){
  var s = d.generatedAt ? String(d.generatedAt).replace("T"," ").slice(0,16) : "";
  $("stamp").textContent = s ? (s + " 時点") : "";

  // ① 走行中
  var r = (d.runningNow || []).map(function(x){
    var meta = [];
    if (x.elapsedMin != null) meta.push(Math.round(x.elapsedMin) + "分");
    if (x.model) meta.push(x.model);
    return '<li><span class="n">' + esc(x.n) + '</span>' + esc(x.label) +
      (meta.length ? '<div class="meta">' + esc(meta.join(" ・ ")) + '</div>' : '') + '</li>';
  });
  if (!r.length && d.stoppedReason) r = ['<li class="empty">' + esc(d.stoppedReason) + '</li>'];
  put($("running"), r);

  // ② 次に発車
  put($("next"), (d.nextUp || []).map(function(x){
    return '<li><span class="n">' + esc(x.n) + '</span>' + esc(x.label) + '</li>';
  }));

  // ③ できたもの
  put($("done"), (d.recentDone || []).map(function(x){
    var t = x.ts ? String(x.ts).replace("T"," ").slice(5,16) : "";
    var title = esc(x.title);
    var body = x.url
      ? '<span class="dot d-green"></span><a href="' + esc(x.url) + '">' + title + '</a>'
      : '<span class="dot d-grey"></span>' + title;
    return '<li><span class="n">' + esc(x.n) + '</span>' + body +
      (t ? '<div class="meta">' + esc(t) + '</div>' : '') + '</li>';
  }));

  var v = d.verify;
  $("verify").innerHTML = v
    ? '<span><span class="dot d-green"></span>緑 ' + v.verified + '</span>' +
      '<span><span class="dot d-amber"></span>要再確認 ' + v.recheck + '</span>' +
      '<span><span class="dot d-grey"></span>未検証 ' + v.unverified + '</span>' +
      '<span class="meta">（完了 ' + v.total + ' 件）</span>'
    : '<span class="meta">検証の記録がまだありません</span>';

  // ④ 週の残り（pace.json 一本だけ）
  var p = d.pace;
  if (p) {
    var remain = p.remainWeek;
    $("remain").textContent = (remain == null ? "—" : remain + "%") + " 残り";
    var g = $("gauge");
    g.className = "gauge" + (p.state === "over" ? " over" : "");
    // 使った割合ぶんだけ横に伸ばす（幅に % を使わず scaleX で出す）
    var used = Math.max(0, Math.min(100, 100 - (remain == null ? 100 : remain)));
    g.firstChild.style.transform = "scaleX(" + (used / 100) + ")";
    var meta = [];
    if (p.usedToday != null && p.budgetToday != null)
      meta.push("今日 " + p.usedToday + "% / 予算 " + p.budgetToday + "%");
    if (p.daysLeft != null) meta.push("あと " + p.daysLeft + "日");
    if (p.resetAt) meta.push(p.resetAt + " リセット");
    if (p.updatedAt) meta.push(p.updatedAt + " 時点");
    $("paceMeta").textContent = meta.join(" ・ ") + "（pace.json 一本）";
  } else {
    $("remain").textContent = "—";
    $("paceMeta").textContent = "pace の記録が読めませんでした";
  }
}

function load(manual){
  // 既定の読み込みは ?t= を付けない（毎回ちがう数字を付けるとキャッシュが一切効かない）。
  // 押して読み直したときだけ、その1回に限り新しい数字を付ける。
  var url = manual ? (SRC + "?r=" + Date.now()) : SRC;
  fetch(url, manual ? {cache:"no-store"} : {})
    .then(function(res){ if(!res.ok) throw new Error(res.status); return res.json(); })
    .then(render)
    .catch(function(e){ $("stamp").textContent = "読めませんでした（" + e.message + "）"; });
}

$("reload").addEventListener("click", function(){
  $("stamp").textContent = "読み直しています…";
  load(true);
});
// 自動更新はしない（ページごと読み直していたのが、見ている途中で位置がずれる原因だった）
load(false);
</script>
</body>
</html>
