<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>進捗表</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="進捗表">
<meta name="theme-color" content="#1a2030">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    --bg:#1a2030;        /* 夜の藍 */
    --card:#212839;
    --line:#2f3749;
    --ink:#e9e2d3;       /* 生成り */
    --sub:#9aa1ad;
    --dim:#6b7280;
    --kinari:#d6cdba;
    --green:#6f9c7a;     /* 作業中（くすんだ緑） */
    --yellow:#c9a24a;    /* 承認待ち（くすんだ黄） */
    --red:#d24d3e;       /* 異常。ここだけ強い */
    --blue:#6f8fb0;      /* 完了（報告済み）。くすんだ青 */
    --red-bg:#3a2320;
    --gray:#4b5364;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{
    margin:0;
    padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 32px) calc(env(safe-area-inset-left) + 12px);
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:16px; line-height:1.5;
    -webkit-text-size-adjust:100%;
    max-width:640px; margin-left:auto; margin-right:auto;
    overflow-x:hidden;
  }
  a{color:inherit;}
  h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    font-weight:400; font-size:1.2rem; letter-spacing:0.12em;
    margin:6px 0 0;
  }
  .updated{color:var(--sub); font-size:0.72rem; margin:0 0 10px;}

  /* Macの状態（1行・小さく） */
  /* メーター（ゲージ）：数字より感覚。緑＝余裕／黄＝考える／赤＝止める判断 */
  .meters{margin:0 0 6px;}
  .meter{margin-bottom:12px;}
  .meter:last-child{margin-bottom:0;}
  .meter .mtitle{display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-size:0.76rem; color:var(--sub); margin-bottom:5px;}
  .meter .mtitle b{color:var(--ink); font-weight:500; font-size:0.8rem;}
  .meter .mtitle .val{font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap;}
  .meter .val.green{color:var(--green);} .meter .val.yellow{color:var(--yellow);} .meter .val.red{color:var(--red);}
  .meter .mtitle .fresh{font-size:0.68rem; color:var(--dim); font-variant-numeric:tabular-nums;}
  .meter .mtitle .fresh.stale{color:var(--red); font-weight:600;}
  .meter.stale .fill{opacity:0.35;}
  .meter .track{position:relative; height:12px; border-radius:7px; background:rgba(255,255,255,0.055); overflow:visible;}
  .meter .fill{height:100%; border-radius:7px 0 0 7px; min-width:2%; overflow:hidden;}
  .meter .fill.green{background:var(--green);}
  .meter .fill.yellow{background:var(--yellow);}
  .meter .fill.red{background:var(--red);}
  .meter .mk.curve{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--kinari); border-radius:1px; opacity:0.85;}
  .meter .msub{font-size:0.72rem; color:var(--dim); margin-top:4px;}
  .meter .msub.mottainai{color:var(--yellow);}
  #machineAge{color:var(--sub);}
  #machineAge.stale{color:var(--red);}
  .sum span.red{color:var(--red); border-color:var(--red);}
  .sum span.yellow{color:var(--yellow); border-color:var(--yellow);}

  /* モデルバッジ：状態色と混同しないよう枠線のみ・静かに */
  .mbadge{display:inline-flex; align-items:center; height:18px; padding:0 6px; margin-left:6px; border:1px solid var(--line); border-radius:5px; font-size:0.66rem; font-weight:600; color:var(--sub); vertical-align:1px; white-space:nowrap;}
  .mbadge.opus{color:var(--kinari); border-color:var(--kinari);}
  .modelSum{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:0.74rem; color:var(--sub); margin:8px 0 10px;}
  .modelSum span{border:1px solid var(--line); border-radius:6px; padding:2px 8px;}
  .modelSum span:first-child{border:none; padding:0; color:var(--dim);}

  /* 見出し */
  .label{display:flex; align-items:baseline; gap:8px; color:var(--sub); font-size:0.72rem; letter-spacing:0.12em; margin:18px 0 8px;}
  .label b{color:var(--ink); font-weight:500; letter-spacing:0.08em;}
  .label small{letter-spacing:0; font-size:0.7rem; color:var(--dim); margin-left:auto;}

  /* 凡例（3色） */
  .legend{display:flex; gap:12px; flex-wrap:wrap; font-size:0.72rem; color:var(--sub); margin:-2px 0 8px;}
  .legend i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:1px;}

  /* 縦2列の一覧 */
  .g{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .gh{grid-column:1/-1; color:var(--sub); font-size:0.74rem; letter-spacing:0.06em; margin:6px 0 -2px; display:flex; align-items:baseline; gap:6px;}
  .gh b{color:var(--ink); font-weight:500;}
  .gh.yellow b{color:var(--yellow);}
  .c{
    position:relative; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--gray);
    border-radius:10px; padding:9px 10px 8px; min-height:44px; cursor:pointer;
    display:flex; flex-direction:column; gap:6px;
  }
  .c.green{border-left-color:var(--green);}
  .c.yellow{border-left-color:var(--yellow);}
  .c.red{border-left-color:var(--red); background:var(--red-bg);}
  .c.blue{border-left-color:var(--blue);}
  .c.blue .s i{background:var(--blue);}
  .c.gray{opacity:0.62;}
  .c.hot{box-shadow:inset 0 0 0 1px var(--kinari);}          /* ★4以上：枠を生成りで一段強く */
  .pv{margin-left:auto; color:var(--kinari); font-weight:600; font-size:0.85rem; letter-spacing:0.02em;}
  .pk{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:2px 0 10px; color:var(--sub); font-size:0.8rem;}
  .pk button{min-width:44px; min-height:44px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--ink); font:inherit; font-size:1rem; font-weight:600;}
  .pk button.on{background:var(--kinari); color:var(--bg); border-color:var(--kinari);}
  .pk button.off{min-width:52px; font-size:0.8rem; font-weight:500; color:var(--sub);}
  .sendbar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 10px; padding:8px 12px; border:1px solid var(--line); border-radius:10px; font-size:0.85rem; color:var(--sub);}
  .sendbar a{display:inline-flex; align-items:center; min-height:44px; padding:0 14px; border-radius:10px; background:var(--kinari); color:var(--bg); text-decoration:none; font-weight:600; white-space:nowrap;}
  /* リモコンボタン（▶️動かす／⏸止める／🔁引き継ぐ／閉じる） */
  .cmdrow{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:6px 0;}
  .cmdbtn{min-height:40px; padding:0 14px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--ink); font:inherit; font-size:0.82rem; font-weight:600;}
  .cmdbtn:active{background:var(--line);}
  .cmdst{font-size:0.72rem; color:var(--dim);}
  .cmdst.ok{color:var(--green);} .cmdst.err{color:var(--red);} .cmdst.warn{color:var(--yellow);} .cmdst.pending{color:var(--sub);}
  .excluded{font-size:0.72rem; color:var(--dim);}
  .c .t{
    font-size:0.86rem; font-weight:600; line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .c.open .t{-webkit-line-clamp:unset;}
  .c .act{font-size:0.68rem; color:var(--dim); margin-top:2px; font-variant-numeric:tabular-nums;}
  .c .act.stale{color:var(--red);}
  .c .s{display:flex; align-items:center; flex-wrap:wrap; row-gap:4px; gap:6px; font-size:0.72rem; color:var(--sub); font-variant-numeric:tabular-nums; margin-top:auto;}
  .c .s .lbl{white-space:nowrap;}
  .c .s i{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--gray); flex:none;}
  .c.green .s i{background:var(--green);} .c.yellow .s i{background:var(--yellow);} .c.red .s i{background:var(--red);}
  .c.red .s{color:var(--ink);}
  .c .s .n{margin-left:auto; padding:0 7px; border:1px solid var(--line); border-radius:999px; white-space:nowrap; color:var(--kinari);}
  .c .s .sk{font-size:0.9rem; line-height:1;}
  .c .d{display:none; border-top:1px solid var(--line); padding-top:8px; margin-top:2px; font-size:0.84rem; color:var(--sub); line-height:1.55; cursor:auto;}
  .c .d p{margin:0 0 6px;} .c .d p:last-child{margin-bottom:0;}
  .c .d b{color:var(--kinari); font-weight:500;}
  .c .d .src{font-size:0.74rem; color:var(--dim); word-break:break-all;}
  .c.open{grid-column:1/-1;}
  .c.open .d{display:block;}
  .c .more{position:absolute; right:9px; top:8px; color:var(--dim); font-size:0.7rem;}
  .c.open .more{transform:rotate(180deg);}

  /* リンク（44px以上） */
  .links{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .links a{display:inline-flex; align-items:center; min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:10px; text-decoration:none; color:var(--kinari); font-size:0.86rem;}
  .links a::after{content:"→"; margin-left:8px; color:var(--sub);}

  /* 集計チップ */
  .sum{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 8px;}
  .sum a, .sum span{display:inline-flex; align-items:center; min-height:34px; padding:0 10px; border:1px solid var(--line); border-radius:8px; font-size:0.76rem; color:var(--sub); text-decoration:none; font-variant-numeric:tabular-nums;}
  .sum b{color:var(--ink); font-weight:600; margin-left:5px;}
  .sum .red b{color:var(--red);} .sum .yellow b{color:var(--yellow);} .sum .green b{color:var(--green);} .sum .blue b{color:var(--blue);}

  /* 畳んである節 */
  details.sec{border:1px solid var(--line); border-radius:10px; margin-top:10px; background:rgba(255,255,255,0.015);}
  details.sec summary{list-style:none; cursor:pointer; min-height:44px; display:flex; align-items:center; gap:8px; padding:0 12px; color:var(--kinari); font-size:0.86rem;}
  details.sec summary::-webkit-details-marker{display:none;}
  details.sec summary small{color:var(--dim); font-size:0.72rem;}
  details.sec summary::after{content:"↓"; margin-left:auto; color:var(--sub);}
  details.sec[open] summary::after{content:"↑";}
  details.sec .in{padding:4px 12px 12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 13px; margin-bottom:8px;}
  .note{font-size:0.84rem; color:var(--sub); line-height:1.5;}
  .row{border-bottom:1px solid var(--line); padding:9px 0; font-size:0.9rem;}
  .row:last-child{border-bottom:none;}
  .row .when{color:var(--sub); font-size:0.72rem; font-variant-numeric:tabular-nums;}
  .row .meta{color:var(--sub); font-size:0.78rem; margin-top:3px;}
  .today .bl{color:var(--sub); font-size:0.72rem; letter-spacing:0.06em; margin:10px 0 4px;}
  .today ul{margin:0; padding-left:1.1em;} .today li{margin-bottom:4px;}
  footer{color:var(--dim); font-size:0.72rem; margin-top:28px; line-height:1.6;}

  /* 走行中グリッド：ページ最優先。他のどの要素よりも目立たせる（正方形・2列） */
  /* 2026-09-03 たまごさん「あと何本走らせられるか、もう限界か。100で止まるなら90%で止める。
     限界ならブラウザ1個閉じてまで言ってほしい。スマホから閉じられるのが理想」 */
  /* ホワイトボードを状態ごとのブロックに分ける（2026-09-03 たまごさん指示） */
  .wbg{grid-column:1/-1; border:1px solid var(--line); border-radius:12px; margin:0 0 8px; overflow:hidden;}
  .wbg > summary{list-style:none; cursor:pointer; padding:11px 14px; font-size:0.92rem; font-weight:700;
    display:flex; align-items:center; gap:8px; min-height:44px; color:var(--fg);}
  .wbg > summary::-webkit-details-marker{display:none;}
  .wbg > summary::after{content:"▾"; margin-left:auto; color:var(--sub); font-size:0.8rem;}
  .wbg[open] > summary::after{content:"▴";}
  .wbg > summary b{font-variant-numeric:tabular-nums; color:var(--sub); font-weight:700;}
  .wbginner{padding:0 10px 12px;}
  .capbar{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    margin:0 0 8px; padding:9px 12px; border-radius:12px; font-size:0.9rem; font-weight:700;
    border:2px solid var(--green); background:rgba(95,217,150,0.10); color:#dff7ea;}
  .capbar.warn{border-color:var(--yellow); background:rgba(255,224,138,0.10); color:#ffe9b0;}
  .capbar.stop{border-color:var(--red); background:rgba(255,120,100,0.12); color:#ffd2c9;}
  .capbar .capsub{font-size:0.68rem; font-weight:500; opacity:0.85; width:100%;}
  .capbar button{min-height:38px; padding:0 12px; border-radius:9px; border:1px solid rgba(255,255,255,0.35);
    background:rgba(255,255,255,0.12); color:inherit; font-weight:700; font-size:0.8rem;}
  /* 2026-09-04 たまごさん「進捗表の横に現在の時刻もちゃんとリアルタイムで表示してください」
     これが動いていること自体が「この画面は生きている」の証拠になる。 */
  .check{border-color:rgba(255,224,138,0.45);}
  .check > summary{font-weight:700;}
  .crow{padding:12px 4px; border-bottom:1px solid var(--line);}
  .crow:last-child{border-bottom:none;}
  .done{border-color:rgba(111,143,176,0.5);}
  .done > summary{font-weight:700; color:var(--blue);}
  .drow{padding:10px 4px; border-bottom:1px solid var(--line);}
  .drow:last-child{border-bottom:none;}
  .drow .ct{font-weight:600;}
  .drow .cm{color:var(--sub); font-size:0.78rem; margin-top:2px;}
  .drow .cu{display:block; color:var(--blue); font-size:0.8rem; word-break:break-all; margin-top:2px;}
  .ct{font-size:0.92rem; font-weight:700; line-height:1.35;}
  .cm{font-size:0.72rem; color:var(--sub); margin:3px 0 6px; font-variant-numeric:tabular-nums;}
  .cr{font-size:0.78rem; line-height:1.65; color:var(--fg); background:#161c24; border:1px solid var(--line);
     border-radius:10px; padding:9px 11px; margin:6px 0; white-space:pre-wrap; max-height:9em; overflow:auto;}
  .cu{display:block; font-size:0.78rem; margin:3px 0; word-break:break-all;}
  /* 2026-09-04 判定を4つに増やしたので、2列で折り返す（1行4つは指が当たらない） */
  /* 2026-09-04 たまごさん「タスクも全部ナンバリングして。進捗表にタスクナンバーがない」
     → 行の並び順（次・2・3…）とは別に、案件番号(#24 など)を出す。口頭で番号を言えるように。 */
  /* 週の配分（天井に行かないためのペース） */
  .pacebar{margin:10px 0 6px; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:#161c24;}
  .pacebar .ph{font-weight:800; font-size:1.05rem; margin-bottom:4px;}
  .pacebar .pd{font-size:0.8rem; color:var(--sub); line-height:1.6;}
  .pacebar .track{height:10px; border-radius:999px; background:#0e1319; margin:8px 0 6px; overflow:hidden;}
  .pacebar .fill{height:100%; border-radius:999px;}
  .pacebar.ok{border-color:rgba(95,217,150,0.45);} .pacebar.ok .ph{color:var(--green);} .pacebar.ok .fill{background:var(--green);}
  .pacebar.warn{border-color:rgba(230,190,80,0.5);} .pacebar.warn .ph{color:var(--yellow);} .pacebar.warn .fill{background:var(--yellow);}
  .pacebar.over{border-color:rgba(255,120,100,0.6); background:#241619;} .pacebar.over .ph{color:var(--red);} .pacebar.over .fill{background:var(--red);}
  /* 2026-09-05 たまごさん「何のモデルを使ってるか一目瞭然にしたい。モデルの色も変えといて」 */
  .mdl{display:inline-block; padding:1px 7px; border-radius:999px; font-size:0.68rem; font-weight:800; letter-spacing:.02em;
    border:1px solid transparent; vertical-align:middle;}
  .mdl.fable{background:#3a1216; color:#ff9f92; border-color:rgba(255,120,100,0.65);}
  .mdl.opus{background:#3a2a12; color:#ffc98a; border-color:rgba(255,190,110,0.6);}
  .mdl.sonnet{background:#122a1f; color:#7ee3ae; border-color:rgba(95,217,150,0.5);}
  .mdl.haiku{background:#122430; color:#8ec9ff; border-color:rgba(120,190,255,0.5);}
  .mdl.test{background:#1a2028; color:var(--sub); border-color:var(--line);}
  /* 2026-09-05 5段階の箱。上の箱が空になるまで下は出ない（発車の規則と同じ並び） */
  .qbox{border:1px solid var(--line); border-radius:12px; margin:8px 0; overflow:hidden; background:#141a21;}
  .qboxh{padding:7px 12px; font-size:0.78rem; font-weight:800; color:var(--sub);
    background:#111720; border-bottom:1px solid var(--line); letter-spacing:.02em;}
  .qno{display:inline-block; margin-left:6px; font-size:0.7rem; color:var(--sub); font-variant-numeric:tabular-nums;}
  #fuelBox .fuel{min-height:44px; padding:0 14px; border-radius:10px; font-weight:800; font-size:0.9rem;
    border:1px solid var(--green); background:var(--green); color:#12161c;}
  #fuelBox .fuel.off{background:#3a1f1f; color:#ffb3a7; border-color:rgba(255,120,100,0.5);}
  #fuelBox .cap{min-width:44px; min-height:38px; border-radius:10px; border:1px solid var(--line);
    background:#1a2028; color:var(--sub); font-weight:700;}
  #fuelBox .cap.on{background:var(--accent,#5fd996); color:#12161c; border-color:var(--accent,#5fd996);}
  .cbtns{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;}
  .cbtns button{min-height:44px; border-radius:10px; font-weight:700; font-size:0.82rem; border:1px solid var(--line);}
  .cok{background:var(--green); color:#12161c; border-color:var(--green)!important;}
  .clater{background:#3a2f12; color:var(--yellow); border-color:rgba(230,190,80,0.45)!important;}
  .cng{background:#1a2028; color:var(--red);}
  .cdel{background:#1a2028; color:var(--sub); border-color:var(--line);}
  /* 2026-09-06(418番) 押すだけで終わる確認待ち：サムネ＋本番URL＋完了/やり直しの2ボタンだけを最初に見せ、
     長い文章・後回し/削除は<details>の中に畳む。「証拠なし」「開けない」は赤で先に分かるようにする。
     画像もボタンも高さは固定pxでなくaspect-ratio/min-heightで決め、9/05の文字縦潰れを再発させない。 */
  /* 2026-09-06 修正：初期版は1行=約360pxで「スマホ1画面に3件」を満たせなかった（実測）。
     サムネの比率を横長にし、余白とボタンの上下marginを削って1行を約250px前後まで詰めた。
     文字側のline-height/font-sizeは一切触っていない（縮めたのは画像比率と余白だけ）。 */
  /* 2026-09-06 再修正（418番セルフチェック）：CSS計算値で250〜260pxはiPhone SE等の実効高さ
     （約600px）だと3件目が入りきらない恐れがあったため、サムネのaspect-ratioを4.4/1へ、
     ボタンのmin-heightを44px→40pxへ、上下marginを4px→3pxへさらに詰め、1行を約195〜215px
     （タイトル1〜2行）まで縮めた。文字のfont-size/line-heightは今回も変更していない。 */
  .cthumbs{display:flex; gap:6px; margin:3px 0;}
  .cthumbs img{flex:1 1 0; min-width:0; width:100%; aspect-ratio:4.4/1; object-fit:cover; border-radius:8px;
    border:1px solid var(--line); background:#0e1319; display:block;}
  .cthumbs.wait{padding:6px; border:1px dashed var(--line); border-radius:8px; color:var(--dim);
    font-size:0.78rem; text-align:center;}
  .cthumbs.none{padding:6px; border:1px dashed var(--red); border-radius:8px; background:var(--red-bg);
    color:#ffb3a7; font-size:0.82rem; font-weight:700; text-align:center; line-height:1.5;}

   status/version.json（毎回サーバーから取り直す）の版が、いま動いている画面と違えば、
   URLに ?v=<版> を付けて開き直す。URLが変わるのでキャッシュに当たらず、必ず新しい画面になる。 */
const PAGE_BUILD = new URLSearchParams(location.search).get("v") || "";
(function checkVersion(){
  fetch("status/version.json?t=" + Date.now(), {cache:"no-store"})
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      const v = j && j.v;
      if(v && v !== PAGE_BUILD){ location.replace(location.pathname + "?v=" + encodeURIComponent(v)); }
    }).catch(()=>{});
  setInterval(()=>{
    fetch("status/version.json?t=" + Date.now(), {cache:"no-store"})
      .then(r => r.ok ? r.json() : null)
      .then(j => { const v = j && j.v; if(v && v !== PAGE_BUILD) location.replace(location.pathname + "?v=" + encodeURIComponent(v)); })
      .catch(()=>{});
  }, 120000);
})();
// データは毎回サーバーから取り直す（スマホのキャッシュで古い一覧が出ないように）
(function(){
  const t = Date.now(), files = ["data.js","said.js","requests225.js"]; let n = 0;
  files.forEach(f => { const s = document.createElement("script"); s.src = f + "?t=" + t; s.async = false;
    s.onload = s.onerror = () => { if(++n === files.length && window.__dataReady) window.__dataReady(); };
    document.head.appendChild(s); });
})();

<script>

/* 2026-09-05 画面が黙って止まるのをやめる。

function showErr(e){
  try{
    let bar = document.getElementById("jsErr");
    if(!bar){
      bar = document.createElement("div"); bar.id = "jsErr";
      bar.style.cssText = "margin:8px 0;padding:8px 12px;border-radius:10px;background:#3a1216;color:#ff9f92;"
        + "border:1px solid rgba(255,120,100,0.6);font-size:0.74rem;word-break:break-all;";
      const h1 = document.querySelector("h1");
      if(h1 && h1.parentNode) h1.parentNode.insertBefore(bar, h1.nextSibling);
    }
    bar.textContent = "画面の一部が描けませんでした：" + (e && e.message ? e.message : String(e));
  }catch(_){}
}
window.addEventListener("error", ev => showErr(ev.error || ev.message));

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function formatStamp(iso){
  const d = new Date(iso); if(isNaN(d)) return "—";
  const mm = String(d.getMonth()+1).padStart(2,"0"), dd = String(d.getDate()).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0"), mi = String(d.getMinutes()).padStart(2,"0");
  return `${mm}-${dd} ${hh}:${mi}`;
}
function fmtDur(min){ if(min == null) return "—"; const h = Math.floor(min/60), m = Math.round(min%60); return h ? `${h}時間${m}分` : `${m}分`; }
// 2026-09-03 リアルタイム化：数字に必ず「いつ時点か」を添え、5分超は古いと分かるようにする。新しい顔で嘘をつかない
const STALE_MIN = 5;
function freshness(iso){
  if(!iso) return {text:"—", stale:true, mins:null};
  // "2026-09-03 07:15" のようなスペース区切りはSafariがパース失敗することがあるのでT区切りに直す
  const s = String(iso).includes("T") ? iso : String(iso).replace(" ", "T");
  const d = new Date(s); if(isNaN(d)) return {text:"—", stale:true, mins:null};
  const mins = Math.max(0, Math.round((Date.now() - d.getTime())/60000));
  const text = mins < 1 ? "いま" : mins < 60 ? `${mins}分前` : mins < 1440 ? `${Math.floor(mins/60)}時間前` : `${Math.floor(mins/1440)}日前`;
  return {text, stale: mins > STALE_MIN, mins};
}
function linksHtml(links){
  if(!links || !links.length) return "";
  return `<div class="links">` + links.map(l=>`<a href="${esc(l.url)}">${esc(l.label)}</a>`).join("") + `</div>`;
}
// カードのトグル（リンクのタップは通す）

  const c = e.target.closest(".c"); if(!c) return;
  c.classList.toggle("open");
});
function card(color, title, stateLabel, extra, detailHtml, prioKey, subLine){
  const p = prioKey != null ? prioOf(prioKey) : 0;
  const star = prioKey != null ? `<span class="pv" data-k="${esc(prioKey)}">${p ? "P" + p : ""}</span>` : "";
  const picker = prioKey != null ? `<div class="pk" data-k="${esc(prioKey)}">優先度（1＝今すぐ） ${[1,2,3,4,5].map(n=>`<button type="button" class="${p===n?"on":""}" data-p="${n}">${n}</button>`).join("")}<button type="button" class="off" data-p="0">なし</button></div>` : "";
  return `<div class="c ${color}${p && p<=2 ? " hot" : ""}" ${prioKey != null ? `data-prio="${p}"` : ""}><span class="more">▼</span>
    <div class="t">${esc(title)}</div>
    ${subLine ? `<div class="act">${subLine}</div>` : ""}
    <div class="s"><i></i><span class="lbl">${esc(stateLabel)}</span>${extra || ""}${star}</div>
    <div class="d">${picker}${detailHtml}</div>
  </div>`;
}

/* ───── 優先度（たまごさんが1タップで付ける。5が最優先） ─────
   保存：まず端末内（localStorage）。「Obsidianへ送る」で Vault に1ファイル書き、Mac側が5分おきに取り込んで
   status/priority.json（全端末で共有）とホワイトボードの優先列に反映する。 */
const PRIO_KEY = "shinchoku.prio.v1";
let PRIO = {};       // {番号: {p, t}}
let PRIO_REMOTE = {};
function loadPrio(){ try { PRIO = JSON.parse(localStorage.getItem(PRIO_KEY) || "{}") || {}; } catch(e){ PRIO = {}; } }
function savePrio(){ try { localStorage.setItem(PRIO_KEY, JSON.stringify(PRIO)); } catch(e){} }
function mergePrio(remote){
  // 新しい方が勝つ
  for(const k in (remote||{})){ const r = remote[k]; if(!r) continue;
    if(!PRIO[k] || String(r.t||"") > String(PRIO[k].t||"")) PRIO[k] = {p:+r.p||0, t:r.t||""}; }
  savePrio();
}
function prioOf(k){ const v = PRIO[String(k)]; return v ? (+v.p || 0) : 0; }
function setPrio(k, p){
  PRIO[String(k)] = {p:+p, t:new Date().toISOString()}; savePrio();
  document.querySelectorAll(`.pv[data-k="${CSS.escape(String(k))}"]`).forEach(el=>{ el.textContent = p ? "P" + p : ""; });
  document.querySelectorAll(`.pk[data-k="${CSS.escape(String(k))}"] button`).forEach(b=>{ b.classList.toggle("on", +b.dataset.p === +p && +p > 0); });
  document.querySelectorAll(`.pk[data-k="${CSS.escape(String(k))}"]`).forEach(pk=>{ const c = pk.closest(".c"); if(c){ c.dataset.prio = p; c.classList.toggle("hot", p > 0 && p <= 2); } });
  updateSendBar();
}
function pendingCount(){ // 端末内にあって、共有側（priority.json）と違うもの
  let n = 0; for(const k in PRIO){ const r = PRIO_REMOTE[k]; if(!r || +r.p !== +PRIO[k].p) n++; } return n;
}
// 優先度は、押すたびに1件ずつ送らず「今の全部」をまとめて中継所へ渡す（画面は飛ばさない）
let PRIO_SEND_TIMER = null;
function sendPrioViaRelay(){
  clearTimeout(PRIO_SEND_TIMER);
  PRIO_SEND_TIMER = setTimeout(()=>{
    sendCommandWithId("p" + Date.now().toString(36), "priority_set", JSON.stringify(PRIO), "優先度をまとめて更新");
  }, 1500);
}
function updateSendBar(){
  const bar = document.getElementById("sendbar"); if(!bar) return;
  const n = pendingCount(), total = Object.keys(PRIO).filter(k=>PRIO[k].p>0).length;
  bar.hidden = total === 0;
  // 2026-09-04 たまごさん「Obsidianには飛ばない」→ 手で送るリンクを廃止。
  //   優先度も他のボタンと同じ中継所ルートで自動的に送る（画面は飛ばさない）。
  bar.innerHTML = `<span>優先度を付けた ${total}件${n ? `・未送信 ${n}件（自動で送ります）` : "・共有済み"}</span>`;
  if(n) sendPrioViaRelay();
}
document.addEventListener("click", e=>{
  const b = e.target.closest(".pk button"); if(!b) return;
  e.stopPropagation(); setPrio(b.closest(".pk").dataset.k, +b.dataset.p);
});

/* ───── リモコン（▶️動かす／⏸止める／🔁引き継ぐ／重いアプリを閉じる） ─────
   GitHub Pagesは静的で直接コマンドを打てないので、優先度と同じ経路を使う：
   obsidian://new で Vault に1件1ファイル書く → iCloud同期 → Mac側 command_ingest.py が
   30秒おきに拾って実行 → status/commands.json に結果を書く → ここが読んで表示を差し替える。 */
const CMD_KEY = "shinchoku.cmds.v1";
let SENT_CMDS = {}; let CMD_RESULTS = {};
function loadCmds(){ try { SENT_CMDS = JSON.parse(localStorage.getItem(CMD_KEY) || "{}") || {}; } catch(e){ SENT_CMDS = {}; } }
function saveCmds(){ try { localStorage.setItem(CMD_KEY, JSON.stringify(SENT_CMDS)); } catch(e){} }
function refreshCommands(){
  return fetch("status/commands.json?t=" + Date.now(), {cache:"no-store"})
    .then(r => r.ok ? r.json() : null).then(d => {
      CMD_RESULTS = {}; (d && d.results || []).forEach(r => { CMD_RESULTS[r.id] = r; });
      renderCmdStatus();
    }).catch(()=>{});
}
function cmdStatusHtml(id){
  const r = CMD_RESULTS[id];
  if(r) return r.status === "done" ? `<span class="cmdst ok">実行しました ${esc(formatStamp(r.doneAt))}</span>`
    : r.status === "skipped" ? `<span class="cmdst warn">実行しませんでした：${esc(r.message||"")}</span>`
    : `<span class="cmdst err">失敗：${esc(r.message||"")}</span>`;
  const s = SENT_CMDS[id];
  return s ? `<span class="cmdst pending">送信済み・実行待ち（30〜60秒）</span>` : "";
}
function renderCmdStatus(){
  document.querySelectorAll("[data-cmdid]").forEach(el=>{ el.innerHTML = cmdStatusHtml(el.dataset.cmdid); });
}
document.addEventListener("click", e=>{
  const b = e.target.closest(".cmdbtn"); if(!b) return;
  e.stopPropagation();
  const id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const holder = b.closest(".cmdrow")?.querySelector("[data-cmdid-slot]");
  sendCommandWithId(id, b.dataset.action, b.dataset.target, b.dataset.label);
  if(holder){ holder.dataset.cmdid = id; holder.removeAttribute("data-cmdid-slot"); renderCmdStatus(); }
});
/* 2026-09-04 たまごさん「Obsidianに飛んじゃうよ。Obsidianに飛ぶというアクションは、
   この進捗表ではもうありえないから。**Obsidianには飛ばない。**」
   → ボタンを押してもアプリを切り替えない。中継所(status/relay.json に書かれたURL)へ
     そのまま送る。中継所が用意できていない・届かないときは端末の中に貯めておき、
     次に届くようになったときにまとめて送る。**画面は絶対に飛ばさない。** */
let PENDING_CMDS = [];
try{ PENDING_CMDS = JSON.parse(localStorage.getItem("shinchoku_pending_cmds") || "[]"); }catch(e){ PENDING_CMDS = []; }
function savePending(){ try{ localStorage.setItem("shinchoku_pending_cmds", JSON.stringify(PENDING_CMDS.slice(-50))); }catch(e){} }
function renderPending(){
  const el = document.getElementById("pendMsg"); if(!el) return;
  el.textContent = PENDING_CMDS.length ? `未送信 ${PENDING_CMDS.length}件（中継所につながり次第まとめて送ります）` : "";
}
function relayUrl(){ return (window.__relay && window.__relay.url) || null; }
/* 2026-09-05 中継所の道が2本になった。cloudflared が張れないとき localtunnel(*.loca.lt)へ落ちる。
   localtunnel は初回に「Click to Continue」の注意ページを挟むので、このヘッダーで素通りさせる。
   付いていても cloudflared 側では無害なので、中継所宛ては常に付ける。 */
const RELAY_HEADERS = {"bypass-tunnel-reminder": "1"};
function flushCommands(){
  const url = relayUrl();
  if(!url || !PENDING_CMDS.length) { renderPending(); return Promise.resolve(); }
  const batch = PENDING_CMDS.slice();
  return fetch(url.replace(/\/$/, "") + "/cmd", {
    method: "POST", mode: "cors",
    headers: Object.assign({"Content-Type": "application/json"}, RELAY_HEADERS),
    body: JSON.stringify({commands: batch}),
  }).then(r => {
    if(!r.ok) throw new Error("HTTP " + r.status);
    PENDING_CMDS = PENDING_CMDS.filter(c => !batch.some(b => b.id === c.id));
    savePending(); renderPending(); refreshHealth();
  }).catch(()=>{ renderPending(); });
}
function sendCommandWithId(id, action, target, label){
  SENT_CMDS[id] = {action, target, label, sentAt: new Date().toISOString()};
  saveCmds();
  PENDING_CMDS.push({id, action, target, label, requestedAt: new Date().toISOString()});
  savePending(); renderPending();
  flushCommands();
}
// 中継所の場所は毎回読み直す（トンネルのURLは変わることがある）
/* 週の配分（天井に行かないためのペース）。tools/pace.py が status/pace.json に書く */

}
function renderPace(p){

    <div class="pd">今日 <b>${p.usedToday}%</b> 使用 ／ 今日の予算 <b>${p.budgetToday}%</b>（週の残り ${p.remainWeek}% ÷ あと ${p.daysLeft}日）</div>
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="pd">週の使用 ${p.allPct}%・ならすと1日 ${p.perDayEven}%・${esc(p.resetAt || "")} にリセット</div>`;
}
function refreshPace(){

    .then(r => r.ok ? r.json() : null).then(renderPace).catch(()=>{});

/* ───── 424番：どの仕事がいくら使ったか見える化（今日のトップ5） ─────
   status/cost_by_task.json（tools/auto_launcher.py の harvest() が1本終わるたびに書く）を読むだけ。
   金額はUSD（claude -pのtotal_cost_usdをそのまま採用。無ければ依頼文の単価でフォールバック概算）。 */
function fmtUsd(v){ return v == null ? "—" : "$" + Number(v).toFixed(2); }
function renderCostTop5(d){
  const box = document.getElementById("costTop5");
  const meta = document.getElementById("costMeta");
  const src = document.getElementById("costSrcNote");
  if(!box) return;
  if(!d || !(d.todayTop5 || []).length){
    box.innerHTML = `<div class="card note" style="grid-column:1/-1">今日はまだ終わった仕事の記録が無い（仕事が1本終わるたびに増える）</div>`;
    if(meta) meta.textContent = "";
    return;
  }
  if(meta) meta.textContent = `今日${d.todayTaskCount || 0}本・合計${fmtUsd(d.todayTotalCostUsd)}`;
  box.innerHTML = d.todayTop5.map((t, i)=>{
    const tokTotal = (t.inputTokens||0) + (t.outputTokens||0);
    const detail = `<p>入力 ${(t.inputTokens||0).toLocaleString()}トークン・出力 ${(t.outputTokens||0).toLocaleString()}トークン`
      + (t.cacheReadTokens ? `（うちキャッシュ読み ${t.cacheReadTokens.toLocaleString()}）` : "") + `</p>`
      + `<p>所要 ${t.elapsedMin != null ? fmtDur(t.elapsedMin) : "—"}${t.model ? "・" + esc(t.model) : ""}</p>`;
    return card(i === 0 ? "yellow" : "gray", `${i+1}位　${t.n}番 ${t.title || ""}`, fmtUsd(t.costUsd),
      `<span class="n">${tokTotal.toLocaleString()}tok</span>`, detail);
  }).join("");
  if(src) src.textContent = d.priceSourceNote || "";
}
function refreshCost(){
  return fetch("status/cost_by_task.json?t=" + Date.now(), {cache:"no-store"})
    .then(r => r.ok ? r.json() : null).then(renderCostTop5).catch(()=>{});
}
refreshCost();
setInterval(refreshCost, 60000);
/* 2026-09-05 このページがMac自身から配られているとき（家のWi-Fiの中で http://192.168.x.x:8788 を
   開いたとき）は、**自分がいる場所がそのまま中継所**。トンネルを探しにいかない。
   トンネルは切れるたびURLが変わるが、家の中の道は切れないしURLも変わらない。 */
function isLocalRelay(){
  return location.protocol === "http:" &&
         (location.port === "8788" || /^(192\.168\.|10\.|127\.)/.test(location.hostname));
}
function refreshRelay(){
  if(isLocalRelay()){
    window.__relay = {url: location.origin, lanUrl: location.origin, local: true};
    flushCommands();
    return Promise.resolve();
  }
  return fetch("status/relay.json?t=" + Date.now(), {cache:"no-store"})
    .then(r => r.ok ? r.json() : null).then(j => { window.__relay = j; flushCommands(); })
    .catch(()=>{});
}
refreshRelay();
setInterval(refreshRelay, 60000);

/* ───── スマホから発車待ちへ新規タスクを1行追加（2026-09-04）─────
   優先度・リモコンと同じ経路（obsidian://new → Vault → Mac側 command_ingest.py の queue_add）で
   status/queue.json に waiting 状態の新規項目を直接追加する。これまでDispatch経由でしか積めなかった。 */
let QA_PRIO = 3;
document.addEventListener("click", e=>{

  QA_PRIO = +b.dataset.p;
  document.querySelectorAll("#queueAddBox .qap").forEach(x=>x.classList.toggle("on", x===b));

document.addEventListener("click", e=>{

  const input = document.getElementById("qaText");
  const msg = document.getElementById("qaMsg");

  const id = "a" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const label = "＋" + text.slice(0,20);
  // 2026-09-04 たまごさん「Obsidianには飛ばない」→ 画面を切り替えず、中継所へそのまま送る
  PENDING_CMDS.push({id, action:"queue_add", target:text, priority:QA_PRIO, label, requestedAt:new Date().toISOString()});
  savePending();
  SENT_CMDS[id] = {action:"queue_add", target:text, priority:QA_PRIO, label, sentAt:new Date().toISOString()};
  try{ saveCmds(); }catch(err){}
  if(input) input.value = "";
  if(msg) msg.textContent = "受け付けました。発車待ちの列に入ります";
  flushCommands();
});

/* ───── あと何本いけるか（最上部の帯）─────
   2026-09-03 たまごさん：「100で止まるなら90%で止める。絶対に固まらない上限を見極めて、
   あと何本いけるか、もう限界かを出して。限界ならブラウザ1個閉じてまで言って、スマホから閉じられるように」
   安全率90%（SAFETY）を掛けた上限で判定する。ぎりぎりまで使わない。 */
const SAFETY = 0.9;
function renderCapBar(){
  const bar = document.getElementById("capBar"); if(!bar) return;
  const m = window.__machine, h = window.__health;
  if(!m){ bar.hidden = true; return; }
  const real = (m.sessionList || []).filter(s => !s.isDispatchSelf && !s.done && s.status !== "完了" && s.status !== "失敗").length;
  const hardSafe = Math.max(0, Math.floor((m.safeMax || 0) * SAFETY));   // 90%で止める
  const room = Math.max(0, hardSafe - real);
  const load = m.load != null ? Math.round(m.load) : null;
  let cls = "capbar", head, sub;
  if(room > 0){
    cls += ""; head = `あと${room}本いける`;
  } else if(real <= hardSafe){
    cls += " warn"; head = "ここが上限。増やさない";
  } else {
    cls += " stop"; head = `もう限界（${real}本／上限${hardSafe}本）`;
  }
  sub = `実作業${real}本・安全上限${hardSafe}本（測定上限${m.safeMax || "?"}本の90%）` + (load != null ? `・負荷${load}%` : "");
  // 限界なら「何を閉じれば1本増えるか」を具体名で出して、その場で閉じられるようにする
  let btn = "";
  if(room === 0 && h && (h.items || []).length){
    const EXCLUDED = new Set(["Brave Browser", "Google Chrome"]);
    const cand = (h.items || []).find(it => it.kind === "mem" && it.app && it.safe && !EXCLUDED.has(it.app));
    if(cand){
      head += `。${cand.label}と楽になる（${cand.effect}）`;
      btn = `<span class="cmdrow"><button type="button" class="cmdbtn" data-action="close_app" data-target="${esc(cand.app)}" data-label="${esc(cand.label)}">🗑 ${esc(cand.app)}を閉じる</button><span data-cmdid-slot></span></span>`;
    } else {
      const locked = (h.items || []).find(it => it.kind === "mem" && it.app && EXCLUDED.has(it.app));
      if(locked) head += `。${esc(locked.app)}が${esc(locked.effect)}使っているが、公開が止まるので自動では閉じない`;
    }
  }
  bar.className = cls;
  bar.innerHTML = `<span>${head}</span>${btn}<span class="capsub">${esc(sub)}</span>`;
  bar.hidden = false;
  renderCmdStatus();
}

/* ───── Macの健康（status/health.json：何を閉じれば／消せば楽になるか。実測のみ） ───── */
function renderHealth(h){
  const box = document.getElementById("health");
  if(!h){ box.innerHTML = `<div class="card note" style="grid-column:1/-1">まだ計測が無い（5分おきに測る）</div>`; return; }
  const mins = Math.round((Date.now() - new Date(h.measuredAt).getTime())/60000);
  document.getElementById("healthMeta").textContent = `${mins < 1 ? "いま" : mins + "分前"}`;
  const over = (h.sessions || 0) - (h.safeMax || 0);
  const shed = h.shedCandidates || [];
  const shedNote = (over > 0 && shed.length)
    ? `<div class="card note" style="grid-column:1/-1">空けるなら：${shed.map(s=>`${esc((s.title||"?").slice(0,20))}（終わって${s.idleMin != null ? Math.round(s.idleMin) : "?"}分待機）`).join("、")}</div>`
    : "";
  const items = h.items || [];
  if(!items.length){ box.innerHTML = shedNote || `<div class="card note" style="grid-column:1/-1">いま閉じる・消すと楽になるものは見当たらない</div>`; return; }
  const EXCLUDED_APPS = new Set(["Brave Browser", "Google Chrome"]); // 絶対に閉じない（Happy Place Station | LovableのChromeを巻き込むため）
  box.innerHTML = shedNote + items.map(it=>{
    const color = it.safe ? "green" : "yellow";
    let btnHtml = "";
    if(it.kind === "mem" && it.app){
      btnHtml = EXCLUDED_APPS.has(it.app)
        ? `<p class="excluded">🔒 除外対象：Brave・Chromeは自動で閉じません</p>`
        : `<div class="cmdrow"><button type="button" class="cmdbtn" data-action="close_app" data-target="${esc(it.app)}" data-label="${esc(it.label)}">🗑 閉じる</button><span data-cmdid-slot></span></div>`;
    }
    const d = `<p>${esc(it.how || "")}</p><p class="src">${it.safe ? "安全：作り直せる／閉じれば戻る。未保存の書類があれば保存待ちで失敗になる" : "要判断：戻らない・作業中を止める。本人の一言が要る"}</p>${btnHtml}`;
    return card(color, it.label, it.effect, it.safe ? "" : `<span class="n">要判断</span>`, d);
  }).join("");
  renderCmdStatus();
}
/* 2026-09-04 「発車待ちを読み込み中…」のまま止まる事故への対応。
   これまで台帳(queue.json)の読み込みは**開始時の1回だけ**で、通信が一度でも失敗すると
   `.catch(()=>{})` が黙って握りつぶし、二度と読みに行かなかった（＝永久に「読み込み中」）。
   30秒おきに読み直し、失敗したことも画面に出す。 */
window.__queueErr = 0;
function refreshHealth(){
  // 2026-09-05 中継所が使えるなら、そちらから**Macの生の台帳**を読む。
  //   GitHub Pages側のコピーは公開が5分以上遅れるため、押した直後に古い状態へ戻ってしまい
  //   「押しても動かない・完了に入らない」に見えていた。中継所なら押した瞬間に反映される。
  const relay = (window.__relay && window.__relay.url);
  const src = relay ? (relay.replace(/\/$/, "") + "/queue?t=" + Date.now())
                    : ("status/queue.json?t=" + Date.now());
  return fetch(src, {cache:"no-store", headers: relay ? RELAY_HEADERS : {}})

      if(window.__orderHold && Date.now() < window.__orderHold && window.__queue){

const KIND_LABEL = {working:"作業中", asked:"判断待ち", stuck_tool:"承認待ち", idle_done:"終了・待機", unknown:"不明"};
const RED_H = 3, SKULL_H = 6;
function sessState(s, measured){
  const started = s.startedAt ? new Date(s.startedAt).getTime() : null;
  const elapsedMin = started ? (measured - started)/60000 : null;
  const skull = elapsedMin != null && elapsedMin >= SKULL_H*60 && s.kind !== "idle_done";
  let color = "gray", label = KIND_LABEL[s.kind] || "不明";
  if(s.kind === "working") { color = "green"; }
  if(s.kind === "asked" || s.kind === "stuck_tool") { color = "yellow"; }
  if(s.kind === "unknown") { color = "red"; }
  if(s.kind !== "idle_done" && elapsedMin != null && elapsedMin >= RED_H*60){ color = "red"; label = `${Math.floor(elapsedMin/60)}時間 報告なし`; }
  // 止まらない工場側が色と状態を出していれば、そちらを正とする（判定は1か所に）
  if(s.color && ["green","yellow","red","blue","gray"].includes(s.color)){ color = s.color; if(s.status) label = s.status; }
  if(s.done) { color = "blue"; label = s.status || "完了"; }
  return {color, label, elapsedMin: s.elapsedMin ?? elapsedMin, skull, started};
}

const EXCLUDE_NOW_TITLE = /mimawari|見回り|sweep|watchdog|見張り番/i;
const HANDOFF_MIN = 180; // 3時間ルール（既定）
// 2026-09-03 たまごさん：単発の仕事は「1時間で終わらないかな？」と時間を指定することがある。
// data.js の running に {sessionTitle:"…", limitMin:60} を書くと、そのカードだけ制限時間が変わる。
function limitMinFor(s){
  try{
    const t = (s && s.title) || "";
    // 台帳に制限時間が書いてあればそれを使う（テストの10分など）
    const qi = ((window.__queue && window.__queue.items) || [])
      .find(x => x.status === "running" && (String(x.sessionId||"") === String(s.cli||"-") || String(x.pid) === String(s.pid)));
    if(qi && qi.limitMin) return qi.limitMin;
    for(const r of ((window.DATA && DATA.running) || [])){
      if(!r || !r.limitMin || !r.sessionTitle) continue;
      if(t && (t === r.sessionTitle || t.includes(r.sessionTitle) || r.sessionTitle.includes(t))) return r.limitMin;
    }

}

/* 2026-09-05 たまごさん「今あなたこれ1回引っ込めて、みたいな。割り込みもあり、緊急で入るから。

function qnOf(s){

function collectNow(m){
  const measured = m && m.measuredAt ? new Date(m.measuredAt).getTime() : Date.now();
  const list = (m && m.sessionList) || [];
  const byKey = new Map(); // 同じセッションが複数pidで重複して出ることがあるので1本にまとめる（数を誤魔化さない）
  list.forEach(s=>{
    const st = sessState(s, measured);
    if(st.color !== "green") return;
    if(!s.startedAt) return;
    if(EXCLUDE_NOW_TITLE.test(s.title || "")) return;
    // 2026-09-03 たまごさん「無題のセッションって何もわからない。何やってんのか」
    //   → 中身が分からないカードは出さない。Dispatch本体（会話している側）は実作業ではないので出さない。
    //     題名が取れないものも、見ても何も分からないので出さない（本数の数字は別途 capbar に出している）。
    if(s.isDispatchSelf) return;
    let t = (s.title || "").trim();
    if(!t || t === "（不明）" || t === "(不明)"){
      // 自動発車したセッションは題名が付かない。queue.json から pid で引き当てる
      // 2026-09-04 たまごさん「作業中の『題名取得中』はやめて、何をやってるか明確に」
      //   → 引き当ての鍵を pid だけでなくセッションID(cli)にも広げ、
      //     それでも分からない時は「PID◯◯」ではなく、直近の発言の頭を出す（何をしているかが分かる方を出す）。
      const qi = (window.__queue && window.__queue.items) || [];
      const q = qi.find(x => String(x.sessionId || "") === String(s.cli || "-"))
             || qi.find(x => String(x.pid) === String(s.pid));
      const say = (s.lastReport || "").replace(/\s+/g, " ").trim();
      t = q ? q.title : (say ? ("作業中：" + say.slice(0, 40)) : "自動発車のセッション（台帳と結びついていません）");
      s = Object.assign({}, s, {title: t, _auto: true});
    }
    const key = s.cli || s.localId || s.title;
    const prev = byKey.get(key);
    if(!prev || (s.idleMin ?? 999) < (prev.idleMin ?? 999)) byKey.set(key, s);
  });
  // 2026-09-04 台帳(queue.json)で「走行中」になっているものも必ず出す。
  //   machine.json は5分おきの重い計測でしか書き変わらないうえ、Claudeのセッションしか載せない。
  //   そのため、発車した直後の数分と、Claude以外で走らせているもの（テスト等）が
  //   「作業中」に一切出なかった。台帳が正本なので、載っていなければここで足す。
  ((window.__queue && window.__queue.items) || []).forEach(it=>{
    if(it.status !== "running") return;
    const key = it.sessionId || ("q" + it.n);
    if(byKey.has(key)) return;
    if([...byKey.values()].some(s => String(s.pid) === String(it.pid))) return;
    const started = it.startedAt ? new Date(it.startedAt).getTime() : Date.now();
    byKey.set(key, {
      cli: it.sessionId, pid: it.pid, title: it.title,
      startedAt: it.startedAt, lastActivityAt: it.startedAt,
      elapsedMin: Math.max(0, Math.round((Date.now() - started) / 60000)),
      model: it.test ? "test" : (it.model || "claude-sonnet-5"),
      status: "作業中", color: "green", kind: "working",
      urls: [], done: false, turns: 0, idleMin: 0, _fromQueue: true,
    });
  });
  return Array.from(byKey.values());
}

    // 1画面に8〜10本入れるため、1枚を「題名2行＋下段1行」だけにした。
    // 下段＝モデル／経過時間（何分過ぎたか）／残り時間。発言の鮮度は経過時間の隣に小さく出す。
    return `<div class="nowcard${isFable ? " fable" : ""}" data-start="${esc(s.startedAt || "")}" data-limit="${limitMinFor(s)}">
      <div class="nt">${esc(nowTitle(s))}</div>
      <div class="nowfoot">
        <span class="nmeta"><span class="nbadge">${esc(mLbl)}</span><span data-el>—</span><span>${sayFresh ? "🗣️" + esc(sayFresh.text) : ""}</span></span>
        <span class="ncd" data-cd>--:--</span>
      </div>
      <div class="ncdlbl">${esc(limitLabel(limitMinFor(s)))}・${esc(started)}開始</div>
      ${detailOf(qnOf(s))}
      ${qnOf(s) ? `<button type="button" class="npause" data-pause="${qnOf(s)}">⏸ 引っ込める（列の最後尾へ）</button>` : ""}
    </div>`;
  }).join("");
  tickCountdowns();
}
function tickCountdowns(){
  document.querySelectorAll(".nowcard[data-start]").forEach(el=>{
    const start = el.dataset.start, cd = el.querySelector("[data-cd]");
    if(!start || !cd) return;
    const t = new Date(start).getTime(); if(isNaN(t)){ cd.textContent = "—"; return; }
    const limMin = Number(el.dataset.limit) || HANDOFF_MIN;
    const elapsedSec = Math.floor((Date.now() - t)/1000);
    // たまごさん「これは今何分過ぎてるね、が分かるようにしたい」→ 経過も出す
    const elEl = el.querySelector("[data-el]");
    if(elEl){
      const eh = Math.floor(elapsedSec/3600), em = Math.floor((elapsedSec%3600)/60);
      elEl.textContent = eh > 0 ? `${eh}時間${em}分経過` : `${em}分経過`;
    }
    const remainSec = limMin*60 - elapsedSec;
    const over = remainSec < 0, abs = Math.abs(remainSec);
    const hh = Math.floor(abs/3600), mm = Math.floor((abs%3600)/60), ss = abs%60;
    const txt = hh > 0 ? `${hh}:${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}` : `${mm}:${String(ss).padStart(2,"0")}`;
    cd.textContent = (over ? "超過 " : "残り ") + txt;
    cd.className = "ncd" + (over ? " over" : remainSec <= 1800 ? " warn" : "");
  });
}
/* ───── たまごさんの確認待ち ─────
   自動発車が終わると awaiting_check に入る。ここでOK→完了、やり直し→発車待ちの列に戻す。
   2026-09-06(418番) たまごさん「長い文章はいらない。画面で見て『直ったね』という判断にしたい。
   押してみて、ちゃんとそのページに飛んで、反映されてるねという確認をバンバンしていきたい」
   → 各行を①前後スクショ ②押せる本番URL ③完了/やり直しの2ボタンだけ、の形にする。
     文章（終了時刻・全URL一覧・報告本文）と後回し/削除は<details>に畳んで隠す。
     証拠(スクショ)が無い・URLが開けない行は赤く出し、証拠がある行を上に並べる。 */
window.__thumbCache = window.__thumbCache || {};   // checkUrl -> [img,...] | null(見つからず) | "pending"
window.__urlHealthCache = window.__urlHealthCache || {}; // url -> true/false | "pending"
function absUrl(base, src){ try{ return new URL(src, base).href; }catch(e){ return src || ""; } }
// 確認ページ(/share/check/…)は同一オリジンなので実際のHTTPステータスと<img>を両方取れる。
// ここで拾えた画像を「証拠のスクショ」として使う（content_check()が既にimg/数字の有無を検品済みの前提に乗る）。
function fetchCheckPageAssets(url){
  if(window.__thumbCache[url] !== undefined) return Promise.resolve(window.__thumbCache[url]);
  window.__thumbCache[url] = "pending";
  return fetch(url, {cache:"no-store"}).then(res=>{
    window.__urlHealthCache[url] = !!res.ok;
    if(!res.ok){ window.__thumbCache[url] = null; return null; }
    return res.text().then(html=>{
      const doc = new DOMParser().parseFromString(html, "text/html");
      const imgs = Array.from(doc.querySelectorAll("img"))
        .map(im => absUrl(url, im.getAttribute("src") || ""))
        .filter(Boolean);
      window.__thumbCache[url] = imgs.length ? imgs.slice(0,2) : null;
      return window.__thumbCache[url];
    });
  }).catch(()=>{ window.__thumbCache[url] = null; window.__urlHealthCache[url] = false; return null; });
}
// 本番URL（他オリジンのことが多い）はブラウザのCORS制限で中身までは読めないため、
// 「通信そのものが失敗するか」だけを見る（DNS不明・接続不可・タイムアウト＝赤。それ以外は今のところ緑扱い）。
// 同一オリジン（/share/配下）だけは fetchCheckPageAssets 側で本物の404も拾える。
function checkUrlReachable(url){
  if(window.__urlHealthCache[url] !== undefined) return Promise.resolve(window.__urlHealthCache[url]);
  window.__urlHealthCache[url] = "pending";
  const ctrl = ("AbortController" in window) ? new AbortController() : null;
  const timer = ctrl ? setTimeout(()=>ctrl.abort(), 6000) : null;
  return fetch(url, {method:"HEAD", mode:"no-cors", cache:"no-store", signal: ctrl && ctrl.signal})
    .then(()=>{ clearTimeout(timer); window.__urlHealthCache[url] = true; return true; })
    .catch(()=>{ clearTimeout(timer); window.__urlHealthCache[url] = false; return false; });
}
function renderCheck(){
  const box = document.getElementById("check"); if(!box) return;
  const all = (window.__queue && window.__queue.items) || [];
  const rows = all.filter(r => r.status === "awaiting_check");
  document.getElementById("checkMeta").textContent = rows.length ? `${rows.length}件` : "";
  if(!rows.length){ box.innerHTML = `<div class="card note">確認待ちはありません</div>`; return; }
  const evid = rows.map(r=>{
    const urls = (r.urls||[]).filter(Boolean);
    const checkUrl = urls.find(u => u.includes("/share/check/")) || null;
    const primaryUrl = urls.find(u => !u.includes("/share/check/")) || checkUrl || urls[0] || null;
    let thumbs = checkUrl ? window.__thumbCache[checkUrl] : null;
    if(checkUrl && thumbs === undefined){ thumbs = "pending"; fetchCheckPageAssets(checkUrl).then(()=>renderCheck()); }
    let health = primaryUrl ? window.__urlHealthCache[primaryUrl] : undefined;
    if(primaryUrl && health === undefined){
      health = "pending";
      // 確認ページ自体が本番URLの場合は上のfetchで既にurlHealthも埋まるので二重には叩かない
      if(primaryUrl !== checkUrl) checkUrlReachable(primaryUrl).then(()=>renderCheck());
    }
    const hasProof = Array.isArray(thumbs) && thumbs.length > 0;
    const isDead = health === false;
    // 並び順：証拠(スクショ)があるものを最優先、次にURLが生きているもの。分からない(pending)は中間に置く。
    const score = (hasProof ? 2 : 0) + (isDead ? -3 : (health === true ? 1 : 0));
    return {r, urls, checkUrl, primaryUrl, thumbs, health, hasProof, isDead, score};
  });
  evid.sort((a,b)=> b.score - a.score);
  box.innerHTML = evid.map(({r, urls, checkUrl, primaryUrl, thumbs, health, hasProof, isDead})=>{
    const fin = r.finishedAt ? String(r.finishedAt).slice(5,16).replace("T"," ") : "";
    const thumbsHtml = thumbs === "pending"
      ? `<div class="cthumbs wait">確認中…</div>`
      : hasProof
        ? `<div class="cthumbs">${thumbs.map((u,i)=>`<img src="${esc(u)}" loading="lazy" alt="${i===0?"前":"後"}">`).join("")}</div>`
        : `<div class="cthumbs none">⚠️ 証拠なし（スクショが見つかりません）</div>`;
    const urlLabel = health === "pending" ? "▶ 本番を開いて確認" : isDead ? "⚠️ 開けないかも・要確認" : "▶ 本番を開いて確認";
    const urlBtn = primaryUrl
      ? `<a class="curlbtn${isDead ? " dead" : ""}" href="${esc(primaryUrl)}" target="_blank" rel="noopener">${urlLabel}</a>`
      : `<div class="curlbtn dead">⚠️ URLの報告なし</div>`;
    const allUrls = urls.map(u=>`<a class="cu" href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("");
    return `<div class="crow${hasProof ? " proof" : " noproof"}" data-cn="${r.n}">
      <div class="ct">#${r.n} ${esc(r.title)} ${modelChip(r.model)}</div>
      ${thumbsHtml}
      ${urlBtn}
      <!-- 2026-09-06(418番) たまごさん「押すだけで終わる確認待ち」→ 前面は2ボタンだけ。
           あとで/削除・全文の報告・終了時刻・全URL一覧は<details>へ畳む（消してはいない）。 -->
      <div class="cbtns cbtns2">
        <button class="cok" data-ck="ok" data-n="${r.n}">✅ 完了</button>
        <button class="cng" data-ck="ng" data-n="${r.n}">↩︎ やり直し</button>
      </div>
      <details class="cmore"><summary>くわしく</summary>
        <div class="cm">${fin ? fin + " に終了" : ""}</div>
        ${allUrls || `<div class="cm">URLの報告なし</div>`}
        <div class="cr">${esc((r.result||"").slice(0,600))}</div>
        <div class="cbtns">
          <button class="clater" data-ck="later" data-n="${r.n}">🕗 あとで（手が空いたら）</button>
          <button class="cdel" data-ck="del" data-n="${r.n}">🗑 このタスクを消す</button>
        </div>
      </details>
    </div>`;
  }).join("");
}
/* ───── 完了一覧（積み上げ） ─────
   2026-09-04 たまごさん「OKと判定されたものを、日時とURLつきで完了一覧に積む。
   何時何分に完了したかを残す。増えていくのが目に見えるように」
   status:done の項目を、確認した時刻(checkedAt)が新しい順に並べて全部出す（消さない＝積み上がる）。 */
function renderDone(){
  const box = document.getElementById("done"); if(!box) return;
  const all = (window.__queue && window.__queue.items) || [];
  const rows = all.filter(r => r.status === "done")
    .slice()
    .sort((a,b) => new Date(b.checkedAt || b.finishedAt || 0) - new Date(a.checkedAt || a.finishedAt || 0));
  const meta = document.getElementById("doneMeta");
  if(meta) meta.textContent = rows.length ? `${rows.length}件` : "";
  // 2026-09-05 たまごさん「完了も1週間で消して、でも後でたどれるように」→ 控えへの入口は常に残す
  const archLink = `<div class="note" style="margin-top:10px"><a href="share/done/" style="color:var(--green)">1週間より前の完了を見る（完了のひかえ）→</a></div>`;
  if(!rows.length){ box.innerHTML = `<div class="card note">まだありません（OKが出るとここに積み上がります）</div>` + archLink; return; }
  box.innerHTML = rows.map(r=>{
    const stamp = r.checkedAt ? formatStamp(r.checkedAt) : (r.finishedAt ? formatStamp(r.finishedAt) : "—");
    const urls = (r.urls || []).filter(Boolean).map(u=>`<a class="cu" href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("");
    return `<div class="drow" data-dn="${r.n}">
      <div class="ct">#${r.n} ${esc(r.title)} ${modelChip(r.model)}</div>
      <div class="cm">${esc(stamp)} 完了</div>
      ${urls || `<div class="cm">URLの報告なし</div>`}
    </div>`;
  }).join("") + archLink;
}
/* 🕗 後回しボックス。「とりあえずOK」を押したものが入る。発車はしない。 */
function renderLater(){
  const box = document.getElementById("later"); if(!box) return;
  const rows = ((window.__queue && window.__queue.items) || []).filter(r => r.status === "later");
  const meta = document.getElementById("laterMeta");
  if(meta) meta.textContent = rows.length ? `${rows.length}件` : "";
  if(!rows.length){ box.innerHTML = `<div class="card note">後回しはありません</div>`; return; }
  box.innerHTML = rows.map(r=>`<div class="crow" data-cn="${r.n}">
      <div class="ct">#${r.n} ${esc(r.title)} ${modelChip(r.model)}</div>
      <div class="cm">${r.laterAt ? String(r.laterAt).slice(5,16).replace("T"," ") + " に後回し" : ""}</div>
      <div class="cbtns"><button class="cok" data-ck="back" data-n="${r.n}">▶ 発車待ちに戻す</button></div>
    </div>`).join("");
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-ck]"); if(!b) return;
  if(b.dataset.ck === "back"){
    const n = Number(b.dataset.n);
    const it = ((window.__queue && window.__queue.items) || []).find(x => x.n === n);
    if(it){ it.status = "waiting"; it.priority = 5; }
    sendCommandWithId("b" + Date.now().toString(36), "queue_redo", n + ":5", "▶ 発車待ちへ戻す " + n + "番");
    renderLater(); renderQueue();
    return;
  }
  // 2026-09-04 たまごさん「70点だけど今急ぎじゃないからいいや、という状態がある。
  //   やり直しも、今すぐのと、順番待ちの後ろでいいのがある」→ 判定を4つに分けた。
  const n = Number(b.dataset.n), kind = b.dataset.ck;
  if(kind === "del"){
    // タスクそのものを消す。取り消せるようMac側で status/deleted.json に控える
    const arr = (window.__queue && window.__queue.items) || [];
    const i = arr.findIndex(x => x.n === n); if(i >= 0) arr.splice(i, 1);
    sendCommandWithId("d" + Date.now().toString(36), "queue_delete", String(n), "🗑 消す " + n + "番");
    try{ renderCheck(); renderQueue(); renderDone(); renderLater(); }catch(e){}
    return;
  }
  const ok = (kind === "ok" || kind === "later");
  const it = ((window.__queue && window.__queue.items) || []).find(x => x.n === n);
  if(!it) return;
  it.status = (kind === "later") ? "later" : (ok ? "done" : "waiting");   // 「とりあえずOK」は後回しボックスへ
  it.checkedAt = new Date().toISOString();
  // やり直しは常に「今すぐ」＝列の先頭（P1）。「後ろでいい」は「あとで」に統合した
  if(!ok){ delete it.finishedAt; delete it.result; delete it.urls; it.priority = 1; }
  // 端末内にも一応残す（監査用。実際の反映先は下のObsidian経由）
  try{
    const k = "shinchoku_check_v1";
    const saved = JSON.parse(localStorage.getItem(k) || "{}");
    saved["Q"+n] = {ok, kind, t: new Date().toISOString()};
    localStorage.setItem(k, JSON.stringify(saved));
  }catch(err){}
  // 2026-09-04 判定を端末だけに残さず、優先度・リモコンと同じ道（obsidian://new → Vault →
  //   Mac側 command_ingest.py）でqueue.jsonへ反映する。queue_ok=done／queue_redo=waitingに戻し列の先頭へ。
  const id = "q" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const CMD = {
    ok:    ["queue_ok",    String(n),       "✅完了 "],
    later: ["queue_later", String(n),       "🕗あとで "],
    ng:    ["queue_redo",  String(n),       "↩︎やり直し（今すぐ）"],
  }[kind] || ["queue_ok", String(n), "✅完了 "];
  sendCommandWithId(id, CMD[0], CMD[1], CMD[2] + n + "番");
  renderCheck(); renderQueue(); renderDone(); renderLater();
});

/* ───── 次に発車（予備軍）─────
   2026-09-04 たまごさん「そこにも俺、優先順位つけるよ」→ 各行のPボタンで1〜5を付けられる。
   付けた優先度は既存の優先度受信（Obsidian経由）と同じ仕組みに乗せる。 */
function renderQueue(){
  const box = document.getElementById("queue");
  // 2026-09-04 正本を queue.json に移した（auto_launcher.py が着火して status を書き換える）。
  //   data.js 側は残置。waiting のものだけを「次に発車」として出す。
  const all = (window.__queue && window.__queue.items) || (window.DATA && DATA.queue) || [];
  // 2026-09-04 発車の順番と画面の並びを一致させる（auto_launcher.py の rank と同じ規則）。
  //   ここがバラバラだと「次」と書いてあるものと実際に発車するものが食い違う。
  // 2026-09-05 並びは「優先度 → 手で並べ替えた順(order) → 番号」。Mac側の発車順(rank)と同じ規則。
  //   ここを番号順だけにしていたので、下げたものが読み直しのたびに上へ戻っていた。
  const rows = all.filter(r => (r.status || "waiting") === "waiting")
    .map(r => Object.assign({}, r, {_p: (prioOf("Q" + r.n) || r.priority || 99),
                                    _o: (typeof r.order === "number" ? r.order : 1e6)}))
    .sort((a,b) => (a._p - b._p) || (a._o - b._o) || (a.n - b.n));
  if(!box) return;
  // 2026-09-04 **致命的なバグだった箇所。**ここで `DATA.queueUpdatedAt` を裸で読んでいた。
  //   data.js は後から読み込む別ファイルなので、間に合っていないと DATA が無く ReferenceError になる。
  //   その例外は呼び出し元の try/catch に飲まれ、**画面は「読み込み中…」のまま二度と描き変わらなかった。**
  //   しかも発車待ちが0件のときは三項演算子で参照されず素通りするため、
  //   「0件のときは表示され、24件あるときだけ固まる」という分かりにくい形で出ていた。
  //   台帳(queue.json)自身が更新時刻を持っているので、data.js には頼らない。
  const qUpdated = (window.__queue && window.__queue.updatedAt)
    || (window.DATA && window.DATA.queueUpdatedAt) || "";
  const meta = document.getElementById("queueMeta");
  if(meta) meta.textContent = rows.length ? `${rows.length}件${qUpdated ? "・" + qUpdated : ""}` : "";
  // 2026-09-04 「発車待ちがない」と出ていたのに台帳には15本あった。原因を切り分けられるよう、
  //   ①まだ読めていない ②読めたが本当に0本 を区別して出す。黙って「ありません」と出さない。
  if(!rows.length){
    box.innerHTML = window.__queue
      ? `<div class="card note">発車待ちはありません（台帳${(all||[]).length}件を読み込み済み）</div>`
      : (window.__queueErr
          ? `<div class="card note">台帳が読めませんでした（${window.__queueErr}回失敗）。30秒ごとに自動で読み直しています</div>`
          : `<div class="card note">発車待ちを読み込み中…</div>`);
    return;
  }
  // 2026-09-04 たまごさん「演者が同定されていない、って何のことだろうみたいな。どういうことなのか分かりたいね。
  //   1から20番で全部トグルで閉じて、スクショとか載せられると」
  //   → 1行ごとに畳んだ説明（what）を持たせた。タップで開く。
  // 2026-09-05 たまごさん「1から5までの箱があっていいと思う。**ランキングが低いのが前に出てこないように。
  //   上のやつが無くなったら上がってくる。**優先度4のやつがいきなり埋めてくるのは困る」
  //   → 5つの箱に分けて出す。上の箱が空になるまで下の箱からは発車しない（発車の規則も同じ）。
  const BOX = [[1,"1 今すぐ"],[2,"2 高い"],[3,"3 ふつう"],[4,"4 低い"],[5,"5 後回し"],[9,"未設定"]];
  // 2026-09-05 たまごさん「ドラッグアンドドロップで順番入れ替えられるようにしたい、上下。
  //   今さ、押したら1個下に下がる、みたいなやつでしょ。すごいやりづらいです」
  //   → 左端の「⣿」を掴んで動かす。指でもマウスでも動くよう pointer イベントで書く。
  //   落とした場所の箱の優先度をそのまま引き継ぎ、並び順(order)を台帳へ送る。
  const rowHtml = (r,i,globalIdx)=>{
    const p = prioOf("Q" + r.n) || r.priority || 0;
    return `<div class="qrow${globalIdx===0 ? " next" : ""}" data-n="${r.n}" data-p="${p||9}">
      <span class="qgrip" title="つまんで動かす">⣿</span>
      <span class="qn">${globalIdx===0 ? "次" : (globalIdx+1)}</span><span class="qno">#${r.n}</span> ${modelChip(r.model)}
      <span class="qbody">
        <details class="qd"><summary><span class="qt">${esc(r.title)}</span><span class="qw">${esc(r.why||"")}</span></summary>
          <div class="qwhat">${esc(r.what || "（説明はまだ書いていません）")}</div>
        </details>
      </span>
      <button class="qp${p ? " on" : ""}" data-qp="${r.n}">${p ? p : "—"}</button>
    </div>`;
  };
  let gi = 0, html = "";
  for(const [lvl, label] of BOX){
    const inBox = rows.filter(r => ((prioOf("Q" + r.n) || r.priority || 9)) === lvl);
    if(!inBox.length) continue;
    html += `<div class="qbox" data-box="${lvl}"><div class="qboxh">${label} <b>${inBox.length}</b>件</div>`
          + inBox.map((r,i)=>rowHtml(r,i,gi++)).join("") + `</div>`;
  }
  box.innerHTML = html;
  wireDrag(box);
}

/* ───── つまんで動かす（指でもマウスでも）2026-09-05 ─────
   たまごさん「ドラッグアンドドロップで、納車みたいに、順番入れ替えられるようにしたい」。
   HTML標準のドラッグはスマホで動かないので pointer イベントで自前でやる。
   ・掴めるのは左端の「⣿」だけ（本文をタップしたら今まで通り説明が開く）
   ・動かしている間、指の位置にある行と入れ替えて見た目を先に変える
   ・離した瞬間に、落ちた箱の優先度と、上から順の並びを台帳へ送る */
/* 2026-09-05（2回目）たまごさん
   「つまんで、なんか戻っちゃったりするよ。一回下にやったのに、また上に上がっちゃったり。
     もっと操作感良くならないの。**Notionみたいなのが理想。棒が入ってここに入れるんだよみたいな。
     棒も一緒に動いて。**」
   直したこと：
   ① 動かしている間、行そのものは動かさない。**入る場所に青い棒**を出す（Notionと同じ）
   ② 掴んだ行の影が指について回る（今どれを持っているか分かる）
   ③ 離した瞬間に**手元の台帳へ先に書き込む**。これをやっていなかったので、30秒ごとの
      読み直しが来ると古い並びで描き直され、**下げたものが上に戻っていた。**
   ④ 送っている間は読み直しで上書きしない（10秒間） */
let DRAG = null;
window.__orderHold = 0;   // この時刻までは外から来た並びで描き直さない

/* 2026-09-06 掴んだあとの後始末。**どんな終わり方でも必ずここを通す。**
   影（.qghost）・棒（.qbar）・薄くなった行（.qdrag）・固定したスクロール、
   この4つが1つでも残ると「文字が残る」「線が変」に見える。まとめて消す。 */
function cleanupDrag(){
  document.querySelectorAll(".qghost").forEach(function(el){ try{ el.remove(); }catch(_){} });
  const bar = document.getElementById("qInsertBar");
  if(bar){ bar.style.display = "none"; }
  document.querySelectorAll(".qrow.qdrag").forEach(function(el){ el.classList.remove("qdrag"); });
  document.body.style.overflow = "";
  document.body.style.touchAction = "";
  DRAG = null;
}
/* 画面の外で指を離した・別のアプリに切り替わった、でも必ず掃除する */
window.addEventListener("pointerup", function(){ if(DRAG) cleanupDrag(); });
window.addEventListener("pointercancel", function(){ if(DRAG) cleanupDrag(); });
window.addEventListener("blur", function(){ if(DRAG) cleanupDrag(); });
function qbar(){
  let b = document.getElementById("qInsertBar");
  if(!b){
    b = document.createElement("div");
    b.id = "qInsertBar"; b.className = "qbar";
    document.body.appendChild(b);
  }
  return b;
}
/* 指の高さに、いちばん近い「行の境目」を返す。必ずどこかを返すので棒が消えない。 */
function nearestSlot(y){
  const rows = Array.from(document.querySelectorAll("#queue .qrow"))
    .filter(r => !r.classList.contains("qdrag"));
  let best = null, bestD = Infinity;
  for(const r of rows){
    const rect = r.getBoundingClientRect();
    if(rect.height === 0) continue;
    const cands = [[false, rect.top], [true, rect.bottom]];
    for(const [after, yy] of cands){
      const d = Math.abs(y - yy);
      if(d < bestD){ bestD = d; best = {row:r, after, y:yy, rect}; }
    }
  }
  return best;
}
function wireDrag(box){
  box.querySelectorAll(".qgrip").forEach(g=>{
    g.addEventListener("pointerdown", e=>{
      const row = e.target.closest(".qrow"); if(!row) return;
      e.preventDefault();
      try{ g.setPointerCapture(e.pointerId); }catch(_){}
      const r = row.getBoundingClientRect();
      // 2026-09-06 たまごさん「タスク移動がまだバグってる」
      //   行を丸ごと複製して影にしていたので、**題名が長い行を掴むと影が画面の半分を覆い、
      //   走行中のカードの上にまで乗って何を持っているか分からなくなっていた。**
      //   → 影は**題名だけの小さな札**にする。指のそばに小さく付いてくるだけでいい。
      const ghost = document.createElement("div");
      ghost.className = "qghost";
      const t = row.querySelector(".qt");
      ghost.textContent = "#" + (row.dataset.n || "") + "  " + ((t && t.textContent) || "").slice(0, 24);
      ghost.style.left = (r.left + 8) + "px";
      ghost.style.top = r.top + "px";
      document.body.appendChild(ghost);
      DRAG = {row, id:e.pointerId, ghost, dy: 14, target:null, after:false};
      row.classList.add("qdrag");
      // 2026-09-06 たまごさん「ラインの位置が変」。
      //   棒は画面座標(fixed)で描いているので、**掴んでいる最中にページが動くと棒だけ取り残される。**
      //   指を動かさずにスクロールした瞬間がまさにそれ。→ 掴んでいる間はページを固定する。
      DRAG.scrollY = window.scrollY;
      document.body.style.overflow = "hidden";
      document.body.style.touchAction = "none";
      if(navigator.vibrate) try{ navigator.vibrate(8); }catch(_){}
    });
    g.addEventListener("pointermove", e=>{
      if(!DRAG || DRAG.id !== e.pointerId) return;
      e.preventDefault();
      DRAG.ghost.style.top = (e.clientY - DRAG.dy) + "px";
      // 2026-09-05（3回目）たまごさん「**マグネットみたいにカシャンカシャンってなってほしい。
      //   ちゃんと指定したところにカシャッとはまるようにして**」
      //   指の真下に行が無い（枠の外へ出た・行と行の隙間）と、棒が消えて宙ぶらりんになっていた。
      //   → 指の高さに**いちばん近い行の境目**を必ず選ぶ。だから絶対に外れない＝カシャッと吸い付く。
      const slot = nearestSlot(e.clientY);
      const bar = qbar();
      if(!slot){ DRAG.target = null; bar.style.display = "none"; return; }
      const changed = (DRAG.target !== slot.row) || (DRAG.after !== slot.after);
      DRAG.target = slot.row; DRAG.after = slot.after;
      bar.style.display = "block";
      bar.style.left = slot.rect.left + "px";
      bar.style.width = slot.rect.width + "px";
      bar.style.top = (slot.y - 1) + "px";
      if(changed && navigator.vibrate){ try{ navigator.vibrate(4); }catch(_){} }   // カシャッの手応え
    });
    const finish = e=>{
      // 2026-09-06 たまごさん「文字が残ってたり、線のバーが変だったり。70点」
      //   指を離すやり方は1つではない（画面の外で離す・別のアプリに切り替わる・
      //   指が2本になる）。**pointerupが来ないまま終わることがある。**
      //   そのとき影と棒がそのまま残り、掴んだ行も薄いままになっていた。
      //   → 後始末は必ず1か所（cleanupDrag）を通す。イベントの種類に関わらず必ず掃除する。
      if(!DRAG || (e && e.pointerId != null && DRAG.id !== e.pointerId)) { cleanupDrag(); return; }
      const {row, target, after} = DRAG;
      cleanupDrag();   // 影・棒・薄い行・スクロール固定を、まとめて必ず片づける
      if(target && target.parentElement){
        target.parentElement.insertBefore(row, after ? target.nextSibling : target);
        // カシャッと収まった合図（一瞬だけ光らせる）
        row.classList.add("qsnap");
        setTimeout(()=>row.classList.remove("qsnap"), 320);
        if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(_){} }
      }
      const bx = row.closest(".qbox");
      const newP = bx ? Number(bx.dataset.box) : 0;
      const n = Number(row.dataset.n), oldP = Number(row.dataset.p);
      const items = (window.__queue && window.__queue.items) || [];
      const rows = Array.from(document.querySelectorAll("#queue .qrow"));
      // ③ 手元の台帳を先に書き換える。これで読み直しが来ても並びが戻らない
      rows.forEach((x, i)=>{
        const it = items.find(y => y.n === Number(x.dataset.n));
        if(it) it.order = i + 1;
      });
      if(newP && newP !== oldP && newP !== 9){
        const it = items.find(y => y.n === n);
        if(it) it.priority = newP;
        setPrio("Q" + n, newP);
        sendCommandWithId("p" + Date.now().toString(36), "queue_prio", n + ":" + newP, "P" + newP + " へ " + n + "番");
        row.dataset.p = String(newP);
      }
      const order = rows.map(x=>x.dataset.n).filter(Boolean);
      if(order.length){
        sendCommandWithId("o" + Date.now().toString(36), "queue_order", order.join(","), "並び順を保存");
      }
      window.__orderHold = Date.now() + 10000;   // ④ 10秒は外の並びで描き直さない
      try{ renderQueue(); }catch(_){}
    };
    g.addEventListener("pointerup", finish);
    g.addEventListener("pointercancel", finish);
    g.addEventListener("lostpointercapture", function(e){ if(DRAG && DRAG.id === e.pointerId) finish(e); });
  });
}
/* ───── 燃料の栓（発車の停止・再開／同時本数）───── */
let FUEL_ON = true, FUEL_CAP = null;
function renderFuel(){
  const b = document.getElementById("fuelToggle"), msg = document.getElementById("fuelMsg");
  if(b){ b.textContent = FUEL_ON ? "⏸ 発車を止める" : "▶ 発車を出す"; b.classList.toggle("off", !FUEL_ON); }
  // 2026-09-05 「発車待ちに入っているのに何も動いていない」の理由を必ず画面に出す。
  //   黙って出さないのがいちばん困る（壊れているのか、止めているのか分からない）。
  const q = window.__quota || {};
  const stop = (typeof q.allPct === "number") && q.allPct >= (q.stopPct || 85);
  if(msg){
    msg.textContent = !FUEL_ON ? "止まっています（判定と繰り上げは動きます）"
      : stop ? `週枠が上限（${q.allPct}%）。本物の仕事は発車しません＝クレジットを使いません`
      : "発車中（空いたら次が出ます）";
    msg.style.color = (!FUEL_ON || stop) ? "var(--yellow)" : "";
  }
  document.querySelectorAll("#fuelBox .cap").forEach(x=>x.classList.toggle("on", +x.dataset.cap === FUEL_CAP));
}
function refreshFuel(){
  return Promise.all([
    fetch("status/launch_cap.json?t=" + Date.now(), {cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch("status/no_launch.flag?t=" + Date.now(), {cache:"no-store"}).then(r=>r.ok).catch(()=>false),
  ]).then(([cap, paused])=>{ FUEL_CAP = cap && typeof cap.cap === "number" ? cap.cap : null; FUEL_ON = !paused; renderFuel(); });
}
refreshFuel();
setInterval(refreshFuel, 60000);
document.addEventListener("click", e=>{
  const t = e.target.closest("#fuelToggle");
  if(t){
    FUEL_ON = !FUEL_ON; renderFuel();
    sendCommandWithId("f" + Date.now().toString(36), FUEL_ON ? "launch_resume" : "launch_pause", "1",
      FUEL_ON ? "▶ 発車を出す" : "⏸ 発車を止める");

});
const QP_TIMER = {};   // Pの連打をまとめるためのタイマー置き場
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-qp]"); if(!b) return;
  const n = b.dataset.qp;

/* ───── ホワイトボード（ai-brain/live/whiteboard.md の写し status/whiteboard.json。セッションはこの順に取る） ───── */
/* 実態の状態：台帳の「作業中」ラベルは信じない。今この瞬間に生きて動いているセッションが担当している行だけ緑。
   それ以外の「作業中」は赤＝止まっている（止まってからの時間＝最終更新からの経過）。 */
function liveSessions(){
  const m = window.__machine; const out = [];
  ((m && m.sessionList) || []).forEach(s=>{
    const st = sessState(s, m.measuredAt ? new Date(m.measuredAt).getTime() : Date.now());
    out.push({s, st, ids:[s.localId, s.cli].filter(Boolean).map(x=>String(x).slice(0,14))});
  });
  return out;
}
function findLive(owner){
  if(!owner || owner === "-") return null;
  const key = String(owner).slice(0,14);
  return liveSessions().find(x => x.ids.some(id => id === key || key.startsWith(id) || id.startsWith(key))) || null;
}
function hoursSince(stamp){ // "2026-09-02 19:24" or ISO
  if(!stamp) return null;
  const t = new Date(String(stamp).replace(" ", "T")).getTime();
  return isNaN(t) ? null : Math.max(0, (Date.now() - t)/3600000);
}
function fmtH(h){ if(h == null) return "不明"; return h < 1 ? `${Math.round(h*60)}分` : h < 48 ? `${Math.floor(h)}時間` : `${Math.floor(h/24)}日`; }
// 台帳の状態 → 実態の状態（color, label, order）
function effectiveState(state, owner, updatedAt){
  const live = findLive(owner);
  if(state === "作業中"){
    if(live && live.st.color === "green") return {color:"green", label:"動いている", order:0, live};
    const h = hoursSince(updatedAt);
    return {color:"red", label:`止まっている ${fmtH(h)}${live ? "（担当は" + live.st.label + "）" : ""}`, order:1, live, h};
  }
  if(state === "判断待ち") return {color:"yellow", label:"判断待ち（たまごさん）", order:2};
  if(state === "検証待ち") return {color:"blue", label:"検証待ち（別の目）", order:3};
  if(state === "完了") return {color:"gray", label:"完了", order:5};
  return {color:"gray", label:"未着手", order:4};
}
function renderWhiteboard(w){
  const box = document.getElementById("wb");
  const rows = (w && w.rows) || [];
  document.getElementById("wbMeta").textContent = w && w.updatedAt ? `${rows.length}件・${w.updatedAt.slice(5)}` : "";
  if(!rows.length){ box.innerHTML = `<div class="card note" style="grid-column:1/-1">ホワイトボードの写しがまだ無い（Mac側 whiteboard.py sync が5分おきに書く）</div>`; return; }
  const num = r => String(parseInt(String(r.id).replace(/^T/,""), 10));
  const items = rows.map(r => ({r, e: effectiveState(r.state, r.owner, r.updatedAt)}));
  const cnt = {}; items.forEach(x => cnt[x.e.color] = (cnt[x.e.color]||0)+1);
  document.getElementById("wbMeta").textContent += `　動いている${cnt.green||0}・止まっている${cnt.red||0}`;
  window.__wbLive = {}; items.forEach(x => { window.__wbLive[num(x.r)] = x.e; });
  if(window.SHINCHOKU_ALL && document.getElementById("all").children.length) renderAll();  // 225件側の色も実態に合わせ直す
  items.sort((a,b)=> a.e.order - b.e.order || (a.r.priority||3)-(b.r.priority||3) || (a.r.rank||999)-(b.r.rank||999));
  // 2026-09-03 たまごさん「ブロックで分けて、カテゴリで分けて。完了は一番上にまとめて隠しといて。
  //   止まってる・判断待ち・未着手・検証中もトグルで閉じられるように」
  //   → 状態ごとに折りたたみのブロックへ。完了と検証待ちは最初から畳んでおく（件数だけ見えればいい）。
  const cardHtml = ({r, e}) => {
    const resumes = e.live ? ((e.live.s.watchdogResumes||0) + (e.live.s.dispatchPushes||0) + (e.live.s.humanPushes||0)) : 0;
    const extra = (r.count && r.count !== "台帳" ? `<span class="n">${esc(r.count)}回</span>` : "") + (resumes ? `<span class="chip">🔁${resumes}</span>` : "") + (e.h != null && e.h >= 6 ? `<span class="sk">💀</span>` : "");
    const d = `<p>台帳の状態 <b>${esc(r.state)}</b>　担当 <b>${esc(r.owner || "空き（誰も持っていない）")}</b>　順位 <b>${r.rank ?? "—"}</b>　最終更新 <b>${esc(r.updatedAt||"")}</b></p>
      ${e.color === "red" ? `<p class="src">判定：担当セッションが今動いていない（生きていない・報告が無い）。台帳が「作業中」でも止まっている扱い。自動再開は見張り番（5分おき）が担う</p>` : ""}
      <p>${esc(r.note||"")}</p>
      ${linksHtml([{label:"関連メモを検索", url:`obsidian://search?vault=tamago_brain&query=${encodeURIComponent(r.task||"")}`}])}`;
    return card(e.color, `${num(r)}. ${r.task}`, e.label, extra, d, num(r));
  };
  // 2026-09-03 たまごさん「止まっている・判断待ちとかも全部畳めるようにして。見づらいから」
  //   → 既定は全部畳む。件数だけ見えて、開きたいものだけ開く。
  const GROUPS = [
    {title:"完了",                  open:false, hit:e => e.label.indexOf("完了") === 0},
    {title:"止まっている",          open:false, hit:e => e.color === "red"},
    {title:"判断待ち（たまごさん）", open:false, hit:e => e.color === "yellow"},
    {title:"いま動いている",        open:false, hit:e => e.color === "green"},
    {title:"検証待ち（別の目）",    open:false, hit:e => e.color === "blue"},
    {title:"未着手",                open:false, hit:e => true},
  ];
  const buckets = GROUPS.map(()=>[]);
  items.forEach(x => {
    const i = GROUPS.findIndex(g => g.hit(x.e));
    buckets[i < 0 ? GROUPS.length - 1 : i].push(x);
  });
  // 2026-09-04：画面には出さない（下の「依頼」に統合済み）。実態の色は window.__wbLive 経由で配るだけ。
  box.innerHTML = "";
  void GROUPS; void buckets; void cardHtml;
}

/* ───── 未処理の依頼（225件） ───── */
// 台帳の札 → 実態の状態。「着手中」は今動いているセッションが無ければ止まっている（赤）。動いているものはホワイトボード側で緑になる
const ALL_META = {
  "🟠":{label:"止まっている（台帳は着手中）", short:"止まっている", color:"red",    order:0},
  "⏸":{label:"判断待ち（たまごさん）",       short:"判断待ち",     color:"yellow", order:1},
  "🟡":{label:"実装済・本番未確認",           short:"実装済・未確認", color:"blue",  order:2},
  "🔵":{label:"検証中（別の目）",             short:"検証中",       color:"blue",   order:3},
  "🔴":{label:"未着手",                       short:"未着手",       color:"gray",   order:4},
  "❓":{label:"完了か不明",                   short:"完了か不明",   color:"gray",   order:5},
  "✅":{label:"完了",                         short:"完了",         color:"gray",   order:6},
};
function lastDateOf(it){ // 出典の中の一番新しい MM-DD から「止まってから」を推定（約）
  const ds = [...(it.src||"").matchAll(/(\d{2})-(\d{2})/g)].map(m=>new Date(`2026-${m[1]}-${m[2]}T12:00:00+09:00`).getTime()).filter(x=>!isNaN(x));
  return ds.length ? Math.max(...ds) : null;
}
function timesOf(it){ const m = (it.body && it.body[0] || "").match(/／\s*(\d+回[^（｜／]*)/); return m ? m[1].trim() : ""; }
function renderAll(){
  if(!document.getElementById("all")) return;   // 表示欄を消したので、無ければ何もしない
  const A = window.SHINCHOKU_ALL; if(!A) return;
  document.getElementById("allMeta").textContent = `${A.items.length + A.old.length}件・${A.generatedAt}`;
  const groups = {}; A.items.forEach(it=>{ (groups[it.badge] ||= []).push(it); });
  // 2026-09-04 たまごさん「ダブりの表現がある。これいらないわ、削っちゃっていい。同じ表現を繰り返さないで」
  //   →「⏸ 判断待ち（たまごさん）」は、上の「🔎 たまごさんの確認待ち」と同じことを言っている。
  //     判定して押す場所は上の1か所だけにする。件数と日付（225件・生成日時）はそのまま残す。
  const DUP_HIDE = ["⏸"];
  const keys = Object.keys(ALL_META).sort((a,b)=>ALL_META[a].order-ALL_META[b].order)
    .filter(k=>groups[k] && !DUP_HIDE.includes(k));
  document.getElementById("allSummary").innerHTML = keys.map(k=>`<a class="${ALL_META[k].color}" href="#a-${ALL_META[k].order}">${k} ${ALL_META[k].label}<b>${groups[k].length}</b></a>`).join("")
    + `<a href="#a-old">旧台帳<b>${A.old.length}</b></a>`;
  let h = "";
  keys.forEach(k=>{
    const m = ALL_META[k];
    // 2026-09-03 たまごさん「止まってるだとか判断待ちだとか未着手だとか、それぞれ畳めるようにして。見づらいから」
    //   → 見出しだけの区切りをやめて、状態ごとの折りたたみにした。既定は全部畳む。
    h += `<details class="wbg" id="a-${m.order}"><summary class="${m.color}">${k} ${esc(m.label)} <b>${groups[k].length}</b>件</summary><div class="g wbginner">`;
    // たまごさんの★が高い順 → 元の緊急度順
    const rank = it => prioOf(it.no) || 9;   // 1が最優先。未設定は後ろ
    [...groups[k]].sort((a,b)=> rank(a) - rank(b)).forEach(it=>{
      const times = timesOf(it);
      // ホワイトボード側で「今動いている」と判定された番号は緑にする（台帳の札より実態を優先）
      const live = (window.__wbLive || {})[String(it.no)];
      let color = m.color, label = m.short, extra = times ? `<span class="n">${esc(times)}</span>` : "";
      if(live && live.color === "green"){ color = "green"; label = "動いている"; }
      else if(k === "🟠"){
        const t = live && live.h != null ? live.h : (lastDateOf(it) ? (Date.now() - lastDateOf(it))/3600000 : null);
        label = `止まっている ${t != null ? "約" + fmtH(t) : ""}`.trim();
        if(t != null && t >= 24) extra += `<span class="sk">💀</span>`;
      }
      const d = `<p>台帳の札 <b>${k} ${esc(m.label)}</b>${k === "🟠" ? "　→ 今動いているセッションが無いので「止まっている」扱い" : ""}</p>`
        + it.body.map(x=>`<p>${esc(x)}</p>`).join("") + (it.src ? `<p class="src">出典：${esc(it.src)}</p>` : "");
      h += card(color, `${it.no}. ${it.title}`, label, extra, d, it.no);
    });
    h += `</div></details>`;
  });
  h += `<details class="wbg" id="a-old"><summary>旧台帳のみ（2026-07・更新停止） <b>${A.old.length}</b>件</summary><div class="g wbginner">`;
  A.old.forEach(o=>{ const m = ALL_META[o.badge] || ALL_META["❓"]; h += card(m.color, o.title, m.label, "", `<p>旧 task-ledger.json 由来。更新は8/7で停止。</p>`); });
  h += `</div></details>`;
  document.getElementById("all").innerHTML = h;
}

/* ───── Macの鮮度（見出し右の小さい「◯分前」だけ。数字の本体はメーターと下のミニ行に統合） ───── */
function renderMachine(m){
  const el = document.getElementById("machineAge");
  if(!m || !m.measuredAt){ el.textContent = ""; return; }
  const mins = Math.max(0, Math.round((Date.now() - new Date(m.measuredAt).getTime())/60000));
  const age = mins < 1 ? "いま" : mins < 60 ? `${mins}分前` : mins < 1440 ? `${Math.floor(mins/60)}時間前` : `${Math.floor(mins/1440)}日前`;
  const stale = mins > 20;
  el.textContent = stale ? `${age}（古い）` : age;
  el.className = stale ? "stale" : "";
}
/* ───── メーター（ゲージ）：数字ではなく感覚で。緑＝余裕／黄＝考える／赤＝止める判断 ─────
   5時間枠・週Fable・週全モデル・マシン負荷の4本。5時間枠だけ「使い切らないと消える」ので
   危険（赤）の意味が逆＝余らせすぎ（もったいない）を黄で警告する。
   Fable/全モデルは曜日ごとの目標曲線（曲線位置に▲マーカー）に対して上振れ／下振れも出す。 */
function meterHTML(title, pct, level, valText, subText, subCls, curveTarget, freshIso){
  const w = pct == null ? 0 : Math.max(2, Math.min(100, pct));
  const mk = curveTarget != null ? `<div class="mk curve" style="left:${Math.max(0,Math.min(100,curveTarget))}%" title="曜日目標${curveTarget}%"></div>` : "";
  const fr = freshIso !== undefined ? freshness(freshIso) : null;
  const frHtml = fr ? `<span class="fresh${fr.stale ? " stale" : ""}">${esc(fr.text)}</span>` : "";
  return `<div class="meter${fr && fr.stale ? " stale" : ""}">
    <div class="mtitle"><b>${esc(title)}</b>${frHtml}<span class="val ${level}">${esc(valText)}</span></div>
    <div class="track"><div class="fill ${level}" style="width:${w}%"></div>${mk}</div>
    ${subText ? `<div class="msub${subCls ? " " + subCls : ""}">${esc(subText)}</div>` : ""}
  </div>`;
}
function curveSub(curve, base){
  if(!curve) return base;
  const arrow = curve.state === "over" ? "▲上振れ" : curve.state === "under" ? "▼下振れ" : "●曲線どおり";
  const tip = curve.state === "over" ? "・絞る" : curve.state === "under" ? "・Fable投入や本数増の余地あり" : "";
  return `${base}｜曲線目標${curve.target}%に対し${arrow}${curve.overPct != null ? curve.overPct + "pt" : ""}${tip}`;
}
function renderMeters(m){
  const el = document.getElementById("meters");
  if(!m){ el.innerHTML = ""; return; }
  const q = m.quota || {};
  const s5 = q.session5h || {};
  const lvlMap = {ok:"green", warn:"yellow", stop:"red"};
  const qFresh = q.updatedAt || m.measuredAt;
  const parts = [];
  if(s5.pct != null){
    const lvl = s5.mottainai ? "yellow" : "green";
    const sub = s5.mottainai
      ? `もったいない：残り${s5.hoursLeft}h・このままだと約${s5.wasteRiskPct}%余る見込み。使えるうちに使う`
      : `残り${s5.hoursLeft}h・${s5.resetAt}にリセット（使い切らないと消える）`;
    parts.push(meterHTML("5時間枠", s5.pct, lvl, `${s5.pct}%`, sub, s5.mottainai ? "mottainai" : "", undefined, qFresh));
  }
  // 2026-09-04 たまごさん「並び方も一緒にして。ややこしいから。Fableと全モデルがテレコになってる」
  //   → Claudeアプリの『使用状況』画面と同じ順に揃える：現在のセッション（5時間枠）→ すべてのモデル → Fableのみ
  if(q.allPct != null){
    const base = `${q.resetAt || "火曜17:59"}まで${q.daysLeft != null ? q.daysLeft + "日" : ""}`;
    parts.push(meterHTML("週枠・すべてのモデル", q.allPct, lvlMap[q.allLevel] || "green", `${q.allPct}%`,
      curveSub(q.allCurve, base), q.allCurve && q.allCurve.state === "over" ? "mottainai" : "", q.allCurve && q.allCurve.target, qFresh));
  }
  if(q.fablePct != null){
    const base = `${q.resetAt || "火曜17:59"}まで${q.daysLeft != null ? q.daysLeft + "日" : ""}`;
    parts.push(meterHTML("週枠・Fableのみ", q.fablePct, lvlMap[q.fableLevel] || "green", `${q.fablePct}%`,
      curveSub(q.fableCurve, base), q.fableCurve && q.fableCurve.state === "over" ? "mottainai" : "", q.fableCurve && q.fableCurve.target, qFresh));
  }
  if(m.load != null){
    const lvl = m.load >= 90 ? "red" : m.load >= 70 ? "yellow" : "green";
    const more = m.sessions != null && m.safeMax != null && m.sessions > m.safeMax
      ? `上限${m.safeMax}本に対し${m.sessions - m.safeMax}本超過（畳む判断が要る）`
      : (m.moreOK > 0 ? `あと${m.moreOK}本OK` : `上限${m.safeMax ?? "?"}本内（これ以上は増やさない）`);
    parts.push(meterHTML("マシン負荷（何%で固まるか）", m.load, lvl, `${m.load}%`, more, "", undefined, m.measuredAt));
  }
  // ディスク・セッション本数・ネットワーク（Wi-Fi品質のみ。有線ハードなし確定＝有線判定・警告は出さない）のミニ行
  const diskWarn = m.diskFreeGB != null && m.diskFreeGB < 20;
  const over = (m.sessions || 0) - (m.safeMax || 0);
  const net = m.network || {};
  let netHtml = "";
  if(net.pingMedianMs != null || net.pingMaxMs != null){
    // バッファブロート対策：平常時の中央値だけでは分からない。跳ねを判定するのは最大値（体感に近い）
    const maxV = net.pingMaxMs;
    const warnCls = maxV != null && maxV >= 400 ? "red" : maxV != null && maxV >= 150 ? "yellow" : "";
    const jump = warnCls ? "⚠️混んだ時に跳ねています（同時に大きな通信をしているアプリがあるかもしれません）" : "";
    netHtml = `<span class="${warnCls}">📶Wi-Fi${net.pingMedianMs != null ? `・中央値${net.pingMedianMs}ms` : ""}${maxV != null ? `・最大${maxV}ms` : ""}${jump ? "　" + jump : ""}</span>`;
  }
  document.getElementById("healthSum").innerHTML =
    `<span class="${diskWarn ? "red" : ""}">ディスク空き<b>${m.diskFreeGB ?? "—"}GB</b></span>`
    + `<span class="${over > 0 ? "red" : ""}">セッション<b>${m.sessions ?? "—"}本／上限${m.safeMax ?? "—"}${over > 0 ? `・${over}本超過` : m.moreOK != null ? `・あと${m.moreOK}本` : ""}</b></span>`
    + netHtml;
  el.innerHTML = parts.length ? parts.join("") : "";
}

/* ───── 弱点の自動集計（history.jsonl） ───── */
function renderStats(text){
  const el = document.getElementById("stats");
  const rows = (text || "").split("\n").filter(Boolean).map(l => { try { return JSON.parse(l); } catch(e){ return null; } }).filter(Boolean);
  if(!rows.length){ el.textContent = "まだ航跡が溜まっていない（5分おきに積み始めたところ）。"; return; }
  const S = {};
  rows.forEach(r=>{
    const key = r.cli || ("pid" + r.pid);
    const s = S[key] ||= {title:r.title, start:r.start, first:r.t, last:r.t, stops:0, resumes:0, prev:null};
    if(r.t < s.first) s.first = r.t; if(r.t > s.last) s.last = r.t;
    const stopped = r.kind === "asked" || r.kind === "stuck_tool";
    if(stopped && !s.prev) s.stops++;
    if(r.resumed) s.resumes++;
    s.prev = stopped; s.lastKind = r.kind;
  });
  const list = Object.values(S), n = list.length;
  const finished = list.filter(s => s.lastKind === "idle_done");
  const selfRun = finished.filter(s => s.stops === 0 && s.resumes === 0);
  const stops = list.reduce((a,s)=>a+s.stops,0), resumes = list.reduce((a,s)=>a+s.resumes,0);
  const stuckNow = list.filter(s => s.lastKind === "asked" || s.lastKind === "stuck_tool").length;
  const durs = list.map(s => s.start ? (new Date(s.last) - new Date(s.start))/3600000 : null).filter(x => x != null);
  const avgH = durs.length ? durs.reduce((a,b)=>a+b,0)/durs.length : null;
  const pct = (a,b) => b ? Math.round(a*100/b) + "%" : "—";
  const t0 = rows.reduce((a,r)=>r.t<a?r.t:a, rows[0].t), t1 = rows.reduce((a,r)=>r.t>a?r.t:a, rows[0].t);
  document.getElementById("statMeta").textContent = `${formatStamp(t0)}〜${formatStamp(t1)}`;
  const au = window.__machine && window.__machine.autonomy;
  // 母数（終了報告済み）が小さいと%だけでは「空セッションを数えた100%」に見えるので、常に分数を主役にする
  const auHtml = au ? `<div class="sum"><span title="終了報告済みのうち人に押されず完了した件数">自走完了（工場の集計）<b>${au.doneWithoutHumanPush ?? 0}／${au.done ?? 0}件</b></span></div>` : "";
  el.innerHTML = auHtml + `<div class="sum">
      <span>見たセッション<b>${n}</b></span><span>止まらず走り切った<b>${selfRun.length}／${finished.length}（${pct(selfRun.length, finished.length)}）</b></span>
      <span>止まった回数<b>${stops}</b></span><span>起こされた回数<b>${resumes}</b></span><span>いま止まっている<b>${stuckNow}</b></span>
      <span>平均の長さ<b>${avgH != null ? avgH.toFixed(1) + "時間" : "—"}</b></span></div>
    <div class="note">「止まらず走り切った」が低いほど、人や見張り番が起こさないと終わらない運用。止まった回数が多い題名を直すのが近道。</div>
    ${list.filter(s=>s.stops>0).sort((a,b)=>b.stops-a.stops).slice(0,5).map(s=>`<div class="row">${esc(s.title||"（不明）")}<div class="meta">止まり${s.stops}回・起こされ${s.resumes}回</div></div>`).join("")}`;
}
fetch("status/history.jsonl?t=" + Date.now(), {cache:"no-store"})
  .then(r => r.ok ? r.text() : "").then(renderStats).catch(()=>renderStats(""));
