<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>進捗表</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="進捗表">
<meta name="theme-color" content="#1a2030">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    --bg:#1a2030;        /* 夜の藍 */
    --card:#212839;
    --line:#2f3749;
    --ink:#e9e2d3;       /* 生成り */
    --sub:#9aa1ad;
    --dim:#6b7280;
    --aka:#c4483a;       /* 朱。差し色はこれ1点 */
    --aka-bg:#3a2320;
    --kinari:#d6cdba;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{
    margin:0;
    padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 32px) calc(env(safe-area-inset-left) + 16px);
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:16px; line-height:1.55;
    -webkit-text-size-adjust:100%;
    max-width:640px; margin-left:auto; margin-right:auto;
    overflow-x:hidden;
  }
  a{color:inherit;}
  h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    font-weight:400; font-size:1.35rem; letter-spacing:0.12em;
    margin:8px 0 2px;
  }
  .updated{color:var(--sub); font-size:0.8rem; margin-bottom:22px;}

  /* Macの状態（1行） */
  .machine{
    display:flex; align-items:center; flex-wrap:wrap; gap:0 6px;
    margin:-8px 0 22px; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:0.85rem; color:var(--kinari); font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .machine .sep{color:var(--dim);}
  .machine .age{color:var(--sub);}
  .machine .age.stale{color:var(--aka);}
  .machine.warn{border-color:var(--aka); color:var(--ink);}
  .machine.warn .load{color:var(--aka);}
  .machine .dim{color:var(--sub);}
  .machine .stalled{flex-basis:100%; margin-top:4px; color:var(--aka); font-size:0.8rem;}

  .label{
    color:var(--sub); font-size:0.72rem; letter-spacing:0.14em;
    margin:26px 0 10px; text-transform:uppercase;
  }
  .label:first-of-type{margin-top:0;}
  .label small{letter-spacing:0; margin-left:8px; font-size:0.72rem; color:var(--dim);}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 15px; margin-bottom:10px;
  }

  /* 今動いているもの */
  .run .head{display:flex; gap:10px; align-items:baseline;}
  .run .lane{color:var(--dim); font-size:0.75rem; font-variant-numeric:tabular-nums; flex:none;}
  .run .title{font-weight:600; line-height:1.45;}
  .run .who{color:var(--sub); font-size:0.82rem; margin-top:6px;}
  .run .who b{font-weight:500; color:var(--kinari);}
  .run .progress{color:var(--sub); font-size:0.85rem; margin-top:4px;}

  /* リンク（タップできる。44px以上） */
  .links{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .links a{
    display:inline-flex; align-items:center; min-height:44px; padding:0 14px;
    border:1px solid var(--line); border-radius:10px; text-decoration:none;
    color:var(--kinari); font-size:0.88rem; background:rgba(255,255,255,0.02);
  }
  .links a::after{content:"→"; margin-left:8px; color:var(--sub);}
  .links a:active{background:rgba(255,255,255,0.06);}

  /* 言ったこと */
  .saidbox{padding:4px 15px;}
  .said{padding:11px 0; border-bottom:1px solid var(--line);}
  .said:last-child{border-bottom:none;}
  .said .when{color:var(--sub); font-size:0.75rem; font-variant-numeric:tabular-nums; margin-bottom:2px;}
  .said .text{font-size:0.95rem; line-height:1.55;}
  .saidbox details summary{
    list-style:none; cursor:pointer; min-height:44px; display:flex; align-items:center;
    color:var(--kinari); font-size:0.88rem;
  }
  .saidbox details summary::-webkit-details-marker{display:none;}
  .saidbox details summary::after{content:"↓"; margin-left:8px; color:var(--sub);}
  .saidbox details[open] summary::after{content:"↑";}

  /* TODAY */
  .today .block{margin-bottom:14px;}
  .today .block:last-child{margin-bottom:0;}
  .today .blabel{color:var(--sub); font-size:0.72rem; letter-spacing:0.08em; margin-bottom:5px;}
  .today .northstar{font-size:0.95rem; line-height:1.6;}
  .today ul{margin:0; padding-left:1.15em;}
  .today li{margin-bottom:5px; line-height:1.5;}
  .today .dontdo li{color:var(--kinari);}
  .today .dontdo li::marker{color:var(--aka);}
  .today .kpi{color:var(--sub); font-size:0.85rem;}

  /* 集計（タップで該当セクションへ） */
  .summary{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 6px;}
  .summary a{
    display:inline-flex; align-items:center; min-height:44px; padding:0 12px;
    border-radius:10px; border:1px solid var(--line); text-decoration:none;
    font-size:0.85rem; color:var(--ink); background:var(--card);
    font-variant-numeric:tabular-nums;
  }
  .summary a b{font-weight:600; margin-left:6px;}

  /* 依頼一覧 */
  .section-label{color:var(--sub); font-size:0.78rem; letter-spacing:0.06em; margin:22px 0 8px; scroll-margin-top:12px;}
  .row{
    background:var(--card); border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:12px; padding:13px 15px; margin-bottom:9px;
  }
  .row.red, .row.hold{border-left-color:var(--aka);}
  .row.wip{border-left-color:var(--kinari);}
  .row.done, .row.cannot{opacity:0.55;}
  .row .content{font-weight:600; line-height:1.45;}
  .row .meta{color:var(--sub); font-size:0.8rem; display:flex; gap:12px; flex-wrap:wrap; margin-top:6px;}
  .row .meta b{color:var(--kinari); font-weight:500;}
  .row .elapsed{font-variant-numeric:tabular-nums;}
  .row .note{font-size:0.86rem; color:var(--sub); margin-top:6px; line-height:1.5;}
  .row.hold .note, .row.red .note{color:var(--kinari);}
  .row .evi{font-size:0.8rem; color:var(--sub); margin-top:6px; word-break:break-all;}

  /* 未処理の依頼・全件 */
  .row .no{display:inline-block; min-width:1.6em; color:var(--sub); font-weight:500; font-variant-numeric:tabular-nums; margin-right:6px;}
  .row.hold .content .no{color:var(--aka);}
  .row .times{display:inline-block; margin-left:8px; padding:1px 8px; border:1px solid var(--line); border-radius:999px; font-size:0.75rem; font-weight:500; color:var(--sub); white-space:nowrap; vertical-align:2px;}
  details.more summary{list-style:none; cursor:pointer; min-height:44px; display:flex; align-items:center; color:var(--kinari); font-size:0.85rem;}
  details.more summary::-webkit-details-marker{display:none;}
  details.more summary::after{content:"↓"; margin-left:8px; color:var(--sub);}
  details.more[open] summary::after{content:"↑";}
  .oldlist{padding:6px 15px;}
  .old{padding:9px 0; border-bottom:1px solid var(--line); font-size:0.9rem; line-height:1.5;}
  .old:last-child{border-bottom:none;}

  footer{color:var(--dim); font-size:0.75rem; margin-top:36px; line-height:1.6;}
</style>
</head>
<body>

<h1>進捗表</h1>
<div class="updated" id="updated">最終更新：読み込み中…</div>
<div class="machine" id="machine" hidden></div>

<div class="label">いま動いているもの <small id="runUpdated"></small></div>
<div id="running"></div>

<div class="label">言ったこと（直近・埋もれ防止） <small id="saidCount"></small></div>
<div id="said"></div>

<div class="label">未処理の依頼・全件 <small id="allMeta"></small></div>
<div class="summary" id="allSummary"></div>
<div id="all"></div>

<div class="label">Today</div>
<div class="card today" id="today"></div>

<div class="label">依頼一覧</div>
<div class="summary" id="summary"></div>
<div id="list"></div>

<footer>
  この画面はスマホから見るための写し。正本は Obsidian の <code>AI出力/_ルール/進捗表.html</code>。<br>
  「いま動いているもの」は手で更新している（自動連携ではない）。
</footer>

<script>
// データは毎回サーバーから取り直す（スマホのキャッシュで古い一覧が出ないように）
(function(){
  const t = Date.now(), files = ["data.js","said.js","requests225.js"]; let n = 0;
  files.forEach(f => { const s = document.createElement("script"); s.src = f + "?t=" + t; s.async = false;
    s.onload = s.onerror = () => { if(++n === files.length && window.__dataReady) window.__dataReady(); };
    document.head.appendChild(s); });
})();
</script>
<script>
let D = null;

const STATUS_META = {
  hold:   {mark:"⏸",  label:"判断待ち（たまごさん）", order:0},
  red:    {mark:"🔴", label:"止まっている", order:1},
  wip:    {mark:"🟡", label:"作業中", order:2},
  done:   {mark:"🟢", label:"完了", order:3},
  cannot: {mark:"❌", label:"できない", order:4},
};

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function formatElapsed(orderedAt){
  const ms = Date.now() - new Date(orderedAt).getTime();
  if(ms < 0) return "未来?";
  const totalMin = Math.floor(ms/60000);
  const days = Math.floor(totalMin/1440);
  const hours = Math.floor((totalMin%1440)/60);
  const mins = totalMin%60;
  if(days > 0) return `${days}日${hours}時間経過`;
  if(hours > 0) return `${hours}時間${mins}分経過`;
  return `${mins}分経過`;
}
function formatStamp(iso, withTime=true){
  const d = new Date(iso);
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0");
  const mi = String(d.getMinutes()).padStart(2,"0");
  return withTime ? `${mm}-${dd} ${hh}:${mi}` : `${mm}-${dd}`;
}
function linksHtml(links){
  if(!links || !links.length) return "";
  return `<div class="links">` + links.map(l=>`<a href="${esc(l.url)}">${esc(l.label)}</a>`).join("") + `</div>`;
}

function renderRunning(){
  document.getElementById("runUpdated").textContent = `手更新 ${formatStamp(D.runningUpdatedAt)}`;
  const box = document.getElementById("running");
  if(!D.running.length){ box.innerHTML = `<div class="card" style="color:var(--sub)">いまは何も走っていない</div>`; return; }
  box.innerHTML = D.running.map(r=>`
    <div class="card run">
      <div class="head"><span class="lane">レーン${r.lane}</span><span class="title">${esc(r.title)}</span></div>
      <div class="who">担当 <b>${esc(r.who)}</b>　状態 <b>${esc(r.state)}</b></div>
      ${r.progress ? `<div class="progress">${esc(r.progress)}</div>` : ""}
      ${linksHtml(r.links)}
    </div>`).join("");
}

function renderSaid(){
  const S = window.SHINCHOKU_SAID || [];
  const box = document.getElementById("said");
  const SHOW = 8;
  document.getElementById("saidCount").textContent = `${S.length}件`;
  const item = s => `<div class="said"><div class="when">${esc(s.when)}</div><div class="text">${esc(s.said)}</div></div>`;
  box.innerHTML = `<div class="card saidbox">` + S.slice(0,SHOW).map(item).join("")
    + (S.length > SHOW ? `<details><summary>もっと見る（残り${S.length-SHOW}件）</summary>${S.slice(SHOW).map(item).join("")}</details>` : "")
    + `</div>`;
}

const ALL_META = {
  "⏸":{label:"判断待ち（たまごさん）", cls:"hold", order:0},
  "🔴":{label:"未着手", cls:"red", order:1},
  "🟠":{label:"着手中", cls:"wip", order:2},
  "🟡":{label:"実装済（本番未確認）", cls:"wip", order:3},
  "❓":{label:"完了か不明", cls:"cannot", order:4},
  "🔵":{label:"別AIが検証中", cls:"wip", order:5},
  "✅":{label:"完了", cls:"done", order:6},
};
function renderAll(){
  const A = window.SHINCHOKU_ALL; if(!A) return;
  document.getElementById("allMeta").textContent = `${A.items.length + A.old.length}件・${A.generatedAt} 掘り出し`;
  const groups = {};
  A.items.forEach(it=>{ (groups[it.badge] ||= []).push(it); });
  const keys = Object.keys(ALL_META).sort((a,b)=>ALL_META[a].order-ALL_META[b].order).filter(k=>groups[k]);
  document.getElementById("allSummary").innerHTML = keys.map(k=>`<a href="#a-${ALL_META[k].cls}-${ALL_META[k].order}">${k} ${ALL_META[k].label}<b>${groups[k].length}</b></a>`).join("")
    + `<a href="#a-old">旧台帳のみ<b>${A.old.length}</b></a>`;
  const box = document.getElementById("all"); let h = "";
  keys.forEach(k=>{
    const m = ALL_META[k];
    h += `<div class="section-label" id="a-${m.cls}-${m.order}">${k} ${m.label}（${groups[k].length}）</div>`;
    groups[k].forEach(it=>{
      const first = it.body[0] || "";
      const rest = it.body.slice(1);
      h += `<div class="row ${m.cls}">
        <div class="content"><span class="no">${it.no}</span>${esc(it.title)}${it.times ? `<span class="times">${esc(it.times)}</span>` : ""}</div>
        <div class="note">${esc(first)}</div>
        ${rest.length || it.src ? `<details class="more"><summary>くわしく</summary>${rest.map(x=>`<div class="note">${esc(x)}</div>`).join("")}${it.src ? `<div class="evi">出典：${esc(it.src)}</div>` : ""}</details>` : ""}
      </div>`;
    });
  });
  h += `<div class="section-label" id="a-old">旧台帳のみに残る案件（2026-07・更新停止）（${A.old.length}）</div><div class="card oldlist">`
     + A.old.map(o=>`<div class="old">${o.badge} ${esc(o.title)}</div>`).join("") + `</div>`;
  box.innerHTML = h;
}

function renderToday(){
  const t = D.today;
  document.getElementById("today").innerHTML = `
    <div class="block"><div class="blabel">北極星</div><div class="northstar">${esc(t.northstar)}</div></div>
    <div class="block"><div class="blabel">今日の最重要3件（たまごさんの判断が要るもの）</div>
      <ul>${t.top3.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="block dontdo"><div class="blabel">今日やらないこと</div>
      <ul>${t.dontdo.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="block"><div class="blabel">Taste Gate（案の1タップ選択）</div>
      ${linksHtml([{label:"Taste_Gate.md を開く", url:t.tasteGate}])}</div>
    <div class="block"><div class="blabel">今月のKPI</div><div class="kpi">${esc(t.kpi)}</div></div>`;
}

function renderList(){
  const sorted = [...D.requests].sort((a,b)=>{
    const oa = STATUS_META[a.status].order, ob = STATUS_META[b.status].order;
    if(oa !== ob) return oa - ob;
    return new Date(b.orderedAt) - new Date(a.orderedAt);
  });
  const counts = {}; for(const k in STATUS_META) counts[k]=0;
  sorted.forEach(r=>counts[r.status]++);

  document.getElementById("summary").innerHTML = Object.keys(STATUS_META).map(k=>{
    const m = STATUS_META[k];
    return `<a href="#s-${k}">${m.mark} ${m.label}<b>${counts[k]}</b></a>`;
  }).join("");

  const list = document.getElementById("list");
  list.innerHTML = "";
  let lastOrder = -1;
  sorted.forEach(r=>{
    const m = STATUS_META[r.status];
    if(m.order !== lastOrder){
      const label = document.createElement("div");
      label.className = "section-label"; label.id = `s-${r.status}`;
      label.textContent = `${m.mark} ${m.label}`;
      list.appendChild(label); lastOrder = m.order;
    }
    const row = document.createElement("div");
    row.className = `row ${r.status}`;
    row.innerHTML = `
      <div class="content">${esc(r.content)}</div>
      <div class="meta">
        <span>依頼 <b>${formatStamp(r.orderedAt)}</b></span>
        <span class="elapsed">${formatElapsed(r.orderedAt)}</span>
        <span>担当 <b>${esc(r.owner||"-")}</b></span>
      </div>
      ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
      ${r.evidence ? `<div class="evi">証拠：${esc(r.evidence)}</div>` : ""}
      ${linksHtml(r.links)}`;
    list.appendChild(row);
  });
}

window.__dataReady = function(){
  D = window.SHINCHOKU;
  if(!D){ document.getElementById("updated").textContent = "データを読み込めませんでした。開き直してください。"; return; }
  document.getElementById("updated").textContent = `最終更新：${formatStamp(D.generatedAt)}（依頼一覧の正本時刻）`;
  renderRunning(); renderSaid(); renderAll(); renderToday(); renderList();
};
if(window.SHINCHOKU && window.SHINCHOKU_ALL) window.__dataReady();

// Macの状態（status/machine.json を読む。5分おきに書き出される）
function renderMachine(m){
  const el = document.getElementById("machine");
  if(!m || !m.measuredAt){ el.hidden = true; return; }
  const mins = Math.max(0, Math.round((Date.now() - new Date(m.measuredAt).getTime())/60000));
  const age = mins < 1 ? "いま" : mins < 60 ? `${mins}分前` : mins < 1440 ? `${Math.floor(mins/60)}時間前` : `${Math.floor(mins/1440)}日前`;
  const stale = mins > 20;
  const warn = (m.load != null && m.load >= 80) || (m.diskFreeGB != null && m.diskFreeGB < 10)
    || (m.stalled != null && m.stalled > 0) || (m.safeMax != null && m.sessions > m.safeMax);
  const v = (x, unit) => x == null ? "測定不可" : `${x}${unit}`;
  el.className = "machine" + (warn ? " warn" : "");
  // 2026-09-02 止まらない工場：作業中／止まり本数と安全上限（factory_status.py が出す）。旧形式のJSONでも動く
  const sess = m.working != null
    ? `セッション${v(m.sessions,"本")}<span class="dim">（作業中${m.working}・止まり${m.stalled ?? 0}）</span>`
    : `セッション${v(m.sessions,"本")}`;
  const cap = m.safeMax != null
    ? (m.sessions > m.safeMax ? `<span class="load">上限${m.safeMax}本・${m.sessions - m.safeMax}本超過</span>`
       : m.moreOK > 0 ? `上限${m.safeMax}本・あと${m.moreOK}本OK` : `<span class="load">上限${m.safeMax}本・増やすな</span>`)
    : null;
  const stalledNames = (m.stalledList || []).slice(0,3).map(s => `${s.kind === "asked" ? "質問で停止" : "承認待ち"}：${s.title}（${Math.round(s.idleMin||0)}分）`).join(" ／ ");
  el.innerHTML = `<span class="load">負荷 ${v(m.load,"%")}</span><span class="sep">｜</span>`
    + `<span>${sess}</span><span class="sep">｜</span>`
    + (cap ? `<span>${cap}</span><span class="sep">｜</span>` : "")
    + `<span>空き${v(m.diskFreeGB,"GB")}</span><span class="sep">｜</span>`
    + `<span class="age${stale ? " stale" : ""}">${age}${stale ? "（古い）" : ""}</span>`
    + (stalledNames ? `<div class="stalled">⚠ ${stalledNames}</div>` : "");
  el.hidden = false;
}
fetch("status/machine.json?t=" + Date.now(), {cache:"no-store"})
  .then(r => r.ok ? r.json() : null).then(renderMachine).catch(()=>{});
</script>
</body>
</html>
