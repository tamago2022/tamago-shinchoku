name: GitHub Pages に公開
#
# 2026-09-19（963番）配信の道を、作業の道から外した。
#
# それまで：main に push があるたび、ここが **リポジトリ丸ごと(681MB)** を Pages の成果物として
#   上げ直していた。main には9人の書き手と17個のworktreeが居るうえ、機械（5分おきの巡回）が
#   status/public/ の写しを1日73回 commit していたので、**1日274回この重い便が走っていた**。
#   その裏で git は232回詰まっていた（「向こうが先で合流できない」64回ほか）。
#
# いま：配信専用の枝 gh-pages を1本立て、**書き手はMacの tools/pages_publish.sh ただ1本**にした。
#   その枝は履歴を常に1コミットに固定して force push する＝
#   **書き手が1人・履歴1コミット・毎回force なので、非fast-forwardが原理的に起きない。**
#   main は人間の作業だけの道に戻り、機械は main に一切書かない。
#   （Homebrewが5分おきのgit配信をJSONへ、CocoaPodsがCDNへ、cargoがsparse indexへ移したのと同じ一手）
#
# 配信される住所は1文字も変わらない： https://tamago2022.github.io/tamago-shinchoku/
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # 2026-10-04（34381番の作業中に発見）：グループ名 "pages" のまま25時間以上、
  # 本番(Pages)が1件も更新されていなかった。原因はrun id 37022041921が
  # 2026-10-02T14:45:01Zから"queued"のまま止まり（in_progressにもcompletedにもならない
  # ゾンビ実行）、cancel-in-progress:falseの直列キューの先頭を永久に塞いでいたこと
  # （実測：Actions API — in_progress 0件・queued 1件がこのidのみ）。
  # 直し方：グループ名を日付で変え、新しい待い行列を作る。古いゾンビは "pages" グループに
  # 置いたまま無害に残し、以後のpushは新グループで走らせる（GitHub側にキャンセル権限が無い
  # ため、キャンセルではなく隔離で塞ぎを外した）。再発したら日付をまた進める。
  # 2026-10-06（31756番）：再発。run id 37364835192 が2026-10-05T19:39:40Zから
  # "queued"のまま9分以上止まった（in_progress 0件・queued 2件＝これと古い37022041921だけ）。
  # 同じ直し方（グループ名を進める）で隔離する。
  group: pages-2026-10-06
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
