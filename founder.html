<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>結果台帳</title>
<style>:root{--ink:#1c1a17;--sub:#6d675f;--line:#ddd7cd;--paper:#f7f4ee;--card:#fffdf9;--ok:#2f6b45;--ng:#9b3d2d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 56px}header{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}h1{font-size:22px;margin:0}#updated,.small,.k{color:var(--sub)}#updated,.small{font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.top{display:flex;justify-content:space-between;gap:10px}.title{font-size:18px;font-weight:700}.badge{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap}.done{color:var(--ok)}.todo{color:var(--ng)}.meta{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;margin-top:12px;font-size:14px}.summary{margin-top:12px;padding-top:10px;border-top:1px solid #eee7dc}.final{margin-top:10px}.final a{color:inherit;font-weight:700}.small{margin-top:8px}</style></head>
<body><main><header><h1>結果台帳</h1><span id="updated"></span></header><div id="list"></div></main>
<script>fetch('./status/founder_ledger.json?'+Date.now()).then(r=>r.json()).then(d=>{updated.textContent='更新 '+(d.updatedAt||'');list.innerHTML=(d.items||[]).map(x=>{let done=x.status==='完成',fin=x.finishedAt||'まだ',u=x.finalUrl?'<div class="final"><a href="'+x.finalUrl+'" target="_blank">完成版を開く</a></div>':'';return '<section class="card"><div class="top"><div class="title">'+x.title+'</div><span class="badge '+(done?'done':'todo')+'">'+x.status+'</span></div><div class="meta"><div class="k">依頼日</div><div>'+x.requestedAt+'</div><div class="k">完成日</div><div>'+fin+'</div><div class="k">鬼監督</div><div>'+x.qa+'</div></div><div class="summary">'+(x.summary||'')+'</div>'+u+'<div class="small">差し戻し '+(x.reworkCount||0)+'回（途中ログは非表示）</div></section>'}).join('')}).catch(e=>list.textContent='読み込み失敗: '+e.message)</script></body></html>
