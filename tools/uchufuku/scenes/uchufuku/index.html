    <script type="importmap">

    <script type="module">

      const craters = [];
      {
        const r = rng(77);

      let EAZ = 0; // set below (earth azimuth), used to keep that horizon low

      });
      const poolTex = canvasTex(128, 128, (g, w, h) => { const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.25, "rgba(255,255,255,0.45)"); gr.addColorStop(0.6, "rgba(255,255,255,0.1)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, w, h); });

      {

        const zc = SEND * 0.5, zh = SEND * 0.5 + 35;
        let p = 0, q = 0;
        for (let j = 0; j <= NZ; j++) for (let i = 0; i <= NX; i++) {

      // rocks

        const r = rng(21), d = new THREE.Object3D();

      }

      {
        const r = rng(8), N = 2600, pos = [], col = [], siz = [];
        for (let i = 0; i < N; i++) {
          const u = r() * 2 - 1, a = r() * 6.2832, q = Math.sqrt(1 - u * u);

          fragmentShader: `varying vec3 vC; uniform float uDim; void main(){ vec2 p=gl_PointCoord*2.-1.; float a=1.-smoothstep(.2,1.,length(p)); gl_FragColor=vec4(vC*a*uDim,1.); }` });
        const st = new THREE.Points(g, m); st.frustumCulled = false; st.renderOrder = -10; scene.add(st); window._stars = m; window._starsObj = st;

      const earthMat = new THREE.ShaderMaterial({
