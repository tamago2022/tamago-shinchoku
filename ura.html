<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>裏側（機械の点検用）</title>
<!--
  1173番（2026-09-27）作成。
  たまごさん「『工場の体温』のカードはもういらない。心臓がどうだとかいうのもいらない。もっとシンプルにして」
  → 進捗表（index.html）から外した中身を、捨てずにこの1枚へ移した。
    ★トップからこの紙へのリンクは置かない（たまごさんは進捗表しか見ない）。
    ★ここは機械の点検用。色や文字の大きさの制約はトップと同じにしてある（黄色は使わない）。
  移してきたもの：工場の体温／成果の鮮度／タブの閉め残し／Braveに入った回数／
                  ループの計器盤／宿題台帳の1行／お金・フォルダ・掃除／鍵・つながり／
                  外部AIの検品／受け取り待ち／公式のアップデート
-->
<style>
:root{ --ink:#1c1a17; --sub:#6d675f; --line:#ddd7cd; --paper:#f7f4ee; --card:#fffdf9; --red:#a33b2a; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; padding:14px 14px 56px; background:var(--paper); color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:560px; margin:0 auto}
h1{font-size:19px; margin:0 0 4px; font-weight:600}
.lead{font-size:14px; color:var(--sub); margin:0 0 14px}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px}
.card > h2{font-size:15px; margin:0 0 10px; color:var(--sub); font-weight:600; letter-spacing:.04em}
.g3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
.g3 .wl{font-size:13px; color:var(--sub); font-weight:600}
.g3 .wv{font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2}
.nums{font-size:14px; line-height:1.7; color:var(--sub)}
ul{list-style:none; margin:0; padding:0}
li{padding:8px 0; border-top:1px solid #eee7dc; font-size:15px}
li:first-child{border-top:0}
.red{color:var(--red)}
a{color:#2a5b8f}
</style>
</head>
<body>
<div class="wrap">
<h1>裏側（機械の点検用）</h1>
<p class="lead">進捗表から外した数字はここにある。捨てていない。</p>

<section class="card">
  <h2>工場の体温</h2>
  <div class="g3">
    <div><div class="wl">心臓</div><div class="wv" id="tHeart">…</div></div>
    <div><div class="wl">最後の発車</div><div class="wv" id="tLaunch">…</div></div>
    <div><div class="wl">今の負荷</div><div class="wv" id="tLoad">…</div></div>
  </div>
  <div class="nums" id="taionMeta" style="margin-top:10px"></div>
  <div class="nums" id="diskLine" style="margin-top:8px">残り容量　読み込み中…</div>
</section>

<section class="card">
  <h2>成果の鮮度（最後に本物が出てから）</h2>
  <div class="nums" id="fresh">…</div>
</section>

<section class="card">
  <h2>タブの閉め残し ／ Braveに入った回数</h2>
  <div class="nums" id="tabsLine">…</div>
  <div class="nums" id="braveLine" style="margin-top:8px">…</div>
</section>

<section class="card" id="loopCard" style="display:none">
  <h2>ループの計器盤</h2>
  <div id="loopAtama" style="font-size:19px;font-weight:700;line-height:1.4">…</div>
  <div class="nums" id="loopNao" style="margin-top:6px"></div>
  <div id="loopGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"></div>
  <div class="nums" id="loopStamp" style="margin-top:10px"></div>
</section>

<section class="card">
  <h2>宿題（言われたのに返っていないもの）</h2>
  <div class="nums"><a href="share/check/1138-shukudai.html">宿題台帳をひらく</a>　<span id="shukudaiSum">…</span></div>
</section>

<section class="card">
  <h2>お金・フォルダ・掃除</h2>
  <ul id="cash"><li class="nums">…</li></ul>
</section>

<section class="card">
  <h2>鍵・つながり／走った本数</h2>
  <div class="nums" id="kagi">…</div>
</section>

<section class="card">
  <h2>外部AIの検品</h2>
  <ul id="kenpin"><li class="nums">…</li></ul>
</section>

<section class="card">
  <h2>受け取り待ち（押すだけ）</h2>
  <ul id="uketori"><li class="nums">…</li></ul>
</section>

<section class="card">
  <h2>公式のアップデート</h2>
  <ul id="koushiki"><li class="nums">…</li></ul>
</section>

</div>
<script>
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function yen(n){ return n == null ? "未取得" : Math.round(n).toLocaleString() + "円"; }
function getJson(url, ms){
  return new Promise(function(resolve, reject){
    var done = false;
    var t = setTimeout(function(){ if(!done){ done = true; reject(new Error("timeout")); } }, ms || 8000);
    fetch(url, {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ if(!done){ done = true; clearTimeout(t); resolve(j); } })
      .catch(function(e){ if(!done){ done = true; clearTimeout(t); reject(e); } });
  });
}
function put(id, txt){ var e = $(id); if(e) e.textContent = txt; }

/* 工場の体温（元 index.html の1163番）。出どころ：status/public/taion.json */
getJson("status/public/taion.json").catch(function(){ return null; }).then(function(t){
  if(!t){
    put("tHeart","取れず"); put("tLaunch","取れず"); put("tLoad","取れず");
    put("taionMeta","taion.json が取れません（5分おきに体温を書く係が止まっています）");
    return;
  }
  var meta = [], furui = null;
  try {
    var age = (Date.now() - new Date(String(t.at).replace("+0900","+09:00")).getTime())/60000;
    if(age > 3) furui = age;
  } catch(e){}
  if(furui !== null){
    var wa = furui.toFixed(0) + "分";
    var ikiteta = (t["心臓"] === "生");
    put("tHeart", ikiteta ? "公開が"+wa+"遅れ" : "紙が"+wa+"古い");
    put("tLaunch", "—"); put("tLoad", "—");
    put("taionMeta", ikiteta
      ? ("公開便（5分おきにGitHubへ上げる係）が " + wa + " 止まっています。心臓そのものは "
         + String(t.at).slice(11,16) + " の時点で動いていました。よくある原因＝別のセッションが .git のロックを置いたまま終わった（5分で自動的に片付きます）")
      : ("体温が " + wa + " 前から更新されていません（" + String(t.at).slice(11,16) + " の時点で心臓が止まっていた）"));
    return;
  }
  put("tHeart", t["心臓"] || "取れず");
  if(t["心臓のだまり秒"] != null) meta.push("だまり "+t["心臓のだまり秒"]+"秒");
  put("tLaunch", t["最後の発車"]
    ? (String(t["最後の発車"]).slice(11,16)
       + (t["最後の発車から分"] != null ? "（"+Math.round(t["最後の発車から分"])+"分前）" : ""))
    : "取れず");
  put("tLoad", typeof t["負荷Pct"] === "number" ? t["負荷Pct"]+"%" : "取れず");
  if(t["同時上限"] != null) meta.push("同時上限 "+t["同時上限"]+"本");
  if(t["スワップ残りGB"] != null) meta.push("スワップ残り "+t["スワップ残りGB"]+"GB");
  if(t["負荷1行"]) meta.push(t["負荷1行"]);
  meta.push("測った時刻 "+String(t.at).slice(11,19));
  put("taionMeta", meta.join(" ｜ "));
});

/* 残り容量と掃除の記録（1172番の詳しい方） */
Promise.all([
  getJson("status/public/machine.json").catch(function(){ return null; }),
  getJson("status/public/mac_souji.json").catch(function(){ return null; })
]).then(function(a){
  var mac = a[0], souji = a[1];
  var free = (mac && typeof mac.diskFreeGB === "number") ? mac.diskFreeGB : null;
  var s = "残り容量　" + (free == null ? "取れていません" : Math.round(free) + "GB");
  if(souji){
    if(souji.lastFreedHuman) s += " ｜ 前回の掃除で " + souji.lastFreedHuman;
    if(souji.totalFreedHuman) s += "（累計 " + souji.totalFreedHuman + "）";
    if(souji.lastRunAt) s += " ｜ 最後に掃いた " + String(souji.lastRunAt).slice(5,16).replace("T"," ");
  } else { s += " ｜ 掃除の記録が取れていません"; }
  put("diskLine", s);
});

/* 成果の鮮度（1143番）。top_status.json の freshness */
getJson("status/public/top_status.json").then(function(d){
  var F = d.freshness;
  if(!F){ put("fresh","記録がありません"); return; }
  var pipes = F.pipes || {};
  var line = Object.keys(pipes).map(function(k){
    var p = pipes[k];
    return esc(p.na) + " " + (p.ageH == null ? "測れない" : p.ageH + "h")
         + "/" + (p.shikiiH == null ? "—" : p.shikiiH + "h");
  }).join("　｜　");
  $("fresh").textContent = (F.ichigyou || "") + (line ? "　" + line : "");
}).catch(function(){ put("fresh","top_status.json が取れません"); });

/* タブの閉め残し（1161番） */
getJson("status/public/tabs.json").then(function(d){
  var nokori = (d.outstanding == null) ? null : Number(d.outstanding);
  $("tabsLine").textContent = "タブの閉め残し　"
    + (nokori == null ? "数えられていない" : nokori + "枚")
    + "（直前のセッション：開いた " + (d.sessionOpened==null?"?":d.sessionOpened)
    + "枚 → 閉じた " + (d.sessionClosed==null?"?":d.sessionClosed) + "枚）"
    + "　※ブラウザ全体の枚数はmacOSの許可ダイアログが要るため数えない（0枚と書くと嘘になる）";
}).catch(function(){ put("tabsLine","タブの記録（tabs.json）がまだ1度も書かれていません"); });

/* Braveに入った回数（1166番） */
getJson("status/public/browser.json").then(function(d){
  var used = Number(d.braveUsed || 0);
  $("braveLine").textContent = "Braveで操作した回数　" + used + "回"
    + "（関所が弾いた：" + Number(d.braveBlocked||0) + "回／Chromeを名指し："
    + Number(d.chromeSelected||0) + "回）　記録 " + (d.at || "無し");
  if(used > 0) $("braveLine").className = "nums red";
}).catch(function(){ put("braveLine","Braveで操作した回数　0回（browser.json がまだ無い）"); });

/* ループの計器盤（1142番）。判定は hantei.py 側で済んでいる */
getJson("status/public/loop.json").then(function(d){
  $("loopCard").style.display = "";
  var a = d.atama;
  $("loopAtama").textContent = a ? (a.label + "　" + a.value + a.unit) : "赤はありません";
  if(a) $("loopAtama").className = "red";
  $("loopNao").textContent = a ? (a.why + "　→　" + a.nao) : "";
  var g = $("loopGrid"); g.innerHTML = "";
  (d.cards||[]).forEach(function(c){
    var box = document.createElement("div");
    box.style.cssText = "border:1px solid #eee7dc;border-radius:10px;padding:10px 11px";
    var v = document.createElement("div");
    v.style.cssText = "font-size:22px;font-weight:700;font-variant-numeric:tabular-nums";
    if(c.red) v.style.color = "var(--red)";
    v.textContent = (c.value===null?"—":c.value)+c.unit;
    var l = document.createElement("div");
    l.style.cssText = "font-size:14px;margin-top:3px;font-weight:600";
    l.textContent = c.label;
    var s = document.createElement("div");
    s.style.cssText = "font-size:12px;color:#7a7268;margin-top:2px";
    s.textContent = c.sub || "";
    box.appendChild(v); box.appendChild(l); box.appendChild(s); g.appendChild(box);
  });
  $("loopStamp").textContent = "測ったのは " + d.at + "　／　赤 " + d.akaN + "個";
}).catch(function(){});

/* 宿題台帳の1行（1138番） */
getJson("status/public/shukudai.json").then(function(d){
  var t = d.tally || {};
  put("shukudaiSum", "未完了 " + t.open + "件 ／ 今日減った " + t.closedToday + "件");
}).catch(function(){ put("shukudaiSum","shukudai.json が取れません"); });

/* お金・フォルダ・掃除 */
Promise.all([
  getJson("status/public/fal_cost_ledger.json").catch(function(){ return null; }),
  getJson("status/public/gaibu.json").catch(function(){ return null; }),
  getJson("status/public/machine.json").catch(function(){ return null; }),
  getJson("status/public/mac_souji.json").catch(function(){ return null; })
]).then(function(a){
  var fal=a[0], gaibu=a[1], mac=a[2], souji=a[3], rows=[];
  var falMonth = fal && fal.summary ? fal.summary.thisMonthTotalYen : null;
  var soto = gaibu && gaibu.summary ? gaibu.summary.totalCostYen : null;
  var month = (falMonth==null && soto==null) ? null : (falMonth||0)+(soto||0);
  rows.push('<li>お金　今月 <b>' + yen(month) + '</b><div class="nums">fal ' + yen(falMonth)
    + ' ＋ 外に出した仕事 ' + yen(soto) + '。OpenAI・xAI・Lovableは未取得</div></li>');
  var free = mac ? mac.diskFreeGB : null;
  rows.push('<li>フォルダ　空き ' + (free==null ? '未取得' : Math.round(free)+'GB') + '</li>');
  if(!souji){ rows.push('<li>掃除　未取得</li>'); }
  else{
    var runs=Number(souji.runs||0), total=Number(souji.totalFreedBytes||0);
    var bad = (runs>0 && total<=0) || runs===0;
    rows.push('<li' + (bad?' class="red"':'') + '>毎週のMac掃除　'
      + (bad ? (runs===0?'まだ1回も掃けていません':'走った'+runs+'回・片付いた0バイト')
             : '累計 ' + esc(souji.totalFreedHuman||'') + ' 片付いた') + '</li>');
  }
  $("cash").innerHTML = rows.join("");
});

/* 鍵・つながり */
getJson("status/public/kagi_daicho_top.json").then(function(d){
  var k = d && d.kasegi;
  $("kagi").innerHTML = (k ? '<b>' + esc(k.line||"") + '</b>'
      + (k.karamawashi ? '<div class="nums">うち空回し ' + esc(k.karamawashi) + '本（数に入れていません）</div>' : '')
      + (k.blocked ? '<div class="nums">止めているもの：' + esc(k.blocked) + '</div>' : '')
    : '走った／取れたの数を数える係が、まだ一度も回っていません')
    + (d && d.redCount > 0 ? '<div class="nums"><a href="969-kagi-daicho.html">赤 ' + d.redCount + '件：台帳を開く</a></div>' : '');
}).catch(function(){ put("kagi","kagi_daicho_top.json がまだ書かれていません"); });

/* 外部AIの検品 */
getJson("status/public/kenpin_mieru.json").then(function(j){
  var cases = (j && j.cases) || [];
  $("kenpin").innerHTML = cases.length ? cases.slice(0,20).map(function(c){
    return '<li><b>' + esc(c.n) + '号</b> ' + (c.passed ? "PASS" : "まだ通っていない")
      + '<div class="nums">' + esc(c.rounds) + '往復／直させた' + esc(c.fixes) + '回'
      + (c.title ? '<br>' + esc(c.title) : '') + '</div></li>';
  }).join("") : '<li class="nums">記録がありません</li>';
}).catch(function(){ $("kenpin").innerHTML = '<li class="nums">kenpin_mieru.json がまだ書かれていません</li>'; });

/* 受け取り待ち */
getJson("status/public/uketori_machi.json").then(function(d){
  var ok = (d && d.goukaku) || [], ng = (d && d.sonota) || [];
  $("uketori").innerHTML = (ok.length || ng.length) ? ok.concat(ng).map(function(x){
    var url = String(x.url||"");
    return '<li><b>' + esc(x.title||"") + '</b><div class="nums">' + esc(x.who||x.author||"?") + ' が運んできた</div>'
      + (/^https:\/\/github\.com\//.test(url) ? '<div><a href="' + esc(url) + '">PRを開く</a></div>' : '')
      + '</li>';
  }).join("") : '<li class="nums">ありません</li>';
}).catch(function(){ $("uketori").innerHTML = '<li class="nums">uketori_machi.json がまだ書かれていません</li>'; });

/* 公式のアップデート */
getJson("status/public/koushiki_updates.json").then(function(j){
  var items = (j && j.items) || [];
  $("koushiki").innerHTML = items.length ? items.slice(0,12).map(function(it){
    return '<li>' + (it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a>' : esc(it.title))
      + '<div class="nums">' + esc(it.source||"") + ' ' + esc(it.date||"") + '</div></li>';
  }).join("") : '<li class="nums">今日は拾えたものがありません</li>';
}).catch(function(){ $("koushiki").innerHTML = '<li class="nums">koushiki_updates.json を拾う係がまだ回っていません</li>'; });
</script>
</body>
</html>
