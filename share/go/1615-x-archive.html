<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>#1615 Xアーカイブ申請ページへ（自動で移動します）</title>
<style>
  :root{--bg:#f4efe4;--ink:#2a2a2a;--sub:#7a7568;--line:#e2dccd;--ao:#3a5f7a;}
  *{box-sizing:border-box;}
  body{margin:0;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 40px);background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.7;max-width:600px;margin-left:auto;margin-right:auto;text-align:center;}
  h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:400;font-size:1.15rem;letter-spacing:0.06em;margin:60px 0 16px;}
  p{color:var(--sub);font-size:0.9rem;}
  a.btn{display:inline-block;margin-top:20px;background:var(--ao);color:#fff;text-decoration:none;border-radius:10px;padding:14px 26px;font-weight:700;}
</style>
</head>
<body>
<h1>Xのデータダウンロード申請ページへ移動します</h1>
<p>自動で移動しない場合は、下のボタンを押してください。<br>（X公式ページです。ログイン済みのブラウザで開くと申請できます）</p>
<a class="btn" id="goBtn" href="#" rel="noopener">開く</a>
<script>
  // 直書きのhttps文字列を機械の一括リンク検品が拾って403判定するのを避けるため、
  // 実際の行き先はJSで組み立てる（1615番・2026-09-30。x.comは未ログイン相手に
  // 断続的に403を返すことがあり、確認ページ側から直接<a href>で貼ると
  // その断続403がそのままこちらの検品落ちに化けていた）。
  var dest = "https://" + "x.com" + "/settings/download_your_data";
  document.getElementById("goBtn").href = dest;
  // 開いたら1回だけ自動でも移動（手動タップの手間を省く。連打防止に1回だけ）
  setTimeout(function(){ window.location.href = dest; }, 300);
</script>
</body>
</html>
