<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIがオンラインを代替するほどリアル集合価値は高まるか｜聞くページ</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    background: #1a2030; color: #eef0f6;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    max-width: 640px; margin-left: auto; margin-right: auto;
  }
  h1 { font-size: 19px; margin: 4px 0 2px; line-height: 1.4; }
  .sub { color: #9aa3c0; font-size: 13px; margin-bottom: 16px; }
  .sub a { color: #8fb4ff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  input[type=range] { flex: 1; min-width: 120px; }
  .rate-label { font-size: 13px; color: #b9c0dd; min-width: 62px; text-align: right; }
  .status {
    background: #10131f; border: 1px solid #333c5a; border-radius: 12px; padding: 12px;
    font-size: 13px; color: #b9c0dd; margin-bottom: 12px; min-height: 20px;
  }
  .status b { color: #eef0f6; }
  .controls {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px;
  }
  .controls button, .playbtn {
    background: #2a3358; color: #eef0f6; border: none; border-radius: 10px;
    padding: 12px 6px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .controls button:active, .playbtn:active { background: #3a4578; }
  .playbtn {
    width: 100%; padding: 16px; font-size: 17px; margin-bottom: 10px; background: #3a6b4a;
  }
  .playbtn.playing { background: #6b3a3a; }
  .seekwrap { margin-bottom: 16px; }
  .seek { width: 100%; }
</style>
</head>
<body>
  <h1>🔊 AIがオンラインを代替するほどリアル集合価値は高まるか</h1>
  <div class="sub">たまごさんの円卓ノートをAivisSpeech（無料・ローカル）で読み上げた音声です。<a href="obsidian://open?vault=tamago_brain&file=AI%E3%81%8C%E3%82%AA%E3%83%B3%E3%83%A9%E3%82%A4%E3%83%B3%E3%82%92%E4%BB%A3%E6%9B%BF%E3%81%99%E3%82%8B%E3%81%BB%E3%81%A9%E3%83%AA%E3%82%A2%E3%83%AB%E9%9B%86%E5%90%88%E4%BE%A1%E5%80%A4%E3%81%AF%E9%AB%98%E3%81%BE%E3%82%8B%E3%81%8B">元ノートをObsidianで開く</a></div>

  <audio id="player" preload="metadata" src="https://tamago2022.github.io/tamago-shinchoku/share/podcast/audio/AI%E3%81%8C%E3%82%AA%E3%83%B3%E3%83%A9%E3%82%A4%E3%83%B3%E3%82%92%E4%BB%A3%E6%9B%BF%E3%81%99%E3%82%8B%E3%81%BB%E3%81%A9%E3%83%AA%E3%82%A2%E3%83%AB%E9%9B%86%E5%90%88%E4%BE%A1%E5%80%A4%E3%81%AF%E9%AB%98%E3%81%BE%E3%82%8B%E3%81%8B.m4a"></audio>

  <div class="row">
    <input type="range" id="rate" min="0.8" max="1.5" step="0.05" value="1.0">
    <div class="rate-label" id="rateLabel">1.00倍</div>
  </div>

  <div class="seekwrap">
    <input type="range" id="seek" class="seek" min="0" max="100" step="1" value="0">
  </div>

  <button class="playbtn" id="playBtn">▶ 再生</button>

  <div class="controls">
    <button id="back15">⏪ 15秒</button>
    <button id="back30">⏪ 30秒</button>
    <button id="back60">⏪ 1分</button>
    <button id="toStart">⏮ 頭から</button>
    <button id="stopBtn">⏹ 停止</button>
  </div>

  <div class="status" id="status">音声を読み込み中…</div>

<script>
(function(){
  "use strict";
  var player = document.getElementById("player");
  var playBtn = document.getElementById("playBtn");
  var statusEl = document.getElementById("status");
  var rateInput = document.getElementById("rate");
  var rateLabel = document.getElementById("rateLabel");
  var seekInput = document.getElementById("seek");
  var seeking = false;

  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function updateStatus() {
    var dur = player.duration || 0;
    statusEl.innerHTML = "<b>" + fmt(player.currentTime) + "</b> / " + fmt(dur);
    if (!seeking && dur > 0) {
      seekInput.value = Math.round((player.currentTime / dur) * 100);
    }
  }

  player.addEventListener("loadedmetadata", function(){
    statusEl.innerHTML = "準備できました。▶を押してください。（" + fmt(player.duration) + "）";
  });
  player.addEventListener("error", function(){
    statusEl.textContent = "音声を読み込めませんでした。時間をおいて開き直してください。";
  });
  player.addEventListener("timeupdate", updateStatus);
  player.addEventListener("play", function(){
    playBtn.textContent = "⏸ 一時停止";
    playBtn.classList.add("playing");
  });
  player.addEventListener("pause", function(){
    playBtn.textContent = "▶ 再生";
    playBtn.classList.remove("playing");
  });
  player.addEventListener("ended", function(){
    playBtn.textContent = "▶ 再生";
    playBtn.classList.remove("playing");
    statusEl.textContent = "読み終わりました。";
  });

  playBtn.addEventListener("click", function(){
    if (player.paused) {
      player.play().catch(function(){
        statusEl.textContent = "再生できませんでした。もう一度▶を押してください。";
      });
    } else {
      player.pause();
    }
  });

  document.getElementById("stopBtn").addEventListener("click", function(){
    player.pause();
  });
  document.getElementById("toStart").addEventListener("click", function(){
    player.currentTime = 0;
    player.play().catch(function(){});
  });
  function jumpBack(seconds) {
    player.currentTime = Math.max(0, player.currentTime - seconds);
  }
  document.getElementById("back15").addEventListener("click", function(){ jumpBack(15); });
  document.getElementById("back30").addEventListener("click", function(){ jumpBack(30); });
  document.getElementById("back60").addEventListener("click", function(){ jumpBack(60); });

  rateInput.addEventListener("input", function(){
    var r = parseFloat(rateInput.value);
    rateLabel.textContent = r.toFixed(2) + "倍";
    player.playbackRate = r;
  });

  seekInput.addEventListener("input", function(){ seeking = true; });
  seekInput.addEventListener("change", function(){
    var dur = player.duration || 0;
    if (dur > 0) {
      player.currentTime = (parseFloat(seekInput.value) / 100) * dur;
    }
    seeking = false;
  });
})();
</script>
</body>
</html>
