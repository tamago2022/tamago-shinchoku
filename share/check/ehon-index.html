<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>絵本の夜</title>
<style>
  :root{ --night:#1B2A41; --paper:#E8DFCB; --fire:#D0703A; --dim:#B9AE93; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--night);color:var(--paper);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;}
  header{padding:46px 7% 26px}
  h1{margin:0;font-weight:400;font-size:15px;letter-spacing:9px;opacity:.85}
  h1 span{display:block;margin-top:8px;font-size:9.5px;letter-spacing:4.4px;color:var(--fire)}
  main{display:grid;gap:26px;padding:0 6% 64px;grid-template-columns:1fr}
  @media(min-width:880px){ main{grid-template-columns:repeat(3,1fr);gap:22px;padding:0 4.5% 80px} header{padding:56px 4.5% 30px} }
  figure{margin:0}
  .frame{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;background:var(--night)}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  figcaption{margin-top:12px;font-size:12px;letter-spacing:5px;opacity:.82}
  figcaption b{display:block;font-weight:400}
  figcaption em{display:block;margin-top:6px;font-style:normal;font-size:9px;letter-spacing:3.4px;color:var(--fire)}
  figcaption a{color:inherit;text-decoration:none}
  figcaption a:hover{opacity:.7}
</style>
</head><body>
<header><h1>絵本の夜<span>THREE NIGHTS</span></h1></header>
<main>
  <figure>
    <div class="frame"><iframe src="ehon-01-hanabi.html" title="夏の終わりの花火" loading="lazy"></iframe></div>
    <figcaption><a href="ehon-01-hanabi.html"><b>夏の終わりの花火</b><em>THE LAST FIREWORKS</em></a></figcaption>
  </figure>
  <figure>
    <div class="frame"><iframe src="ehon-02-hokyujo.html" title="ごきげん補給所の夜" loading="lazy"></iframe></div>
    <figcaption><a href="ehon-02-hokyujo.html"><b>ごきげん補給所の夜</b><em>JOY RELIEF STATION, AT NIGHT</em></a></figcaption>
  </figure>
  <figure>
    <div class="frame"><iframe src="ehon-03-tamago.html" title="卵が割れて中から光" loading="lazy"></iframe></div>
    <figcaption><a href="ehon-03-tamago.html"><b>卵が割れて中から光</b><em>THE EGG OPENS</em></a></figcaption>
  </figure>
</main>
</body></html>
