<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>投げ込み箱</title>
<!--
  1039番【投げ込み箱】2026-09-23 改（1036→1038→1039）
  たまごさん：「投げると、指示を送るって2つがあるから、一つでいいよ。」
              「棚一覧みたいのもボタンでつけてくれたら、そこを押して
                『これとこれとこれ、入れる方向性はこれ』みたいな。」
  ★送るボタンは1個。URLだけでも、喋っただけでも、片方だけで送れる。
  ★棚は押さなくても送れる（行き先未定のまま置ける）。
  ★Lovableの画面は一切通らない。書き先は Mac 側の status/nagekomi.jsonl だけ。
  道：このページ → 中継所(relay) → command_ingest({action:"nagekomi"}) → tools/nagekomi.py
  届かなかった分は端末に貯めて、開くたびに勝手に再送する（黙って消えない）。
-->
<style>
  :root{ --ink:#1b1a17; --sub:#6f6a60; --line:#dcd6ca; --bg:#f6f3ec; --accent:#b4542a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
       padding:18px 16px 40px;line-height:1.7}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:.04em}
  .lead{font-size:12.5px;color:var(--sub);margin:0 0 18px}
  label{display:block;font-size:12.5px;color:var(--sub);margin:0 0 6px}
  input,textarea{width:100%;font-size:16px;font-family:inherit;color:var(--ink);
       background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 12px;line-height:1.6}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical}
  .field{margin-bottom:14px}
  button#send{width:100%;min-height:60px;font-size:18px;font-family:inherit;font-weight:600;
       color:#fff;background:var(--accent);border:0;border-radius:12px;letter-spacing:.08em}
  button#send:disabled{opacity:.45}
  /* ★棚ボタン：寝ながら片手で押せる大きさ（375pxで2列・高さ48px以上） */
  .tana{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 4px}
  .tana button{min-height:50px;padding:8px 10px;font-size:14px;font-family:inherit;
       color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;
       text-align:left;line-height:1.35;overflow:hidden}
  .tana button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  /* ★1050番：いま選んでいる棚を、色だけでなく文字で出す */
  .picked{margin:0 0 8px;font-size:13px;line-height:1.5;color:var(--sub)}
  .picked.on{color:var(--accent);font-weight:700}
  .tana button .w{display:block;font-size:11px;opacity:.6;margin-top:1px}
  .more{margin:8px 0 0;width:100%;min-height:44px;font-size:14px;font-family:inherit;
       background:#fff;color:var(--sub);border:1px dashed var(--line);border-radius:10px}
  .msg{margin-top:12px;font-size:13.5px;min-height:20px}
  .ok{color:#2c6e49} .ng{color:#a3321f}
  .queue{margin-top:18px;font-size:12.5px;color:var(--sub)}
  .queue b{color:var(--accent)}
  .hint{font-size:12px;color:var(--sub);margin:0 0 10px}
  .nomu{width:100%;min-height:44px;margin-top:10px;border-radius:12px;border:1px solid #d9d2c4;
        background:#fff;color:#4a4034;font-size:14px;line-height:1.4}
  .diag{margin-top:10px;padding:8px 10px;border-radius:10px;background:#f4f1ea;
        border:1px solid #e2dccf;font-size:11.5px;line-height:1.6;color:#5c5346;
        white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto}
</style>
</head>
<body>

<h1>投げ込み箱</h1>
<p class="lead">URLを貼る。棚を押す。喋る。──どれか1つでも送れます。<br>
入れるのは夜中0時にまとめて。朝には棚に出ています。</p>

<div class="field">
  <label for="u">URL（なくてもいい）</label>
  <input id="u" type="url" inputmode="url" autocomplete="off" autocapitalize="off"
         spellcheck="false" placeholder="https://…" enterkeyhint="done">
</div>

<div class="field">
  <label for="m">言いたいこと（なくてもいい・マイクキーで喋れる）</label>
  <textarea id="m" rows="4" placeholder="例：これ猫の棚。方向性はしょうもない事件にする感じで。キャッチコピーは『昼寝の天才』"></textarea>
</div>

<div class="field">
  <label for="f">行き先の棚（押さなくていい。あとで決められます）</label>
  <input id="f" type="search" inputmode="search" autocomplete="off" autocapitalize="off"
         spellcheck="false" placeholder="棚をしぼる（例：猫／音楽／80）" style="margin-bottom:8px">
  <p class="picked" id="tanaPicked">行き先：まだ決めていない（このままでも送れます）</p>
  <div class="tana" id="tana"></div>
  <button class="more" id="more" hidden>もっと見る</button>
  <p class="hint" id="tanaNote" style="margin-top:8px"></p>
</div>

<button id="send">投 げ る</button>
<div class="msg" id="msg"></div>
<div class="queue" id="q"></div>
<!-- ★1043番：端末に残った分を吐き出す口。スマホではconsoleが見えないので、
     送った結果と理由を画面に出す（黙って失敗させないため） -->
<button id="nomu" class="nomu" type="button">この端末に残っている分を今すぐ送る</button>
<pre id="diag" class="diag" hidden></pre>

<!-- 1042番：何が入ってきたかの一覧へ1タップ（進捗表には入れない） -->
<a href="./nagekomi-list-24b9dbaae07c4103.html" 
   style="display:block;margin:18px 0 0;min-height:52px;line-height:52px;text-align:center;font-size:15px;font-weight:600;color:#b4542a;background:#fff;border:1px solid #dcd6ca;border-radius:12px;text-decoration:none">入ってきたものを見る</a>

<script>
/* 中継所の場所（進捗表と同じ status/public/relay.json）。トンネルURLは変わるので毎回読む */
var RELAY = null;
var HEAD = {"Content-Type":"application/json","bypass-tunnel-reminder":"1"};
var KEY = "nagekomi_pending_v1";
var SHELF = null;      /* 押された棚。押さなければ null のまま */
var SHOW = 8;          /* 最初に見せる棚の数 */
var LIST = [];

function pending(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ return []; } }
function savePending(a){ try{ localStorage.setItem(KEY, JSON.stringify(a)); }catch(e){} drawQ(); }
function drawQ(){
  var n = pending().length;
  document.getElementById("q").innerHTML = n
    ? "まだ届いていない分が <b>"+n+"件</b> あります（このページを開くたびに送り直します）"
    : "";
}
function relay(){
  return fetch("../status/public/relay.json?t="+Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ RELAY = j && j.url ? j.url.replace(/\/$/,"") : null; return RELAY; })
    .catch(function(){ return null; });
}
/* ★★1043番【黙って失敗させない】
   たまごさん（原文）「俺が入れたもの全然入ってないよ」
   前の版は fetch が失敗しても .catch で false を返すだけで、画面には
   「受け取りました（パソコンが今いないので…）」と**優しい嘘**を出していた。
   ＝押しても届いていないのに、届いたように見えていた。ここを全部やめる。
   ・失敗の**理由をそのまま画面に出す**（HTTP番号・エラー名・どこまで行ったか）
   ・window.onerror も拾って画面に出す（スマホではconsoleが見えないため）
   ・「貯まっている分を今すぐ送る」ボタンを置く（端末に残った分を吐き出す口） */
function diag(line){
  var d = document.getElementById("diag");
  if(!d) return;
  var t = new Date().toTimeString().slice(0,8);
  d.hidden = false;
  d.textContent = (t + "  " + line + "\n" + d.textContent).slice(0, 2000);
}
window.addEventListener("error", function(e){
  diag("画面の中でエラー: " + (e && e.message ? e.message : e));
});
window.addEventListener("unhandledrejection", function(e){
  diag("受け止められなかった失敗: " + (e && e.reason ? e.reason : e));
});

/* 送る。届けば {ok:true}。届かなければ {ok:false, why:"理由"} を返す。★falseだけ返さない */
function flush(){
  var a = pending();
  if(!a.length) return Promise.resolve({ok:true, n:0});
  return (RELAY ? Promise.resolve(RELAY) : relay()).then(function(u){
    if(!u) return {ok:false, why:"パソコンの居場所（relay.json）が読めませんでした"};
    diag("中継所へ送ります: " + u.replace(/^https?:\/\//,"").split(".")[0] + "… " + a.length + "件");
    return fetch(u+"/cmd", {method:"POST", mode:"cors", headers:HEAD,
                            body:JSON.stringify({commands:a})})
      .then(function(r){
        if(!r.ok) return r.text().then(function(t){
          throw new Error("中継所が HTTP " + r.status + " を返しました" +
                          (t ? "（" + t.slice(0,80) + "）" : ""));
        });
        return r.json();
      })
      .then(function(j){
        savePending([]);
        diag("届きました（中継所の返事あり）");
        return {ok:true, n:a.length, body:j};
      })
      .catch(function(e){
        var why = (e && e.message) ? e.message : String(e);
        /* ★ここに落ちる代表例：CORSのpreflightで止められた（ブラウザは理由を
           "Failed to fetch"／"Load failed" しか教えない）。だから見当を添える。 */
        if(/failed to fetch|load failed|networkerror/i.test(why)){
          why = why + " ／ 中継所まで1バイトも出ていません（回線が落ちている、" +
                "パソコンが寝ている、またはブラウザが止めた）";
        }
        diag("届きませんでした: " + why);
        return {ok:false, why:why};
      });
  });
}
function push(cmd){
  var a = pending(); a.push(cmd); savePending(a);
  return flush();
}
function say(text, ok){
  var d = document.getElementById("msg");
  d.textContent = text; d.className = "msg " + (ok ? "ok" : "ng");
}

/* ---- ★棚一覧：手打ちしない。Mac側が棚の正本から吐いた一覧を読む ---- */
/* しぼり込み。棚が174件あるので、これが無いと寝ながらは押せない。
   押した棚は、しぼり込みから外れても先頭に残す（消えたように見えないため）。 */
function filtered(){
  var q = (document.getElementById("f").value || "").trim().toLowerCase();
  var a = LIST;
  if(q) a = LIST.filter(function(s){
    return (s.title+" "+(s.world||"")).toLowerCase().indexOf(q) >= 0; });
  if(SHELF && !a.some(function(s){ return s.title === SHELF.title; })) a = [SHELF].concat(a);
  return a;
}
/* ★1050番：押したのに画面が1ミリも変わらなかった。
   直す前は、押しても変わるのは aria-pressed の false→true（たった1文字）だけ。
   色は付いても「いま何を選んだか」が文字で出ないので、
   寝ながら片手で押しているたまごさんには**押せたかどうかが分からない**。
   → 押した棚は ✓ を付けて文字ごと変える／上に「行き先：「◯◯」の棚」を必ず出す。 */
function drawTana(){
  var box = document.getElementById("tana");
  var p = document.getElementById("tanaPicked");
  var f = document.getElementById("f");
  var more = document.getElementById("more");
  /* ★1050番：選んだら、棚の一覧は畳んで**選んだ1つだけ**にする。
     押したのかどうかが一目で分かる／寝ながら片手のときに画面から迷子が消える。
     もう一度押せば一覧に戻る（選び直せる）。 */
  if(SHELF){
    box.innerHTML = "";
    var one = document.createElement("button");
    one.type = "button";
    one.setAttribute("aria-pressed", "true");
    one.style.gridColumn = "1/3";
    one.innerHTML = "<span>✓ 「"+SHELF.title.replace(/[<>&]/g,"")+"」の棚へ入れます</span>"
                  + "<span class='w'>押すと選び直せます</span>";
    one.addEventListener("click", function(){ SHELF = null; SHOW = 8; drawTana(); });
    box.appendChild(one);
    if(f){ f.hidden = true; }
    more.hidden = true;
    if(p){ p.textContent = "行き先：「"+SHELF.title+"」の棚"; p.className = "picked on"; }
    return;
  }
  if(f){ f.hidden = false; }
  if(p){ p.textContent = "行き先：まだ決めていない（このままでも送れます）"; p.className = "picked"; }
  var A = filtered();
  box.innerHTML = "";
  var n = Math.min(SHOW, A.length);
  for(var i=0;i<n;i++){
    (function(s){
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = "<span>"+s.title.replace(/[<>&]/g,"")+"</span>"
                  + (s.world ? "<span class='w'>"+s.world.replace(/[<>&]/g,"")+"</span>" : "");
      b.addEventListener("click", function(){ SHELF = s; drawTana(); });
      box.appendChild(b);
    })(A[i]);
  }
  more.hidden = A.length <= SHOW;
  more.textContent = "もっと見る（あと "+(A.length-SHOW)+"）";
  if(!A.length) box.innerHTML = "<p class='hint' style='grid-column:1/3;margin:0'>その言葉の棚は見つかりません（押さずに送れます）</p>";
}
document.getElementById("more").addEventListener("click", function(){ SHOW += 12; drawTana(); });
document.getElementById("f").addEventListener("input", function(){ SHOW = 8; drawTana(); });

fetch("../status/public/tana_ichiran.json?t="+Date.now(), {cache:"no-store"})
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(j){
    LIST = (j && j.shelves) || [];
    document.getElementById("tanaNote").textContent =
      LIST.length ? ("棚 "+LIST.length+"件（"+(j.at||"")+"時点の棚の正本から）")
                  : "棚の一覧がまだ届いていません。押さずにそのまま送れます。";
    drawTana();
  })
  .catch(function(){
    document.getElementById("tanaNote").textContent =
      "棚の一覧が読めませんでした。押さずにそのまま送れます。";
  });

/* ---- ★送るボタンは1個。URLだけ／喋っただけ、どちらでも通す ---- */
document.getElementById("send").addEventListener("click", function(){
  var u = document.getElementById("u").value.trim();
  var m = document.getElementById("m").value.trim();
  if(!u && !m && !SHELF){ say("URLか、言いたいことか、棚。どれか1つは入れてください", false); return; }
  if(u && !/^https?:\/\//.test(u)){ say("URLは https で始まるものを貼ってください", false); return; }

  var b = this; b.disabled = true; say("送っています…", true);
  var stamp = new Date().toISOString();
  var tag = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  var cmds = [];
  /* ★1043番：URLの末尾に ?kikai=1 が付いているときは「機械の試し投げ」の印をつける。
     こうすると**たまごさんと1文字も違わない道**を機械が通って実測できるのに、
     たまごさんの一覧には1件も混ざらない。（印は台帳の source 列になる） */
  var KIKAI = /[?&]kikai=1/.test(location.search);
  if(u){
    cmds.push({ id:"nk"+tag, action:"nagekomi", target:u, memo:m, label:"投げ込み",
                shelf: SHELF ? SHELF.title : null,
                shelfId: SHELF ? SHELF.id : null,
                test: KIKAI, requestedAt:stamp });
  }
  if(m && !u){
    /* URLが無いときは「あとでまとめて喋った指示」として1行残す（前と同じ置き場） */
    cmds.push({ id:"ns"+tag, action:"nagekomi_shiji", target:m, label:"振り分けの指示",
                shelf: SHELF ? SHELF.title : null, requestedAt:stamp });
  }
  if(!u && !m && SHELF){
    cmds.push({ id:"ns"+tag, action:"nagekomi_shiji",
                target:"行き先だけ：「"+SHELF.title+"」の棚", label:"振り分けの指示",
                shelf: SHELF.title, requestedAt:stamp });
  }

  var chain = Promise.resolve({ok:true});
  cmds.forEach(function(c){ chain = chain.then(function(prev){
    return push(c).then(function(r){
      return (prev.ok && r.ok) ? {ok:true} : {ok:false, why:(prev.why || r.why)}; }); }); });

  chain.then(function(res){
    b.disabled = false;
    var where = SHELF ? ("「"+SHELF.title+"」の棚へ。") : "棚はあとで決めていい。";
    if(res && res.ok){
      /* ★届いたときだけ欄を空にする。届いていないのに消すと、書いた言葉が消える */
      document.getElementById("u").value = "";
      document.getElementById("m").value = "";
      SHELF = null; drawTana();
      say("届きました。"+where+"夜中0時にまとめて棚へ入れます。", true);
    }else{
      /* ★優しい嘘をやめる。届いていないと言う。中身はこの端末に残してある */
      say("届きませんでした。" + ((res && res.why) ? res.why : "理由が取れませんでした") +
          " ／ 書いた中身はこの端末に "+pending().length+"件 残してあります（下の［今すぐ送る］で送り直せます）",
          false);
    }
  });
});

document.getElementById("nomu").addEventListener("click", function(){
  var n = pending().length;
  if(!n){ say("この端末に残っている分はありません。", true); return; }
  say("残っている "+n+"件 を送っています…", true);
  relay().then(flush).then(function(r){
    say(r && r.ok ? ("残っていた "+n+"件、届きました。")
                  : ("まだ届きません。" + ((r && r.why) || "理由が取れませんでした")), !!(r && r.ok));
  });
});

drawQ();
relay().then(flush);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) relay().then(flush); });
</script>
</body>
</html>
