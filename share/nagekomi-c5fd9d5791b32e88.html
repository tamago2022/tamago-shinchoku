<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>投げ込み箱</title>
<!--
  1036番【投げ込み箱】2026-09-23
  たまごさん：「棚に置こうとしたらジャーンって落ちる。だから放り込んでおくとこが欲しい」
  ★Lovableの棚には一切触らない。書き先は Mac 側の status/nagekomi.jsonl だけ。
  ★入るのは URL 1本と、任意で一言だけ。3秒で投げられること。
  道：このページ → 中継所(relay) → command_ingest.process({action:"nagekomi"}) → tools/nagekomi.py
      進捗表のボタンと同じ、実績のある道に相乗りする（新しい常駐を作らない）。
  届かなかった分は端末に貯めて、開くたびに勝手に再送する（黙って消えない）。
-->
<style>
  :root{ --ink:#1b1a17; --sub:#6f6a60; --line:#dcd6ca; --bg:#f6f3ec; --accent:#b4542a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
       padding:18px 16px 60px;line-height:1.7}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:.04em}
  .lead{font-size:12.5px;color:var(--sub);margin:0 0 18px}
  label{display:block;font-size:12.5px;color:var(--sub);margin:0 0 6px}
  input,textarea{width:100%;font-size:16px;font-family:inherit;color:var(--ink);
       background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 12px;line-height:1.6}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical}
  .field{margin-bottom:14px}
  button{width:100%;min-height:56px;font-size:17px;font-family:inherit;font-weight:600;
       color:#fff;background:var(--accent);border:0;border-radius:12px;letter-spacing:.06em}
  button:disabled{opacity:.45}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;min-height:50px;font-size:15px}
  .msg{margin-top:12px;font-size:13.5px;min-height:20px}
  .ok{color:#2c6e49} .ng{color:#a3321f}
  hr{border:0;border-top:1px solid var(--line);margin:30px 0 22px}
  h2{font-size:15px;margin:0 0 2px}
  .hint{font-size:12px;color:var(--sub);margin:0 0 12px}
  .queue{margin-top:22px;font-size:12.5px;color:var(--sub)}
  .queue b{color:var(--accent)}
</style>
</head>
<body>

<h1>投げ込み箱</h1>
<p class="lead">棚に置く前の仮置き場。URLを貼って送るだけ。どの棚かは、あとで決めていい。</p>

<div class="field">
  <label for="u">URL（1本）</label>
  <input id="u" type="url" inputmode="url" autocomplete="off" autocapitalize="off"
         spellcheck="false" placeholder="https://…" enterkeyhint="send">
</div>
<div class="field">
  <label for="m">一言（なくていい・マイクキーで喋れる）</label>
  <input id="m" type="text" placeholder="例：ボンジョビおじさんの棚っぽい">
</div>
<button id="send">投 げ る</button>
<div class="msg" id="msg"></div>
<div class="queue" id="q"></div>

<hr>

<h2>あとでまとめて喋る</h2>
<p class="hint">どの棚に置くか、コピーの方向。ここに喋って送ると、箱の中身に反映する用の指示として残る。<br>
キーボードのマイクキーを押して、そのまま喋ればいい。</p>
<div class="field">
  <textarea id="s" rows="5" placeholder="例：さっきのYouTubeのやつはボンジョビおじさんの棚。コピーは事件にする方向で。赤ちゃんのやつは保留。"></textarea>
</div>
<button id="sendS" class="ghost">この指示を送る</button>
<div class="msg" id="msgS"></div>

<script>
/* 中継所の場所（進捗表と同じ status/public/relay.json を読む）。トンネルURLは変わるので毎回読む */
var RELAY = null;
var HEAD = {"Content-Type":"application/json","bypass-tunnel-reminder":"1"};
var KEY = "nagekomi_pending_v1";

function pending(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ return []; } }
function savePending(a){ try{ localStorage.setItem(KEY, JSON.stringify(a)); }catch(e){} drawQ(); }
function drawQ(){
  var n = pending().length;
  document.getElementById("q").innerHTML = n
    ? "まだ届いていない分が <b>"+n+"件</b> あります（このページを開くたびに送り直します）"
    : "";
}
function relay(){
  return fetch("../status/public/relay.json?t="+Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ RELAY = j && j.url ? j.url.replace(/\/$/,"") : null; return RELAY; })
    .catch(function(){ return null; });
}
function flush(){
  var a = pending();
  if(!a.length) return Promise.resolve(true);
  return (RELAY ? Promise.resolve(RELAY) : relay()).then(function(u){
    if(!u) return false;
    return fetch(u+"/cmd", {method:"POST", mode:"cors", headers:HEAD,
                            body:JSON.stringify({commands:a})})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(){ savePending([]); return true; })
      .catch(function(){ return false; });
  });
}
function push(cmd){
  var a = pending(); a.push(cmd); savePending(a);
  return flush();
}
function say(el, text, ok){
  var d = document.getElementById(el);
  d.textContent = text; d.className = "msg " + (ok ? "ok" : "ng");
}

document.getElementById("send").addEventListener("click", function(){
  var u = document.getElementById("u").value.trim();
  var m = document.getElementById("m").value.trim();
  if(!/^https?:\/\//.test(u)){ say("msg","URLを貼ってください（https で始まるもの）", false); return; }
  var b = this; b.disabled = true; say("msg","送っています…", true);
  push({ id:"nk"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
         action:"nagekomi", target:u, memo:m, label:"投げ込み",
         requestedAt:new Date().toISOString() })
  .then(function(ok){
    b.disabled = false;
    document.getElementById("u").value = "";
    document.getElementById("m").value = "";
    say("msg", ok ? "入りました。棚はあとで決めていい。"
                  : "受け取りました（パソコンが今いないので、届き次第まとめて送ります）", true);
  });
});

document.getElementById("sendS").addEventListener("click", function(){
  var t = document.getElementById("s").value.trim();
  if(!t){ say("msgS","中身が空です", false); return; }
  var b = this; b.disabled = true; say("msgS","送っています…", true);
  push({ id:"ns"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
         action:"nagekomi_shiji", target:t, label:"振り分けの指示",
         requestedAt:new Date().toISOString() })
  .then(function(ok){
    b.disabled = false;
    document.getElementById("s").value = "";
    say("msgS", ok ? "受け取りました。" : "受け取りました（届き次第まとめて送ります）", true);
  });
});

/* URL欄でEnter／改行キーを押したらそのまま送る（3秒で投げるため） */
document.getElementById("u").addEventListener("keydown", function(e){
  if(e.key === "Enter"){ e.preventDefault(); document.getElementById("send").click(); }
});

drawQ();
relay().then(flush);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) relay().then(flush); });
</script>
</body>
</html>
