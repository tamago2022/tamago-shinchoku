<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ずんだもん読み上げ機｜URLを貼るだけ</title>
<style>
  :root{
    --bg:#11100e; --ink:#f4efe6; --dim:#a39c8f;
    --zunda:#8fd14f; --line:#2b2924; --card:#1a1815;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
       line-height:1.7;padding:20px 16px 80px;}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.02em}
  h1 .leaf{color:var(--zunda)}
  .sub{color:var(--dim);font-size:13px;margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);
        border-radius:14px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  input[type=url],input[type=text],textarea{
    width:100%;background:#0c0b09;border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:12px;font-size:16px;font-family:inherit}
  textarea{min-height:110px;resize:vertical}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button{background:var(--zunda);color:#10240a;border:0;border-radius:999px;
         padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
  button:disabled{opacity:.4}
  .status{font-size:13px;color:var(--dim);margin-top:12px;min-height:20px}
  .status b{color:var(--zunda);font-weight:600}
  .body{font-size:14px;max-height:280px;overflow:auto;white-space:pre-wrap;
        border-top:1px solid var(--line);margin-top:14px;padding-top:12px;color:#ded7c9}
  .body .now{background:rgba(143,209,79,.18);border-radius:3px}
  .pill{display:inline-block;font-size:11px;border:1px solid var(--line);
        border-radius:999px;padding:3px 10px;color:var(--dim);margin-right:6px}
  .foot{color:#6f695e;font-size:12px;margin-top:24px}
  .ctl{position:fixed;left:0;right:0;bottom:0;background:rgba(17,16,14,.94);
       border-top:1px solid var(--line);padding:10px 16px;
       display:flex;gap:8px;justify-content:center;backdrop-filter:blur(8px)}
  .slider{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  input[type=range]{width:120px}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="leaf">🌱</span> ずんだもん読み上げ機</h1>
  <p class="sub">URLを貼ると、勝手に読み上げが始まります。</p>

  <div class="card">
    <label>URL（記事・note・obsidian:// のノートも可）</label>
    <input type="url" id="url" placeholder="https://… か obsidian://open?vault=…&file=…"
           autocomplete="off" inputmode="url">
    <div class="row">
      <button id="go">読み上げる</button>
      <button class="ghost" id="paste">貼り付けて読む</button>
    </div>
    <div class="status" id="st">待機中</div>
  </div>

  <div class="card" id="textCard" style="display:none">
    <label>読んでいる本文</label>
    <div class="body" id="body"></div>
  </div>

  <div class="card">
    <label>直接テキストを貼る</label>
    <textarea id="raw" placeholder="ここに文章を貼って「これを読む」でも動きます"></textarea>
    <div class="row"><button class="ghost" id="goRaw">これを読む</button></div>
  </div>

  <div class="card">
    <span class="pill" id="engPill">声：判定中</span>
    <span class="pill" id="voicePill">ずんだもん</span>
    <div class="slider" style="margin-top:12px">
      <span>速さ</span><input type="range" id="rate" min="0.7" max="1.8" step="0.05" value="1.1">
      <span id="rateV">1.10</span>
    </div>
  </div>

  <p class="foot">
    声はMacの中のVOICEVOX（ずんだもん）を使うので0円。<br>
    Macで開くとずんだもんの声、スマホで開くと端末の日本語の声に自動で切り替わります。<br>
    本文の抜き出しは r.jina.ai（無料のリーダー）経由。
  </p>
</div>

<div class="ctl">
  <button class="ghost" id="pause">一時停止</button>
  <button class="ghost" id="stop">止める</button>
</div>

<script>
const VV = "http://127.0.0.1:50021";      // Mac の中の VOICEVOX
const BRIDGE = "http://127.0.0.1:50022";  // Mac の中の Vault 橋（obsidian:// 用）
const SPEAKER = 3;                         // ずんだもん ノーマル
const CHUNK = 120;

const $ = id => document.getElementById(id);
let queue = [], idx = 0, playing = false, stopped = false, audio = null;
let engine = "checking";

function say(msg, hi){ $("st").innerHTML = hi ? "<b>"+msg+"</b>" : msg; }

// ---- 声の判定 ----
async function detectEngine(){
  try{
    const r = await fetch(VV + "/version", {mode:"cors"});
    if(r.ok){ engine = "voicevox"; $("engPill").textContent = "声：ずんだもん（VOICEVOX）"; return; }
  }catch(e){}
  engine = "web";
  $("engPill").textContent = "声：この端末の日本語の声";
  $("voicePill").textContent = "ずんだもんはMacで開いた時だけ";
}

// ---- 本文を取る ----
async function fetchText(u){
  u = u.trim();
  if(u.startsWith("obsidian://")){
    const q = new URL(u.replace("obsidian://","https://x/")).searchParams;
    const file = q.get("file") || "";
    const r = await fetch(BRIDGE + "/note?file=" + encodeURIComponent(file));
    if(!r.ok) throw new Error("Vaultの橋につながらない（Macで開いてください）");
    return await r.text();
  }
  const r = await fetch("https://r.jina.ai/" + u);
  if(!r.ok) throw new Error("本文が取れませんでした（" + r.status + "）");
  return await r.text();
}

function clean(t){
  return t
    .replace(/```[\s\S]*?```/g, "")
    .replace(/!?\[\[([^\]|]*\|)?([^\]]*)\]\]/g, "$2")
    .replace(/!?\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/https?:\/\/\S+/g, "")
    .replace(/^[\s|:\-=]{3,}$/gm, "")
    .replace(/[*_`>#]+/g, "")
    .replace(/[ \t]+/g, " ")
    .replace(/\n{2,}/g, "\n")
    .trim();
}

function toChunks(t){
  const out = []; let buf = "";
  for(const p of t.split(/(?<=[。！？\n])/)){
    const s = p.trim(); if(!s) continue;
    if((buf + s).length > CHUNK){ if(buf) out.push(buf); buf = s; }
    else buf += s;
  }
  if(buf) out.push(buf);
  return out.filter(c => /[ぁ-んァ-ヶ一-龠a-zA-Z0-9]/.test(c));
}

function render(){
  $("textCard").style.display = "block";
  $("body").innerHTML = queue.map((c,i) =>
    '<span class="'+(i===idx?'now':'')+'" id="c'+i+'">'+
    c.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</span>').join("");
  const el = $("c"+idx); if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
}

// ---- しゃべる ----
async function speakVV(text){
  const rate = parseFloat($("rate").value);
  const q = await (await fetch(VV+"/audio_query?text="+encodeURIComponent(text)+"&speaker="+SPEAKER,
                              {method:"POST"})).json();
  q.speedScale = rate;
  const wav = await (await fetch(VV+"/synthesis?speaker="+SPEAKER, {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(q)})).blob();
  return new Promise((res,rej)=>{
    audio = new Audio(URL.createObjectURL(wav));
    audio.onended = res; audio.onerror = rej;
    audio.play().catch(rej);
  });
}

function speakWeb(text){
  return new Promise(res=>{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = parseFloat($("rate").value);
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}

async function runQueue(){
  playing = true;
  while(idx < queue.length && !stopped){
    render();
    say("読み上げ中 " + (idx+1) + " / " + queue.length, true);
    try{
      if(engine === "voicevox") await speakVV(queue[idx]);
      else await speakWeb(queue[idx]);
    }catch(e){
      if(engine === "voicevox"){ engine = "web"; await detectEngine(); continue; }
      break;
    }
    idx++;
  }
  playing = false;
  if(!stopped && idx >= queue.length) say("読み終わりました");
}

async function start(text){
  stopAll();
  stopped = false;
  queue = toChunks(clean(text)); idx = 0;
  if(!queue.length){ say("読む文が見つかりませんでした"); return; }
  render();
  runQueue();
}

function stopAll(){
  stopped = true;
  if(audio){ audio.pause(); audio = null; }
  try{ speechSynthesis.cancel(); }catch(e){}
}

// ---- 入口 ----
async function fromUrl(u){
  if(!u){ say("URLを入れてください"); return; }
  say("本文を取っています…");
  try{ await start(await fetchText(u)); }
  catch(e){ say(e.message); }
}

$("go").onclick = () => fromUrl($("url").value);
$("goRaw").onclick = () => start($("raw").value);
$("stop").onclick = () => { stopAll(); say("止めました"); };
$("pause").onclick = () => {
  if(audio){ audio.paused ? audio.play() : audio.pause(); }
  else { speechSynthesis.speaking && !speechSynthesis.paused
         ? speechSynthesis.pause() : speechSynthesis.resume(); }
};
$("paste").onclick = async () => {
  try{
    const t = await navigator.clipboard.readText();
    if(/^(https?|obsidian):/.test(t.trim())){ $("url").value = t.trim(); fromUrl(t); }
    else { $("raw").value = t; start(t); }
  }catch(e){ say("クリップボードが読めませんでした。手で貼ってください"); }
};
$("rate").oninput = () => $("rateV").textContent = parseFloat($("rate").value).toFixed(2);

// URLを貼った瞬間に勝手に始まる
$("url").addEventListener("paste", e => {
  const t = (e.clipboardData||window.clipboardData).getData("text");
  if(t && /^(https?|obsidian):/.test(t.trim())){
    setTimeout(()=>fromUrl(t.trim()), 60);
  }
});

// ?u=… で開いたら即読み上げ（共有シートから飛ばせる）
detectEngine().then(()=>{
  const u = new URLSearchParams(location.search).get("u");
  if(u){ $("url").value = u; fromUrl(u); } else say("URLを貼ると勝手に始まります");
});
</script>
</body>
</html>
