<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>入ってきたもの</title>
<!--
  1042番【投げ込み箱の一覧】2026-09-23
  たまごさん：「今も一個入れたから、何が入ってきたかわかるようにしといてね。
                一応今テストでいくつか入れてみるから、反映されるかどうか見てるからね。」
  ★進捗表には入れない（重くなる）。箱と同じ推測されないURLの1枚。
  ★中身は status/public/nagekomi_list.json（tools/nagekomi_list.py が吐く写し）。
    台帳の原本(status/nagekomi.jsonl)は公開しない。出す列は写す側で名指ししてある。
  ★読む順番：中継所（Macの生の写し・押した瞬間に出る）→ 駄目ならGitHub Pagesの公開済みコピー。
    どちらも no-store なので、**開き直せば必ず最新**になる。
-->
<style>
  :root{ --ink:#1b1a17; --sub:#6f6a60; --line:#dcd6ca; --bg:#f6f3ec; --accent:#b4542a;
         --ok:#2c6e49; --ng:#a3321f; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
       padding:18px 14px 40px;line-height:1.65}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:.04em}
  .lead{font-size:12.5px;color:var(--sub);margin:0 0 14px}
  .bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .bar button{flex:1 1 auto;min-height:40px;padding:6px 8px;font-size:12.5px;font-family:inherit;
       background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:9px;white-space:nowrap}
  .bar button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  /* ★1050番：押したものを色だけでなく文字で出す */
  .picked{margin:0 0 10px;font-size:13px;line-height:1.5;color:var(--accent);font-weight:700}
  .modosu{width:100%;min-height:44px;margin:0 0 12px;font-size:14px;font-family:inherit;
       background:#fff;color:var(--sub);border:1px dashed var(--line);border-radius:10px}
  .row{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:0 0 8px}
  .top{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
  .at{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
  .ttl{font-size:14.5px;font-weight:600;margin:1px 0 3px;word-break:break-word}
  .meta{font-size:11.5px;color:var(--sub);word-break:break-word}
  .memo{font-size:12.5px;margin-top:5px;word-break:break-word}
  .st{font-size:11.5px;font-weight:600;white-space:nowrap}
  .st.a{color:var(--sub)} .st.b{color:var(--ok)} .st.c{color:var(--ng)}
  .why{font-size:11.5px;color:var(--ng);margin-top:3px}
  .foot{font-size:11.5px;color:var(--sub);margin-top:14px}
  .foot a{color:var(--accent)}
  .back{display:block;margin:16px 0 0;min-height:52px;line-height:52px;text-align:center;
       font-size:15px;font-weight:600;color:#fff;background:var(--accent);
       border-radius:12px;text-decoration:none}
  .empty{font-size:13px;color:var(--sub);padding:18px 2px}
</style>
</head>
<body>

<h1>入ってきたもの</h1>
<p class="lead">新しい順。開き直せば最新が出ます。</p>

<div class="bar" id="bar">
  <button data-f="" aria-pressed="false">ぜんぶ <span id="c0"></span></button>
  <button data-f="届いた" aria-pressed="false">届いた <span id="c1"></span></button>
  <button data-f="棚に入った" aria-pressed="false">棚に入った <span id="c2"></span></button>
  <button data-f="入れられない" aria-pressed="false">入れられない <span id="c3"></span></button>
</div>

<p class="picked" id="nowShowing">いま見ているもの：ぜんぶ</p>
<button class="modosu" id="modosu" type="button" hidden>ぜんぶに戻す</button>
<div id="list"><p class="empty">読み込んでいます…</p></div>

<p class="foot" id="foot"></p>
<a class="back" href="./nagekomi-c5fd9d5791b32e88.html">投げ込み箱にもどる</a>

<script>
var DATA = null, FILT = "", SEEN = "";
function stamp(){
  var d = new Date(), z = function(n){ return (n<10?"0":"")+n; };
  return z(d.getHours())+":"+z(d.getMinutes())+":"+z(d.getSeconds());
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function icon(k){ return k==="youtube" ? "▶" : (k==="x" ? "✕" : "・"); }

function stClass(s){ return s==="棚に入った" ? "b" : (s==="入れられない" ? "c" : "a"); }

/* ★1050番：押しても画面が1ミリも変わらなかった。
   押すと aria-pressed が1つ true→false、もう1つ false→true で**差し引きゼロ**。
   台帳が0件のときは中身も変わらないので、たまごさんには押せたかどうかが分からない。
   → 「いま見ているもの：◯◯」を必ず文字で出す。空のときも、どれを見て空なのかを出す。 */
function render(){
  var host = document.getElementById("list");
  var now = document.getElementById("nowShowing");
  if(now){ now.textContent = "いま見ているもの：" + (FILT || "ぜんぶ")
             + (SEEN ? "　／　" + SEEN + " に取り直しました" : ""); }
  var md = document.getElementById("modosu");
  if(md){ md.hidden = !FILT; }
  if(!DATA){ host.innerHTML = '<p class="empty">一覧がまだ読めません。少し待ってから開き直してください。</p>'; return; }
  var c = DATA.counts || {};
  document.getElementById("c0").textContent = DATA.shown || 0;
  document.getElementById("c1").textContent = c["届いた"] || 0;
  document.getElementById("c2").textContent = c["棚に入った"] || 0;
  document.getElementById("c3").textContent = c["入れられない"] || 0;

  var items = (DATA.items || []).filter(function(x){ return !FILT || x.state === FILT; });
  if(!items.length){ host.innerHTML = '<p class="empty">「' + esc(FILT || "ぜんぶ")
      + '」に当たるものは、まだ1件もありません。</p>'; return; }

  host.innerHTML = items.map(function(x){
    var meta = [x.channel, x.shelf].filter(Boolean).join(" ／ ");
    return '<div class="row">'
      + '<div class="top"><span class="at">' + esc(x.at) + '</span>'
      + '<span class="st ' + stClass(x.state) + '">' + esc(x.state) + '</span></div>'
      + '<div class="ttl">' + icon(x.kind) + " " + esc(x.title) + '</div>'
      + (meta ? '<div class="meta">' + esc(meta) + '</div>' : '')
      + (x.memo ? '<div class="memo">' + esc(x.memo) + '</div>' : '')
      + (x.why ? '<div class="why">' + esc(x.why) + '</div>' : '')
      + '</div>';
  }).join("");

  document.getElementById("foot").textContent =
    "台帳 " + (DATA.total||0) + "件のうち新しい " + (DATA.shown||0) + "件を表示 ／ 作り直し " + (DATA.builtAt||"不明");
}

document.getElementById("bar").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  FILT = b.getAttribute("data-f") || "";
  [].forEach.call(this.querySelectorAll("button"), function(x){
    x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
  /* ★1050番：押したら必ず最新を取り直す。
     たまごさんの「開き直せば最新が出ます」を、開き直さずに済むようにする。
     ＝どのボタンを押しても、更新時刻が進んで画面が必ず変わる。 */
  load();
  render();
});

/* ★1050番：中継所（localtunnel）は bypass-tunnel-reminder を付けないと
   511 Network Authentication Required を返す＝画面のconsoleに赤が出続けていた。
   投げ込み箱の側は最初から付けていた。こちらだけ付いていなかった。 */
document.getElementById("modosu").addEventListener("click", function(){
  FILT = "";
  [].forEach.call(document.querySelectorAll("#bar button"), function(x){
    x.setAttribute("aria-pressed", x.getAttribute("data-f") ? "false" : "true"); });
  load(); render();
});

function getJSON(u, head){
  return fetch(u + (u.indexOf("?")<0?"?":"&") + "t=" + Date.now(),
               head ? {cache:"no-store", headers:head} : {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
}

/* 中継所（Macの生の写し）を先に見る。駄目なら公開済みコピー。 */
/* ★1050番：本物のURL（https）から開いたときだけ中継所（Macの生の写し）を見る。
   写し（file:// や 127.0.0.1）から見に行くとブラウザに止められ、画面に赤が残るだけ。 */
function load(){
  if(location.protocol !== "https:"){
    return getJSON("../status/public/nagekomi_list.json").then(function(pub){
      DATA = pub; SEEN = stamp(); render(); });
  }
  return getJSON("../status/public/relay.json").then(function(j){
    var u = j && j.url ? j.url.replace(/\/$/,"") : null;
    return u ? getJSON(u + "/status/nagekomi_list.json",
                       {"bypass-tunnel-reminder":"1"}) : null;
  }).catch(function(){ return null; }).then(function(live){
    if(live && live.items) { DATA = live; SEEN = stamp(); render(); return; }
    return getJSON("../status/public/nagekomi_list.json").then(function(pub){
      DATA = pub; SEEN = stamp(); render();
    });
  });
}
load();
</script>
</body>
</html>
